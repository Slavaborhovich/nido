name: Deploy Nido

# main  -> https://slavaborhovich.github.io/nido/        (the real app)
# test  -> https://slavaborhovich.github.io/nido/test/   (test environment, separate data)
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: Checkout test
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: test, path: test }
      - name: Build site
        run: |
          mkdir -p _site/test
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '*.template.html' --exclude 'push-worker' --exclude 'firestore.rules' main/ _site/
          if [ -f test/index.html ]; then
            rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '*.template.html' --exclude 'push-worker' --exclude 'firestore.rules' test/ _site/test/
          else
            cp -r _site/index.html _site/manifest.webmanifest _site/sw.js _site/icons _site/test/
          fi
          # version stamp + release notes → the app shows a "new version" popup
          stamp () {   # $1 = source checkout, $2 = output dir
            local sha=$(git -C "$1" rev-parse --short HEAD)
            sed -i "s/__BUILD__/${sha}/" "$2/index.html"
            local notes=""; [ -f "$1/whatsnew.txt" ] && notes=$(cat "$1/whatsnew.txt")
            jq -n --arg b "$sha" --arg n "$notes" '{build:$b, notes:$n}' > "$2/version.json"
            rm -f "$2/whatsnew.txt"
          }
          stamp main _site
          if [ -f test/index.html ]; then stamp test _site/test; else stamp main _site/test; fi
          touch _site/.nojekyll
          ls -la _site _site/test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
