name: Deploy Nido

# main  -> https://slavaborhovich.github.io/nido/        (the real app)
# test  -> https://slavaborhovich.github.io/nido/test/   (test environment, separate data)
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: Checkout test
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: test, path: test }
      - name: Build site
        run: |
          mkdir -p _site/test
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '*.template.html' --exclude 'push-worker' --exclude 'firestore.rules' --exclude 'CLAUDE.md' main/ _site/
          if [ -f test/index.html ]; then
            rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '*.template.html' --exclude 'push-worker' --exclude 'firestore.rules' --exclude 'CLAUDE.md' test/ _site/test/
          else
            cp -r _site/index.html _site/manifest.webmanifest _site/sw.js _site/icons _site/test/
          fi
          # version stamp + release notes → the app shows a "new version" popup
          stamp () {   # $1 = source checkout, $2 = output dir
            local sha=$(git -C "$1" rev-parse --short HEAD)
            sed -i "s/__BUILD__/${sha}/" "$2/index.html"
            local notes=""; [ -f "$1/whatsnew.txt" ] && notes=$(cat "$1/whatsnew.txt")
            local silent=false; if printf '%s' "$notes" | head -1 | grep -qi '^#\s*silent'; then silent=true; notes=""; fi
            jq -n --arg b "$sha" --arg n "$notes" --argjson s "$silent" '{build:$b, notes:$n, silent:$s}' > "$2/version.json"
            rm -f "$2/whatsnew.txt"
          }
          stamp main _site
          if [ -f test/index.html ]; then stamp test _site/test; else stamp main _site/test; fi
          touch _site/.nojekyll
          ls -la _site _site/test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
      # "new version" push notification — only when this push added a release note to updates.json.
      # Needs the GitHub secret NIDO_ANNOUNCE_KEY (the same value as the Cloudflare secret ANNOUNCE_KEY). Without it: skipped.
      # Free: GitHub Actions on a public repo + one call to the free Cloudflare worker.
      - name: Announce the new version (push)
        if: github.event_name == 'push' && github.ref_name == 'main'   # prod only — test pushes never announce
        continue-on-error: true
        env:
          KEY: ${{ secrets.NIDO_ANNOUNCE_KEY }}
          BRANCH: ${{ github.ref_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          [ -n "$KEY" ] || { echo "NIDO_ANNOUNCE_KEY not set — skipping"; exit 0; }
          printf '%s' "$COMMITS" | grep -q 'updates.json' || { echo "no new release note — skipping"; exit 0; }
          if [ "$BRANCH" = "test" ]; then SRC=test; ENVN=test; else SRC=main; ENVN=prod; fi
          F="$SRC/updates.json"; [ -f "$F" ] || { echo "no updates.json — skipping"; exit 0; }
          TEXT=$(jq -r '.[0].text // ""' "$F")
          [ -n "$TEXT" ] || { echo "empty note — skipping"; exit 0; }
          HEAD=$(printf '%s\n' "$TEXT" | grep -m1 '^#' | sed -E 's/^#+[[:space:]]*//')
          TITLE="🆕 ${HEAD:-Nido עודכנה}"
          BODY=$(printf '%s\n' "$TEXT" | grep -E '^[[:space:]]*(•|\*|-)' | sed -E 's/^[[:space:]]*(•|\*|-)[[:space:]]*//' | paste -sd'|' | sed 's/|/ · /g')
          jq -n --arg e "$ENVN" --arg t "$TITLE" --arg b "$BODY" '{env:$e, title:$t, body:$b, tag:"update"}' > announce.json
          curl -sS --max-time 20 -X POST "https://nido-push.slava6195.workers.dev/announce" \
            -H "content-type: application/json" -H "x-nido-key: $KEY" --data @announce.json
