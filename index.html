<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Gveret+Levin&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1220; --bg-2:#101A2E; --surface:#15213A; --surface-hi:#1B2A48; --line:#22324F;
  --text:#E7ECF6; --muted:#8494B4; --faint:#5A6A8A;
  --blue:#7FB0FF; --blue-deep:#3E6FD8; --err:#FF9A8A; --gold:#F2C46B;
  --font:"Heebo","Segoe UI",Arial,sans-serif;
  --nav:64px; --navgap:calc(var(--nav) + 14px + 14px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0B1220; } }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -10%,#1A2C55 0%,transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:460px;margin:0 auto;padding:0 20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none}

/* ---------- Login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-block:56px}
.brand{text-align:center;margin-bottom:56px}
.mark{display:block;color:var(--blue)} .mark .glow{fill:var(--blue)}
.brand .logo{display:block;width:150px;height:auto;margin:0 auto 26px;filter:drop-shadow(0 4px 18px rgba(4,9,22,.55))}
.brand h1{font-family:"Playfair Display","Times New Roman",Georgia,serif;font-weight:500;font-size:64px;line-height:1;margin:0;color:#E9EDF5;direction:ltr}
.brand h1 em{font-style:italic}
.brand h1,.brand p{text-shadow:0 2px 18px rgba(4,9,22,.6)}
.brand p{font-weight:300;font-size:19px;color:#C9D1E1;margin:22px 0 0}
.demo{margin-top:40px;font-size:13px;color:var(--faint);text-align:center}


/* ---------- Login sky ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#login{position:relative;z-index:1}
#login .input{background:rgba(21,33,58,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#login .demo,.phase-demo button{text-shadow:0 1px 8px rgba(3,7,18,.9);color:#9AA8C4}
.phase-demo{display:flex;justify-content:center;gap:6px;margin-top:10px}
.phase-demo button{border:0;background:none;color:var(--faint);font-size:12px;padding:6px 8px;border-radius:8px}
.phase-demo button[aria-pressed="true"]{color:var(--muted);background:rgba(27,42,72,.6)}

/* ---------- Inputs ---------- */
.input,.textarea{width:100%;min-height:52px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:16px;transition:border-color .2s,background .2s}
.textarea{min-height:84px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input:focus,.textarea:focus{outline:none;border-color:var(--blue-deep);background:var(--surface-hi)}
input[type=date].input,input[type=time].input{direction:rtl}
.stack>*+*{margin-top:12px}
.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--blue-deep);color:#fff;font-weight:500;font-size:16px;transition:background .2s}
.primary:hover{background:#4A7CE6}
.primary:disabled{opacity:.4;cursor:default}
.secondary{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.danger{background:none;border:0;color:var(--err);font-size:15px;padding:10px;display:inline-flex;gap:6px;align-items:center}
.error{color:var(--err);font-size:14px;min-height:1.5em;margin:10px 0 0;text-align:center}
.lbl{font-size:13px;color:var(--muted);margin:0 2px 6px;display:block}

/* ---------- App shell ---------- */
#app{padding-bottom:calc(var(--navgap) + 20px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;min-height:64px;gap:12px}
.top h1{font-size:26px;font-weight:400;margin:0}
.top .title-sm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--muted)}
.top .title-sm .mark{width:22px;height:22px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.add-btn{height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--surface-hi);color:var(--blue);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.add-btn svg{width:18px;height:18px}

nav.tabs{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 14px;z-index:20;pointer-events:none}
nav.tabs .row{pointer-events:auto;max-width:432px;margin:0 auto;height:var(--nav);display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-radius:26px;
  background:rgba(19,30,51,.72);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid rgba(140,170,220,.16);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
nav.tabs button{height:46px;min-width:46px;border:0;background:none;color:var(--faint);display:flex;align-items:center;justify-content:center;gap:7px;border-radius:18px;font-size:13px;font-weight:500;padding:0 12px;transition:background .25s,color .25s,padding .25s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button span{display:none}
nav.tabs button[aria-current="page"]{color:#fff;background:linear-gradient(140deg,#4677E2,#3360C8);box-shadow:0 6px 16px rgba(61,110,220,.45);padding:0 16px}
nav.tabs button[aria-current="page"] span{display:inline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;list-style:none;margin:0;padding:4px 6px}
.section-title{font-size:14px;font-weight:500;color:var(--muted);margin:0 4px 12px}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:15px}

/* Person chip */
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#0B1220;background:var(--c)}
.who.none{color:var(--faint)}
.who svg{width:14px;height:14px;color:var(--c,var(--faint))}

/* ---------- Today ---------- */
.hello{padding:24px 0 36px}
.hello h2{font-weight:300;font-size:38px;line-height:1.15;margin:0}
.hello .date{margin:10px 0 0;color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.up{display:flex;align-items:center;gap:14px;padding:14px 10px;width:100%;border:0;background:none;text-align:right}
li+li .up{border-top:1px solid var(--line)}
.tile{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg-2);color:var(--blue)}
.up .body{flex:1;min-width:0}
.up .what{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .kind{font-size:13px;color:var(--faint)}
.up .when{flex:none;text-align:left;font-variant-numeric:tabular-nums}
.up .when .t{font-weight:500}
.up .when .d{font-size:13px;color:var(--muted)}
.up.now .when .d{color:var(--blue)}


/* ---------- Today · design A ---------- */
.t-head{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.t-date{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.t-date .pill{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.t-me{display:flex;align-items:center;gap:6px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#0A111F;background:linear-gradient(140deg,#9CC2FF,#5B8BEA);box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(140,170,220,.16)}
.t-greet{padding:14px 0 22px}
.t-greet h2{margin:0;font-weight:300;font-size:30px;letter-spacing:-.01em;line-height:1.2}
.t-greet h2 b{font-weight:600}
.t-greet p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.t-sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.t-sec h3{margin:0;font-size:15px;font-weight:600}
.t-sec h3 span{font-weight:400;color:var(--faint);margin-inline-start:6px}
.t-sec button{border:0;background:none;color:var(--blue);font-size:13px;padding:4px}
.next{display:block;width:100%;text-align:right;margin:0 0 12px;padding:18px 18px 16px;border-radius:24px;position:relative;overflow:hidden;color:var(--text);
  background:linear-gradient(150deg,#2B55B0 0%,#1C3570 48%,#14244A 100%);border:1px solid rgba(160,195,255,.18);box-shadow:0 16px 40px rgba(20,50,130,.35)}
.next::before{content:"";position:absolute;width:220px;height:220px;left:-70px;top:-110px;border-radius:50%;background:radial-gradient(rgba(150,195,255,.35),transparent 68%);pointer-events:none}
.next .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(10,17,31,.35);color:#D5E3FF;border:1px solid rgba(255,255,255,.08)}
.tag svg{width:13px;height:13px}
.tag i{width:6px;height:6px;border-radius:50%;background:#7CF0B4;box-shadow:0 0 0 3px rgba(124,240,180,.18)}
.next h4{position:relative;margin:16px 0 4px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.next .meta{position:relative;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#C8D7F5}
.next .meta span{display:inline-flex;align-items:center;gap:5px}
.next .meta svg{width:14px;height:14px}
.next .bar{position:relative;margin-top:18px;display:flex;align-items:flex-end;justify-content:space-between}
.count span{display:block;font-size:12px;color:#B5C8EE}
.count b{display:block;font-size:34px;font-weight:300;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prog{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#CFE0FF,#82B2FF)}
.cdE .lb{display:block;font-size:11.5px;letter-spacing:.06em;color:rgba(255,236,214,.65);margin-bottom:4px}
.cdE .nm{display:flex;align-items:flex-start;direction:ltr;gap:3px}
.cdE .u{display:flex;flex-direction:column;align-items:center;min-width:38px}
.cdE .u b{font-size:30px;font-weight:200;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.cdE .u small{font-size:9.5px;letter-spacing:.08em;color:rgba(255,236,214,.5);margin-top:6px}
.cdE .u.s b{opacity:.55}
.cdE .nm i{font-style:normal;font-size:22px;font-weight:200;opacity:.4;transform:translateY(2px)}
.cdE.long .row{display:flex;align-items:center;gap:14px}
.cdE.long .days{display:flex;align-items:baseline;gap:6px}
.cdE.long .days b{font-size:40px;font-weight:100;line-height:1}
.cdE.long .days span{font-size:12.5px;font-weight:300;letter-spacing:.1em;color:rgba(255,236,214,.75)}
.cdE.long .dv{width:1px;height:34px;background:rgba(255,236,214,.28)}
.cdE.long .clk{display:flex;align-items:flex-start;direction:ltr;gap:4px}
.cdE.long .u{min-width:28px}.cdE.long .u b{font-size:18px;letter-spacing:.03em}.cdE.long .u small{font-size:8.5px;margin-top:4px}
.cdE.long .clk i{font-style:normal;font-size:14px;font-weight:200;opacity:.35}
.prog.thin{height:2px;width:96px;background:rgba(255,255,255,.12)}
.prog.thin i{background:rgba(255,236,214,.75)}
.ty{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.ty svg{width:18px;height:18px}
.ty.ty-ev{background:rgba(130,178,255,.12);color:var(--blue)}
.ty.ty-tk{background:rgba(195,177,255,.12);color:#C3B1FF}
.ty.ty-sh{background:rgba(242,196,107,.12);color:var(--gold)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttile{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-height:128px;text-align:right;color:var(--text);width:100%}
.ttile .row{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.ttile .when{text-align:left;font-size:12px;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.ttile .when b{display:block;font-size:15px;color:var(--text);font-weight:500}
.ttile .w{font-size:15px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ttile .k{margin-top:4px;font-size:12px;color:var(--faint)}
.ttile .bot{margin-top:auto}
.item .box{position:relative}
.item .box::after{content:"";position:absolute;inset:-12px}
.item.pending .box{box-shadow:0 0 0 3px rgba(242,182,107,.25)}
.shop-tip{font-size:12px;color:var(--faint)}
.ttile{position:relative;overflow:hidden}
.ttile::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:linear-gradient(90deg,transparent,var(--oc,transparent),transparent);opacity:.85;pointer-events:none}
.ttile .when b{color:var(--oc,var(--text))}
.next::after{content:"";position:absolute;left:30px;right:30px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--oc,transparent),transparent);pointer-events:none}
.t-legend{justify-content:flex-start;margin:-4px 4px 12px}
.evtl{position:relative;margin:16px 0 2px}
.evtl .hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.06em;color:rgba(255,236,214,.6);padding:0 2px 6px}
.evtl .ct{display:flex;align-items:center;gap:8px}
.evtl .bar{width:60px;height:2px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}.evtl .bar b{display:block;height:100%;background:#FFE2B8}
.evtl .r{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:13.5px;color:#FBEBD6;border-top:1px solid rgba(255,230,200,.12);cursor:pointer}
.evtl .r .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evtl .r.done{opacity:.5}.evtl .r.done .t{text-decoration:line-through}
.evtl .c{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,236,214,.55);flex:none;display:grid;place-items:center;font-size:9px;font-style:normal}
.evtl .r.done .c{background:#FFE2B8;border-color:#FFE2B8;color:#5a3415}
.evtl .r > i:last-child{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:600;color:#1E140C;flex:none}
.evtl .r > i.none{background:rgba(255,236,214,.3);color:#5a3415}
.evtl .more{text-align:center;font-size:12px;color:rgba(255,236,214,.75);border-top:1px solid rgba(255,230,200,.12);padding-top:8px;cursor:pointer}
.evtags{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:16px 0 2px}
.evtag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 12px;border-radius:99px;background:rgba(30,18,8,.26);border:1px solid rgba(255,230,200,.18);font-size:12.5px;color:#FBEBD6;cursor:pointer;transition:opacity .2s,background .2s}
.evtag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:600;color:#1E140C}
.evtag i.none{background:rgba(255,236,214,.3);color:#5a3415}
.evtag.done{opacity:.5;text-decoration:line-through;background:rgba(30,18,8,.14)}
.evtag.more{padding:0 12px;color:rgba(255,236,214,.75)}
.evline{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.evline .av i{width:18px;height:18px;font-size:9px;border-color:#2A1E15}
.t-empty{padding:34px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);text-align:center;color:var(--muted)}


/* ---------- Splash after login ---------- */
#splash{position:fixed;inset:0;z-index:100;cursor:pointer;overflow:hidden}
#splash .bg{position:absolute;inset:0;opacity:0;background:radial-gradient(80% 55% at 50% 42%,#16274D 0%,#0A1226 55%,#050A16 100%)}
#splash .bg2{position:absolute;inset:0;opacity:0;background:radial-gradient(120% 50% at 50% -10%,#1A2C55 0%,transparent 60%),#0B1220}
#splash .halo{position:absolute;left:50%;top:42%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(circle,rgba(110,160,255,.26) 0%,rgba(80,130,240,.09) 36%,transparent 66%);opacity:0}
#splash .ring{position:absolute;left:50%;top:42%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:1px solid rgba(150,190,255,.35);opacity:0}
#splash .dust{position:absolute;inset:0}
#splash .dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#CFE0FF;opacity:0}
#splash .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12vh}
#splash .logo-wrap{position:relative;width:150px;transform-origin:center}
#splash .logo-wrap img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 24px rgba(40,90,200,.45))}
#splash .shine{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0;
  background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.75) 48%,rgba(190,220,255,.7) 52%,transparent 68%) no-repeat;background-size:260% 100%;background-position:120% 0}
#splash h1{margin:26px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:66px;line-height:1;color:#EDF2FB;direction:ltr;transform-origin:center}
#splash h1 em{font-style:italic}
#splash .motto{margin:20px 0 0;font-size:18px;font-weight:300;color:#C9D3E8;transform-origin:center;white-space:nowrap}
#splash .studio{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;direction:ltr}
#splash .studio .line{width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(170,200,255,.7),transparent);transform:scaleX(0)}
#splash .studio span{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#8EA0C4}
#splash .studio b{font-weight:600;color:#C9D6F0;letter-spacing:.32em}


/* ---------- Segmented ---------- */
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button,.seg label{flex:1;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--surface-hi);color:var(--text)}
.seg label{padding:0}
.seg label span{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg .n{font-size:12px;color:var(--faint)}

/* ---------- Tasks ---------- */
.task{display:flex;align-items:flex-start;gap:12px;padding:14px 8px}
li+li .task{border-top:1px solid var(--line)}
.check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--faint);background:none;display:grid;place-items:center;color:transparent;transition:all .2s;padding:0}
.check svg{width:16px;height:16px}
.check:hover{border-color:var(--blue)}
.check.on{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.task .body{flex:1;min-width:0;border:0;background:none;text-align:right;padding:0}
.task .what{font-weight:500;display:flex;align-items:center;gap:8px}
.task .what svg{width:18px;height:18px;color:var(--blue)}
.task .items{font-size:14px;color:var(--text);opacity:.85;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px}
.task.done .what{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.task.leaving{opacity:.3;transition:opacity .3s}

.fab{position:fixed;bottom:calc(var(--navgap) + env(safe-area-inset-bottom,0px) + 4px);left:max(20px,calc(50% - 210px));width:56px;height:56px;border-radius:18px;border:0;background:var(--blue-deep);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(20,50,120,.45);z-index:15}
.fab svg{width:26px;height:26px}

/* ---------- Shopping ---------- */
.addrow{display:flex;gap:8px}
.addrow .input{flex:1}
.addrow .go{width:52px;flex:none;border:0;border-radius:14px;background:var(--blue-deep);color:#fff;display:grid;place-items:center}
.addrow .go:disabled{opacity:.35}
.addmore{display:flex;gap:8px;margin-top:8px}
.addmore .input{min-height:44px;font-size:15px}
.addmore .input:first-child{flex:0 0 34%}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin:28px 4px 12px}
.shop-head .section-title{margin:0}
.item{display:flex;align-items:center;gap:12px;padding:13px 8px;width:100%;border:0;background:none;text-align:right}
li+li .item{border-top:1px solid var(--line)}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;color:transparent}
.box svg{width:15px;height:15px}
.box.on{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.box.other{background:var(--surface-hi);border-color:var(--line);color:var(--muted)}
.item .body{flex:1;min-width:0}
.item .name{font-weight:500}
.item .sub{font-size:13px;color:var(--faint)}
.item:disabled{opacity:.5;cursor:default}
.takebar{position:fixed;inset-inline:0;bottom:calc(var(--navgap) + env(safe-area-inset-bottom,0px) - 6px);padding:0 14px;z-index:16;pointer-events:none}
.takebar .row{pointer-events:auto;padding:10px;border-radius:22px;background:rgba(19,30,51,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(140,170,220,.16);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.takebar .row{max-width:432px;margin:0 auto;display:flex;gap:10px}
.takebar .primary{flex:1}
.takebar .secondary{height:52px}
.takebar .row{background:rgba(36,25,17,.94) !important;border-color:rgba(255,214,170,.16) !important}
.takebar .primary{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.takebar .primary svg{width:18px;height:18px}
body:has(.takebar) .note-fab{display:none}
.hint{font-size:14px;color:var(--muted);margin:0 4px 12px}


/* ---------- Shopping: lists + market survey ---------- */
.seg.lists{margin:4px 0 18px}
.seg.lists svg{width:16px;height:16px}
.sv-card{display:block;width:100%;text-align:right;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.sv-card + .sv-card{margin-top:10px}
.sv-card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sv-card h3{margin:0;font-size:17px;font-weight:600}
.sv-card .sub{font-size:13px;color:var(--muted);margin-top:4px}
.sv-card .from{text-align:left;font-size:12px;color:var(--muted);white-space:nowrap}
.sv-card .from b{display:block;font-size:18px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;margin-top:12px}
.thumbs span{width:34px;height:34px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500}
.badge.cheap{background:rgba(124,240,180,.12);color:#7CF0B4}
.badge.warr{background:rgba(130,178,255,.12);color:var(--blue)}
.badge.pick{background:rgba(242,196,107,.14);color:var(--gold)}
.badge.done{background:rgba(124,240,180,.12);color:#7CF0B4}
.badge svg{width:12px;height:12px}
.sv-back{display:flex;align-items:center;gap:8px}
.sv-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.sv-sum div{padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.sv-sum b{display:block;font-size:17px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.offer{position:relative;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.offer + .offer{margin-top:10px}
.offer.best{border-color:rgba(124,240,180,.35)}
.offer.chosen{border-color:rgba(242,196,107,.55);box-shadow:0 0 0 1px rgba(242,196,107,.25) inset}
.offer .hd{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:0;text-align:right;color:var(--text)}
.offer .ph{width:56px;height:56px;border-radius:14px;flex:none;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--muted);overflow:hidden}
.offer .ph img{width:100%;height:100%;object-fit:cover}
.offer .nm{flex:1;min-width:0}
.offer .nm b{display:block;font-size:16px;font-weight:600}
.offer .nm .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.offer .pr{text-align:left;font-variant-numeric:tabular-nums}
.offer .pr b{display:block;font-size:20px;font-weight:600}
.offer .pr small{font-size:12px;color:var(--muted)}
.offer dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:13px}
.offer dt{color:var(--faint)}
.offer dd{margin:0;color:var(--text)}
.offer .acts{display:flex;gap:8px;margin-top:12px}
.offer .acts a,.offer .acts button{flex:1;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none}
.offer .acts a{background:var(--bg-2);border:1px solid var(--line);color:var(--blue)}
.offer .acts .pickbtn{border:0;background:var(--blue-deep);color:#fff}
.offer .acts .pickbtn.on{background:rgba(242,196,107,.16);color:var(--gold)}
.offer .acts svg{width:16px;height:16px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
select.input{appearance:none;-webkit-appearance:none}

/* ---------- Calendar ---------- */
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav strong{font-size:17px;font-weight:500;min-width:120px;text-align:center}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 10px 10px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:12px;color:var(--faint);padding-bottom:8px}
.day{aspect-ratio:1/1;max-height:52px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}
.day .dot.off{background:transparent}
.day.today{color:var(--blue);font-weight:700}
.day.sel{background:var(--blue-deep);color:#fff}
.day.sel .dot{background:#fff}
.day:hover:not(.sel){background:var(--surface-hi)}
.day-title{font-size:17px;font-weight:500;margin:26px 4px 12px}
.ev{display:flex;gap:14px;align-items:flex-start;padding:14px 10px;width:100%;border:0;background:none;text-align:right}
li+li .ev{border-top:1px solid var(--line)}
.ev .t{flex:none;width:48px;font-weight:500;color:var(--blue);font-variant-numeric:tabular-nums}
.ev .body{flex:1;min-width:0}
.ev .what{font-weight:500}

/* ---------- Ideas ---------- */
.ideas{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.idea .open{display:block;width:100%;border:0;background:none;text-align:right;padding:0}
.idea img{display:block;width:100%;height:140px;object-fit:cover}
.idea .in{padding:14px 16px 4px}
.idea h3{margin:0;font-size:18px;font-weight:500}
.idea p{margin:4px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .foot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 12px 16px;gap:8px}
.likers{display:flex;gap:10px;flex-wrap:wrap}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.stars .off{color:var(--line)}
.want{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.want.on{border-color:transparent;background:rgba(242,196,107,.14);color:var(--gold)}
.both{font-size:12px;color:var(--gold);margin-inline-start:4px}

/* ---------- Ideas v2 ---------- */
.id-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(36,25,17,.7);border:1px solid rgba(255,214,170,.12);margin:0 0 14px}
.id-seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:#B9A48E;font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.id-seg button i{font-style:normal;font-size:12px;opacity:.6}
.id-seg button[aria-selected="true"]{background:rgba(255,226,190,.14);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,214,170,.18)}
.ideas2{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.idea2{display:flex;gap:13px;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);cursor:pointer;outline:none}
.idea2:focus-visible{box-shadow:0 0 0 2px var(--blue-deep)}
.idea2 > .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.idea2 h3{margin:0;font-size:16.5px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;line-height:1.3}
.idea2 .loc{font-size:12.5px;color:#D0BBA5}
.idea2 .d{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea2 .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:#A8917A}
.idea2 .meta .pl{color:var(--sage)}
.idea2 .meta .stars{font-size:12px}
.idea2 .bot{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.chip{font-size:11px;font-weight:400;padding:2px 8px;border-radius:99px;background:rgba(242,196,107,.16);color:var(--gold)}
.cost{font-size:11.5px;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cost.free{background:rgba(143,211,168,.16);color:#9FD9B3}.cost.paid{background:rgba(242,196,107,.14);color:var(--gold)}.cost.tix{background:rgba(195,177,255,.16);color:#CDBEFF}
.av{display:flex;min-height:22px}
.av i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:#1E140C;border:2px solid #2A1E15;margin-inline-start:-6px}
.av i:first-child{margin-inline-start:0}
.ht{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:99px;border:1px solid rgba(255,214,170,.16);background:none;color:#B9A48E;font:inherit;font-size:13px}
.ht svg{width:15px;height:15px}
.ht.on{background:rgba(242,182,107,.16);border-color:rgba(242,182,107,.3);color:#F2C48A}
.cvr{position:relative;display:grid;place-items:center;overflow:hidden;flex:none;border-radius:16px;background:#3A2A1C}
.cvr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cvr .em{position:relative;z-index:1;line-height:1}
.cvr:not(.has)::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 60%)}
.cvr.tile{width:74px;height:74px}.cvr.tile .em{font-size:30px}
.cvr.big{width:100%;aspect-ratio:16/9;border-radius:20px}.cvr.big .em{font-size:56px}
.cvr.wide{width:100%;height:120px;border-radius:18px}.cvr.wide .em{font-size:44px}
.cvr .pc,.if-cover .pc{position:absolute;z-index:2;left:6px;bottom:6px;font-size:10.5px;font-weight:500;padding:2px 6px;border-radius:99px;background:rgba(20,13,8,.65);color:#F7EEE4}
.cvr.big .pc,.cvr.wide .pc{left:10px;bottom:10px;font-size:12px;padding:3px 9px}
.c-trip{background:linear-gradient(135deg,#5E7F5A,#2F4A36)}.c-culture{background:linear-gradient(135deg,#6C5A8E,#3A2E55)}
.c-water{background:linear-gradient(135deg,#4F8FA8,#24506A)}.c-food{background:linear-gradient(135deg,#B9774A,#6B3A22)}
.c-home{background:linear-gradient(135deg,#A8865A,#5C4429)}.c-sport{background:linear-gradient(135deg,#B8865A,#7A3F3A)}.c-other{background:linear-gradient(135deg,#8C6E52,#4A3726)}
/* idea page */
.idet .id-cover{display:block;width:100%;padding:0;border:0;background:none;margin-bottom:10px;cursor:zoom-in}
.idet .id-cover[disabled]{cursor:default}
.id-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.id-strip[hidden]{display:none}
.id-strip .th{position:relative;flex:none;width:62px;height:62px;border-radius:14px;overflow:hidden;border:1.5px solid transparent;padding:0;background:#2C2016}
.id-strip .th.on{border-color:var(--gold)}
.id-strip .th img{width:100%;height:100%;object-fit:cover;display:block}
.id-strip .th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed rgba(255,214,170,.3);color:#F2C48A;font-size:11px;cursor:pointer}
.id-strip .th.add svg{width:18px;height:18px}
.id-strip.form .th button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(20,13,8,.7);color:#fff;display:grid;place-items:center;padding:0}
.id-strip.form .th button svg{width:12px;height:12px}
.id-strip.form{margin-top:-6px}
.id-desc{margin:4px 0 12px !important;color:var(--muted);font-size:15px;line-height:1.55}
.info{border-radius:16px;background:rgba(255,226,190,.05);border:1px solid rgba(255,214,170,.1);margin:0 0 12px}
.info .r{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;border-top:1px solid rgba(255,214,170,.07);background:none;color:var(--text);font:inherit;font-size:14.5px;text-align:start}
.info .r:first-child{border-top:0}
.info .r .k{width:22px;text-align:center;flex:none}
.info .r .v{flex:1;min-width:0}
.info .r .v small{display:block;color:#93806C;font-size:12.5px}
.info .r .lnk{color:var(--blue);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.info .r .go svg{width:16px;height:16px;opacity:.5}
.nav{display:flex;gap:6px;flex:none}
.nav a{height:32px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;font-weight:500;font-size:13px;text-decoration:none}
.nav .wz{background:rgba(51,204,255,.15);color:#7FD9FF}.nav .gm{background:rgba(143,211,168,.14);color:#9FD9B3}
.tixb{flex:none;height:32px;padding:0 12px;border-radius:10px;background:rgba(195,177,255,.16);color:#CDBEFF;display:inline-flex;align-items:center;font-size:13px;text-decoration:none}
.id-likes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 2px}
.id-auto{font-size:12.5px;color:var(--sage);padding:9px 12px;border-radius:12px;background:rgba(179,207,159,.08);margin-top:12px}
/* idea form */
.if-lbl{display:block;font-size:13px;color:#B9A48E;margin:14px 2px 7px}
.if-cats{display:flex;gap:6px;flex-wrap:wrap}
.if-cats button{height:34px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,214,170,.14);background:none;color:#B9A48E;font:inherit;font-size:13px}
.if-cats button.on{background:rgba(242,182,107,.16);border-color:rgba(242,182,107,.35);color:#F2C48A}
.if-cats button.on.auto{border-style:dashed}
.if-cost{display:flex;gap:6px}
.if-cost button{flex:1;height:44px;border-radius:13px;border:1px solid rgba(255,214,170,.14);background:none;color:#B9A48E;font:inherit;font-size:13.5px}
.if-cost button.on.free{border-color:rgba(143,211,168,.45);background:rgba(143,211,168,.12);color:#BDE6CA}
.if-cost button.on.paid{border-color:rgba(242,196,107,.45);background:rgba(242,196,107,.12);color:#F5D79A}
.if-cost button.on.tix{border-color:rgba(195,177,255,.45);background:rgba(195,177,255,.14);color:#E2D9FF}
.if-two[hidden],.if-two [hidden]{display:none}
.if-link.rtl input{direction:rtl;text-align:right}
.if-link .em{width:18px;text-align:center;flex:none;color:var(--faint)}
/* full-screen photo */
.vw{position:fixed;inset:0;z-index:80;background:#0B0705;overflow:hidden;opacity:0;transition:opacity .2s}
.vw.show{opacity:1}
.vw-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.2)}
.vw-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.vw-x,.vw-tools button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.15);padding:0;font-size:17px}
.vw-x svg,.vw-tools svg{width:18px;height:18px}
.vw-tools{display:flex;gap:8px}
.vw-cnt{font-size:13px;color:rgba(255,255,255,.75)}
.vw-mid{position:absolute;left:16px;right:16px;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;z-index:1}
.vw-img{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.vw-nav{position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-60px;border-radius:50%;border:0;background:rgba(20,13,8,.45);color:#fff;display:grid;place-items:center;padding:0}
.vw-nav svg{width:18px;height:18px}.vw-nav.prev{right:6px}.vw-nav.next{left:6px}
.vw-card{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:2;padding:14px 18px;border-radius:22px;background:rgba(36,25,17,.6);backdrop-filter:blur(18px);border:1px solid rgba(255,214,170,.14)}
.vw-card b{display:block;font-size:18px;font-weight:500;color:#F7EEE4}.vw-card small{font-size:13px;color:#D0BBA5}
.vw-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.vw-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}.vw-dots i.on{background:#F2C48A}
/* event window */
.evv .ev-cover{display:block;width:100%;padding:0;border:0;background:none;margin-bottom:12px;cursor:zoom-in}
.ev-when{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.c-date{width:58px;height:62px;border-radius:14px;background:rgba(20,13,8,.5);border:1px solid rgba(255,214,170,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.c-date small{font-size:10.5px;color:var(--sage)}.c-date b{font-size:22px;font-weight:500;line-height:1.05}
.ev-when .w{flex:1;min-width:0}.ev-when .w b{display:block;font-size:15.5px;font-weight:500}.ev-when .w small{color:#93806C;font-size:13px}
.ev-who{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:99px;background:rgba(255,226,190,.07);font-size:13px;flex:none}
.ev-who i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:#1E140C}
.ev-due{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.ev-due b{font-weight:400;padding:4px 10px;border-radius:99px;background:rgba(179,207,159,.12);color:var(--sage)}
.ev-from{display:block;border:0;background:none;color:#F2C48A;font:inherit;font-size:13.5px;padding:14px 2px 2px;text-align:start}
/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,7,15,.6);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;max-height:90vh;overflow:auto;background:var(--bg-2);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease-out}
.sheet.show{transform:none}
.sheet .inner{max-width:460px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:20px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{color:var(--blue);border-color:var(--blue-deep)}
.opt{margin-top:14px}
.sheet .actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.sheet .actions .primary{flex:1}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:26px;color:var(--line);padding:0 2px;line-height:1}
.rate button.on{color:var(--gold)}
.detail-img{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:14px}
.detail p{color:var(--muted);margin:6px 0 0}
.link{color:var(--blue);word-break:break-all;font-size:14px}
.row-btns{display:flex;gap:10px;margin-top:20px}
.row-btns .primary{flex:1}
.imgpick{display:flex;align-items:center;gap:12px}
.imgpick img{width:64px;height:64px;object-fit:cover;border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--navgap) + env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,10px);background:var(--surface-hi);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:all .25s;z-index:50;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ================= Warm "home" theme for the app (login keeps its own blue look) ================= */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --bg:#17110C; --bg-2:#1F1711; --surface:rgba(40,28,19,.62); --surface-hi:rgba(62,44,30,.78); --line:rgba(255,214,170,.13);
  --text:#F7EEE4; --muted:#D0BBA5; --faint:#9A846E;
  --blue:#F2B66B; --blue-deep:#D99A55; --gold:#F2C46B; --sage:#B3CF9F; --ink:#1E140C;
}
#login,#splash,#sky{--bg:#0B1220; --bg-2:#101A2E; --surface:#15213A; --surface-hi:#1B2A48; --line:#22324F;
  --text:#E7ECF6; --muted:#8494B4; --faint:#5A6A8A; --blue:#7FB0FF; --blue-deep:#3E6FD8}
html{background:#17110C}
body{background:transparent}
#login .primary{color:#fff}

/* ambient photo behind the app */
#ambient{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .8s ease;pointer-events:none;background:#17110C}
#ambient.on{opacity:1}
#ambient .slot{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
#ambient .slot.show{opacity:1}
/* full-bleed on phones, framed so both the living room and the coffee on the table show */
#ambient .main{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
#ambient .fill{display:none}
/* wide screens: show the whole scene, soft blurred copy fills the sides */
@media (min-aspect-ratio:3/4){
  #ambient .main{object-fit:contain;object-position:50% 50%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
  #ambient .fill{display:block;position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(22px) brightness(.85) saturate(1.1)}
}
#ambient::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(23,15,9,.46) 0%,rgba(23,15,9,.30) 25%,rgba(20,13,8,.48) 55%,rgba(16,10,6,.72) 100%),
             radial-gradient(120% 70% at 50% 40%,transparent 40%,rgba(10,6,3,.45) 100%)}


/* glass surfaces */
#app .panel,#app .ttile,#app .t-empty,#app .sv-card,#app .offer,#app .cal,#app .idea,#app .sv-sum div,#app .seg{
  background:var(--surface);border-color:var(--line);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15)}
#app .seg button[aria-pressed="true"],#app .seg input:checked+span{background:rgba(255,226,190,.14);color:var(--text)}
#app .t-head,#app .t-greet,#app .top{text-shadow:0 1px 14px rgba(15,9,4,.55)}
#app .t-date .pill{background:rgba(30,20,12,.45);border-color:var(--line)}

/* accent = warm amber, dark ink on filled controls */
.primary,.fab,.addrow .go,.offer .acts .pickbtn{background:var(--blue-deep);color:var(--ink)}
.primary:hover{background:#E6A962}
.fab{box-shadow:0 10px 30px rgba(120,64,20,.5)}
.check.on,.box.on,.day.sel{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--ink)}
.day.sel .dot{background:var(--ink)}
.add-btn{background:rgba(242,182,107,.14);color:var(--blue)}

/* floating nav */
nav.tabs .row{background:rgba(36,25,17,.66);border-color:rgba(255,214,170,.16);box-shadow:0 18px 40px rgba(10,5,2,.55),inset 0 1px 0 rgba(255,240,220,.06)}
nav.tabs button{color:#A8917A}
nav.tabs button[aria-current="page"]{color:var(--ink);background:linear-gradient(140deg,#F2BC77,#CF8C45);box-shadow:0 6px 16px rgba(200,128,58,.45)}

/* Today */
.ava{box-shadow:0 0 0 3px rgba(23,15,9,.6),0 0 0 4px rgba(255,214,170,.18)}
.next{background:linear-gradient(150deg,rgba(214,146,74,.94) 0%,rgba(150,90,42,.92) 50%,rgba(80,48,24,.94) 100%);border-color:rgba(255,220,180,.24);box-shadow:0 16px 40px rgba(50,24,8,.5)}
.next::before{background:radial-gradient(rgba(255,226,180,.38),transparent 68%)}
.tag{background:rgba(30,17,8,.32);color:#FFEBD2;border-color:rgba(255,240,220,.12)}
.next .meta{color:#F7E0C4}
.count span{color:#F0D6B6}
.prog{background:rgba(255,240,220,.18)}
.prog i{background:linear-gradient(90deg,#FFF0D8,#FFD29A)}
.ty.ty-ev{background:rgba(242,182,107,.15);color:var(--blue)}
.ty.ty-tk{background:rgba(205,185,255,.13);color:#D4C3FF}
.ty.ty-sh{background:rgba(179,207,159,.14);color:var(--sage)}

/* sheets, toast */
.scrim{background:rgba(12,7,3,.6)}
.sheet{background:#21170F;border-top-color:rgba(255,214,170,.14)}
.sheet .input,.sheet .textarea,.sheet .seg,.sheet .chip,.sheet .secondary{background:#2C2016;border-color:rgba(255,214,170,.14)}
.input:focus,.textarea:focus{border-color:var(--blue-deep);background:#33251A}
.toast{background:#3A2A1C;border-color:rgba(255,214,170,.18)}
.want{background:rgba(30,20,12,.5)}


/* in-app confirm (native confirm() is blocked inside the viewer) */
.cfm-scrim{position:fixed;inset:0;z-index:60;background:rgba(12,7,3,.55);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .2s}
.cfm-scrim.show{opacity:1}
.cfm{width:100%;max-width:340px;padding:22px 20px 16px;border-radius:24px;background:#2A1E15;border:1px solid rgba(255,214,170,.16);box-shadow:0 24px 60px rgba(0,0,0,.5);transform:scale(.96);transition:transform .2s}
.cfm-scrim.show .cfm{transform:none}
.cfm .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,154,138,.12);color:var(--err);margin-bottom:12px}
.cfm .ic svg{width:22px;height:22px}
.cfm h3{margin:0;font-size:18px;font-weight:600}
.cfm p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.cfm .row{display:flex;gap:10px;margin-top:18px}
.cfm .row button{flex:1;height:46px;border-radius:14px;font-size:15px;font-weight:600;border:1px solid var(--line);background:rgba(255,226,190,.08);color:var(--text)}
.cfm .row .del{border:0;background:#E5735F;color:#1E0F0A}
.cfm.upd{max-width:350px}
.cfm .ic.upd-ic{background:rgba(242,182,107,.16);color:#F2C48A}
.cfm .ic.upd-ic{font-size:22px}
.cfm.upd .row .go:only-child{flex:1}
.cfm .upd-p{margin:8px 0 0;font-size:14.5px;line-height:1.55;color:#E9DCCB}
.cfm.upd h3{font-size:19px}
.upd-notes{margin:12px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,226,190,.06);border:1px solid rgba(255,214,170,.1);list-style:none;display:flex;flex-direction:column;gap:6px}
.cfm.mu .pg{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#93806C;margin:-2px 0 6px}
.cfm.mu .dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.cfm.mu .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,226,190,.2);transition:width .2s}
.cfm.mu .dots i.on{background:#F2B66B;width:18px;border-radius:9px}
.cfm.mu .row2{display:flex;gap:8px;margin-top:16px}
.cfm.mu .row2 button{flex:1;height:48px !important;min-height:0;margin:0 !important;padding:0 12px;border-radius:14px;font:inherit;font-size:15px}
.cfm.mu .row2 .sec2{background:none;border:1px solid rgba(255,214,170,.2);color:#D0BBA5}
.cfm.mu .row2 .pri{border:0;background:linear-gradient(180deg,#F2B66B,#D99A55);color:#1E140C;font-weight:600}
.upd-notes li{font-size:13.5px;line-height:1.45;padding-inline-start:16px;position:relative}
.upd-notes li::before{content:"";position:absolute;right:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:#F2B66B}
.cfm .row .go{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:#D99A55;color:#1E140C}
.cfm .row .go svg{width:17px;height:17px}
.cfm .ic.buy{background:rgba(242,182,107,.16);color:#F2C48A}
.cfm .row [data-l]{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:#D99A55;color:#1E140C}
.cfm .row [data-l] svg{width:18px;height:18px}
.cfm .skip{display:block;width:100%;margin-top:8px;height:40px;border:0;background:none;color:var(--muted);font-size:14px}
.st-cart b{font-size:11px;font-weight:600;margin-inline-start:3px}
.st-cart.on.lbl{width:auto;padding:0 9px;border-radius:999px;display:inline-flex;gap:2px}


/* ---------- Idea form / detail (modern) ---------- */
.if-cover{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;margin-bottom:16px;
  border:1.5px dashed rgba(255,214,170,.28);background:rgba(255,226,190,.04);color:var(--muted);cursor:pointer}
.if-cover.has{border:0}
.if-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.if-cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px}
.if-cover .ph svg{width:30px;height:30px;color:var(--blue)}
.if-cover .tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.if-cover .tools span{height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;background:rgba(20,12,6,.6);color:#FBEBD6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.if-title{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px 12px;font-size:24px;font-weight:600;color:var(--text);outline:none}
.if-title::placeholder{color:var(--faint);font-weight:500}
.if-title:focus{border-bottom-color:var(--blue-deep)}
.if-desc{width:100%;border:0;background:none;resize:none;min-height:56px;padding:12px 2px 4px;font-size:15px;color:var(--text);outline:none;line-height:1.5}
.if-desc::placeholder{color:var(--faint)}
.if-link{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:#2C2016;border:1px solid rgba(255,214,170,.14);margin-top:8px}
.if-link svg{width:18px;height:18px;color:var(--faint);flex:none}
.if-link input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font-size:15px;direction:ltr;text-align:right}
.if-link input::placeholder{color:var(--faint)}
.if-sec{margin-top:16px;padding:14px;border-radius:20px;background:rgba(255,226,190,.045);border:1px solid rgba(255,214,170,.11)}
.if-sec > header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.if-sec h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.if-sec h4 svg{width:18px;height:18px;color:var(--blue)}
.if-sec header small{font-size:12px;color:var(--faint)}
.st-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.st-row + .st-row{border-top:1px solid rgba(255,214,170,.08)}
.st-row .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;color:transparent;padding:0;background:none}
.st-row .dot svg{width:12px;height:12px}
.st-row .dot.on{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--ink)}
.st-row input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font-size:15px;padding:8px 0}
.st-row input::placeholder{color:var(--faint)}
.st-row.done input,.st-row.done .t{color:var(--faint);text-decoration:line-through}
.st-row .t{flex:1;min-width:0;font-size:15px}
.st-cart{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,214,170,.14);background:rgba(30,20,12,.4);color:var(--faint);display:grid;place-items:center;padding:0;flex:none;cursor:pointer}
.st-cart svg{width:15px;height:15px}
.st-cart.on{background:rgba(242,182,107,.2);border-color:rgba(242,182,107,.5);color:#F2C48A}
.st-cart[disabled]{opacity:.4}
span.st-cart{cursor:default}
.st-who{height:30px;padding:0 10px 0 6px;border-radius:999px;border:1px solid rgba(255,214,170,.14);background:rgba(30,20,12,.4);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex:none}
.st-who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#1E140C;background:var(--c,#6E5C4A)}
.st-who.none i{background:rgba(255,226,190,.12);color:var(--faint)}
.st-x{width:30px;height:30px;border:0;background:none;color:var(--faint);display:grid;place-items:center;border-radius:10px;flex:none}
.st-x svg{width:16px;height:16px}
.st-add{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.st-add svg{width:18px;height:18px;color:var(--blue);flex:none}
.st-add input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:15px;padding:8px 0}
.st-add input::placeholder{color:var(--faint)}
.fb-stars{display:flex;gap:6px;margin-bottom:12px}
.fb-stars button{border:0;background:none;padding:2px;font-size:28px;line-height:1;color:rgba(255,226,190,.16)}
.fb-stars button.on{color:var(--gold)}
.fb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.fb-row + .fb-row{border-top:1px solid rgba(255,214,170,.08)}
.fb-row > span{font-size:14px;color:var(--text)}
.fb-pills{display:flex;gap:6px}
.fb-pills button{height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,214,170,.14);background:rgba(30,20,12,.35);color:var(--muted);font-size:13px;font-weight:500}
.fb-pills button.yes.on{background:rgba(179,207,159,.18);border-color:rgba(179,207,159,.45);color:#CFE6BF}
.fb-pills button.no.on{background:rgba(229,115,95,.16);border-color:rgba(229,115,95,.45);color:#F4B3A6}
.if-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:18px -20px -24px;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,#21170F 30%)}
.if-foot .row{display:flex;gap:10px;align-items:center}
.if-foot .primary{flex:1}
/* idea cards: feedback + progress */
.idea .fbs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 4px}
.fbb{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(255,226,190,.07);color:var(--muted)}
.fbb.good{background:rgba(179,207,159,.14);color:#CFE6BF}
.fbb.bad{background:rgba(229,115,95,.13);color:#F4B3A6}
.fbb svg{width:13px;height:13px}
.task .from{display:inline-flex;align-items:center;gap:5px;color:var(--blue)}


.fb-text{width:100%;min-height:84px;resize:vertical;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,214,170,.14);background:#2C2016;color:var(--text);font-size:15px;line-height:1.5;outline:none}
.fb-text::placeholder{color:var(--faint)}
.fb-text:focus{border-color:var(--blue-deep)}
.idea .rv{color:var(--text);opacity:.8;font-style:italic;-webkit-line-clamp:2}


/* file pickers: the real input sits on top (transparent) so a tap opens the picker directly — more reliable in mobile in-app viewers than label/hidden-input tricks */
.pick-wrap{position:relative;overflow:hidden}
.pick-wrap input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.if-cover .tools{z-index:3}
.if-cover .tools button{height:30px;padding:0 12px;border-radius:999px;border:0;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;background:rgba(20,12,6,.6);color:#FBEBD6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.if-urlbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 2px 10px;display:inline-flex;align-items:center;gap:6px}
.if-urlbtn svg{width:15px;height:15px}


/* ---------- Coupons & gift cards ---------- */
.seg.lists button{font-size:13px;gap:5px;padding:0 4px}
.seg.lists button .n{display:none}
.seg.lists button[aria-pressed="true"] .n{display:inline}
.cp-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.cp-sum div{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cp-sum b{display:block;font-size:20px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.cp-sum .warn b{color:#F4B3A6}
.cp-card{position:relative;display:block;width:100%;text-align:right;color:var(--text);padding:16px 16px 14px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,230,200,.14);
  background:var(--cpbg);box-shadow:0 10px 26px rgba(10,5,2,.35)}
.cp-card + .cp-card{margin-top:10px}
.cp-card::before{content:"";position:absolute;width:180px;height:180px;left:-60px;top:-90px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.18),transparent 70%);pointer-events:none}

/* ---------- פתק על המקרר ---------- */
.note-fab{position:fixed;z-index:16;right:max(16px,calc(50% - 214px));bottom:calc(var(--navgap) + env(safe-area-inset-bottom,0px) + 4px);
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,226,190,.22);padding:0;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,rgba(255,240,215,.22),rgba(46,32,21,.88) 70%);backdrop-filter:blur(12px);box-shadow:0 10px 26px rgba(10,5,2,.5);
  transition:transform .25s,opacity .25s}
.note-fab svg{width:32px;height:32px;pointer-events:none}
.note-fab{touch-action:none;user-select:none;-webkit-user-select:none}
.note-fab.dragging{transform:scale(1.12);box-shadow:0 16px 34px rgba(10,5,2,.6);transition:none;cursor:grabbing}
.note-fab.snap{transition:left .25s cubic-bezier(.2,.9,.3,1.2),top .25s}
.note-fab:active{transform:scale(.92)}
.note-fab.bye{transform:scale(.4) rotate(-20deg);opacity:0}
.note-scrim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:26px;background:rgba(12,7,3,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.note-scrim.show{opacity:1}
.upd-lbl{margin:10px 0 4px;font-size:14px;font-weight:600;color:var(--text)}
.upd-sig{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,214,170,.12);font-size:14px;color:var(--gold);text-align:center}
.fnote{--paper:#FBE7A6;--ink:#4A3518;position:relative;width:100%;max-width:330px;padding:34px 24px 20px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%),var(--paper);border-radius:3px 3px 18px 3px;
  box-shadow:0 2px 0 rgba(0,0,0,.05),0 18px 40px rgba(0,0,0,.45),inset 0 -12px 18px rgba(120,80,20,.08);
  transform:rotate(-2.2deg) translateY(30px) scale(.94);transition:transform .45s cubic-bezier(.2,.9,.3,1.3)}
.note-scrim.show .fnote{transform:rotate(-2.2deg)}
.fnote.pink{--paper:#F9CFD3}.fnote.blue{--paper:#CFE3F7}.fnote.green{--paper:#D5EBC5}.fnote.white{--paper:#FBF6EC}
.fnote::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:26px;background:linear-gradient(45deg,rgba(0,0,0,.08) 50%,rgba(255,255,255,.4) 50%);border-radius:0 10px 0 0}

/* composer */
.fnote textarea{width:100%;min-height:118px;resize:none;border:0;background:repeating-linear-gradient(transparent 0 35px,rgba(120,80,20,.16) 35px 36px);

/* ================= Skin: Nido Light (user preference; Nido Home = everything above, unchanged) =================
   Only colors, surfaces and backgrounds change here — never layout, features or behaviour. */
html[data-skin="light"]{background:#F6EFE5}
html[data-skin="light"] :is(#app,#sheetRoot,#toast,body){
  --bg:#F6EFE5; --bg-2:#FBF7F1; --surface:rgba(255,253,250,.95); --surface-hi:#FFFFFF; --line:rgba(110,78,40,.13);
  --text:#2A1D12; --muted:#76604B; --faint:#9C8670; --err:#B5452F;
  --blue:#A9742C; --blue-deep:#CF9D57; --gold:#C9964F; --sage:#4F7F42; --ink:#2A1D12}
html[data-skin="light"] body{color:#2A1D12}
/* the photo of this screen across the top, fading into cream */
html[data-skin="light"] #ambient{background:#F6EFE5}
html[data-skin="light"] #ambient .main{inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;-webkit-mask-image:none;mask-image:none}
@media (min-aspect-ratio:3/4){ html[data-skin="light"] #ambient .main{object-fit:cover;-webkit-mask-image:none;mask-image:none} html[data-skin="light"] #ambient .fill{display:none} }
html[data-skin="light"] #ambient .fill{display:none}
/* a soft warm veil over the whole photo: deeper at the top (titles) and bottom (nav) so light text stays readable */
html[data-skin="light"] #ambient::after{background:linear-gradient(180deg,rgba(40,24,10,.52) 0%,rgba(40,24,10,.30) 22%,rgba(40,24,10,.24) 55%,rgba(40,24,10,.40) 100%)}
/* titles sit on the photo → light text with a soft shadow */
html[data-skin="light"] #app :is(.t-head,.t-greet,.top>h1,.top .title-sm,.t-date,.t-legend){color:#FFF8EE;text-shadow:0 1px 12px rgba(40,22,6,.55)}
html[data-skin="light"] #app :is(.t-greet p,.t-date,.top .title-sm){color:rgba(255,246,232,.9)}
/* everything that sits straight on the photo (not inside a white window): light text + soft shadow */
html[data-skin="light"] #app :is(.t-sec>h3,.t-sec h3 span,.shop-head .section-title,.shop-head .shop-tip,.month-nav strong,.month-nav button,.cv-legend,.cv-legend span,.wrap>.hint,.t-legend span){
  color:#FFF8EE;text-shadow:0 1px 10px rgba(30,16,4,.7)}
html[data-skin="light"] #app :is(.t-sec h3 span,.shop-head .shop-tip,.wrap>.hint){color:rgba(255,246,232,.88)}
html[data-skin="light"] #app .t-sec>button{color:#FFE2AE;text-shadow:0 1px 10px rgba(30,16,4,.7)}
html[data-skin="light"] #app .t-date .pill{background:rgba(255,250,242,.22);border-color:rgba(255,250,242,.35);color:#FFF8EE}
/* clear cream/white cards with a soft shadow instead of dark glass */
html[data-skin="light"] #app :is(.panel,.ttile,.t-empty,.sv-card,.offer,.cal,.idea,.sv-sum div,.seg){
  background:var(--surface);border-color:var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 24px rgba(92,60,26,.08)}
html[data-skin="light"] #app .seg button[aria-pressed="true"],html[data-skin="light"] #app .seg input:checked+span{background:#F4E2C4;color:#2A1D12}
html[data-skin="light"] .next{background:linear-gradient(150deg,#F3D6A6 0%,#E2B575 55%,#C99050 100%);border-color:rgba(255,255,255,.6);box-shadow:0 14px 34px rgba(150,98,40,.28)}

/* sheets, popups, toast */
html[data-skin="light"] .scrim{background:rgba(52,32,12,.32)}
html[data-skin="light"] .sheet{background:#FBF7F1;border-top-color:rgba(110,78,40,.14);box-shadow:0 -10px 40px rgba(60,36,12,.18)}
html[data-skin="light"] .sheet :is(.input,.textarea,.seg,.chip,.secondary){background:#fff;border-color:rgba(110,78,40,.16)}
html[data-skin="light"] :is(.input,.textarea):focus{background:#fff;border-color:#CF9D57}
html[data-skin="light"] .toast{background:#2E2116;border-color:transparent;color:#FFF6EA}
html[data-skin="light"] .want{background:rgba(255,250,242,.7)}
html[data-skin="light"] .cfm-scrim{background:rgba(52,32,12,.32)}
html[data-skin="light"] .cfm{background:#FFFDF9;border-color:rgba(110,78,40,.14);box-shadow:0 24px 60px rgba(60,36,12,.22)}
html[data-skin="light"] .cfm .row button{background:rgba(110,78,40,.06);border-color:rgba(110,78,40,.16);color:#2A1D12}
html[data-skin="light"] :is(.cfm .row .go,.cfm .row [data-l]){background:#CF9D57;color:#2A1D12}
html[data-skin="light"] .cfm .upd-p{color:#4A3A2C}
html[data-skin="light"] .upd-notes{background:rgba(110,78,40,.05);border-color:rgba(110,78,40,.1)}
html[data-skin="light"] .cfm.mu .row2 .sec2{border-color:rgba(110,78,40,.2);color:#76604B}

/* Nido Light — components that used fixed dark-theme colors (calendar, ideas, shop, forms) */
html[data-skin="light"] :is(.id-seg button,.cv-seg button,.ht,.if-lbl,.if-cats button,.if-cost button){color:#7A6450}
html[data-skin="light"] :is(.idea2 .loc){color:#6E5844}
html[data-skin="light"] :is(.idea2 .meta,.cv-sum small,.cv-dl small,.cv-dow,.cv-more,.cv-day h3 small,.cv-r .t small,.cv-dsel small,.cv-allday>small,.info .r .v small,.ev-when .w small,.fam header small,.cv-h span){color:#8A735C;text-shadow:none}
html[data-skin="light"] :is(.cv-cols,.cv-legend,.cv-blk small){color:#6E5844}
html[data-skin="light"] :is(.cv-sum .sh b,.cv-dl i,.cv-hl){color:#9A6B1F}
html[data-skin="light"] :is(.id-seg,.cv-seg){background:rgba(255,253,250,.95);border-color:rgba(110,78,40,.13);backdrop-filter:none;box-shadow:0 8px 24px rgba(92,60,26,.08)}
html[data-skin="light"] :is(.id-seg button[aria-selected="true"],.cv-seg button[aria-selected="true"]){background:#F4E2C4;color:#2A1D12;box-shadow:none}
html[data-skin="light"] :is(.ht,.if-cats button,.if-cost button,.st-cart,.st-who,.fb-pills button,.cv-today){border-color:rgba(110,78,40,.18);background:rgba(255,253,250,.9)}
html[data-skin="light"] .cv-today{color:#2A1D12}
html[data-skin="light"] :is(.cv-sum div,.cv-dl,.cv-month,.cv-day,.cv-dsel button){background:rgba(255,253,250,.95);border-color:rgba(110,78,40,.13);backdrop-filter:none;box-shadow:0 6px 18px rgba(92,60,26,.07)}
html[data-skin="light"] .cv-cell{background:rgba(255,253,250,.7);border-color:rgba(110,78,40,.1)}
html[data-skin="light"] :is(.cv-row.today .cv-dl,.cv-dsel .on){background:linear-gradient(160deg,#E9B271,#C98C45);color:#2A1D12}
html[data-skin="light"] .cv-row.today .cv-dl small{color:#4A2E16}
html[data-skin="light"] .cv-row.sat .cv-dl small{color:#9A6B1F}
html[data-skin="light"] .cv-x{background:color-mix(in srgb,var(--c) 20%,#FFFDF9);color:#2A1D12}
html[data-skin="light"] .cv-x b{color:color-mix(in srgb,var(--c) 60%,#2A1D12)}
html[data-skin="light"] :is(.cv-x.tk,.cv-blk.tk){background:rgba(255,253,250,.9)}
html[data-skin="light"] .cv-blk{background:color-mix(in srgb,var(--c) 20%,#FFFDF9);color:#2A1D12;box-shadow:0 6px 16px rgba(92,60,26,.12);backdrop-filter:none}
html[data-skin="light"] .cv-chip{background:color-mix(in srgb,var(--c) 16%,#FFFDF9);color:color-mix(in srgb,var(--c) 60%,#2A1D12)}
html[data-skin="light"] .cv-ev{color:color-mix(in srgb,var(--c) 60%,#2A1D12)}
html[data-skin="light"] .cv-c.today > b{color:#9A6B1F}
html[data-skin="light"] .cv-c.sel{background:rgba(207,157,87,.16);box-shadow:inset 0 0 0 1.5px rgba(185,132,61,.55)}
html[data-skin="light"] .cv-strip{color:#7A5512;background:linear-gradient(100deg,rgba(232,196,106,.28),rgba(232,196,106,.1));border-color:rgba(190,150,60,.35)}
html[data-skin="light"] .cv-strip.major{color:#7A4E12}
html[data-skin="light"] .cv-empty{border-color:rgba(110,78,40,.22);color:#8A735C}
html[data-skin="light"] :is(.if-link,.fb-text,.cp-codebox,.toggle-row,.ulist button,.id-strip .th){background:#fff;border-color:rgba(110,78,40,.15)}
html[data-skin="light"] .if-foot{background:linear-gradient(transparent,#FBF7F1 30%)}
html[data-skin="light"] .pf-ava .cam{background:#fff;border-color:rgba(110,78,40,.2);color:#76604B}
html[data-skin="light"] .swatches button.on{box-shadow:0 0 0 2px #FBF7F1,0 0 0 4px #B9843D}
html[data-skin="light"] .ro-pill{background:rgba(110,78,40,.08);border-color:rgba(110,78,40,.16);color:#76604B}
html[data-skin="light"] .av i{border-color:#fff}
html[data-skin="light"] .c-date{background:rgba(255,253,250,.9);border-color:rgba(110,78,40,.12)}
html[data-skin="light"] .fb-pills button.yes.on{background:rgba(80,130,66,.14);border-color:rgba(80,130,66,.45);color:#3F6E33}
html[data-skin="light"] .fb-pills button.no.on{background:rgba(181,69,47,.1);border-color:rgba(181,69,47,.4);color:#9A3A26}
/* "המראה שלי" */
.skins{display:grid;gap:12px;margin:4px 0 6px}
.skin-card{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);text-align:right;font:inherit;cursor:pointer}
.skin-card.on{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(207,157,87,.22)}
.skin-card .pv{width:74px;height:96px;flex:none;border-radius:14px;overflow:hidden;position:relative;background:#17110C}
.skin-card .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.skin-card .pv i{position:absolute;left:8px;right:8px;height:12px;border-radius:5px}
.skin-card .t{flex:1;min-width:0}.skin-card .t b{display:block;font-size:16px;font-weight:600}
.skin-card .t small{display:block;margin-top:3px;font-size:13px;color:var(--muted);line-height:1.4}
.skin-card .ok{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.skin-card.on .ok{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--ink)}
.skin-card .ok svg{width:15px;height:15px}

/* swipe between screens: a short slide-in from the side the user came from */
@keyframes nidoSwL{from{opacity:.25;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes nidoSwR{from{opacity:.25;transform:translateX(28px)}to{opacity:1;transform:none}}
#screen.sw-l{animation:nidoSwL .24s cubic-bezier(.22,1,.36,1)}
#screen.sw-r{animation:nidoSwR .24s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){#screen.sw-l,#screen.sw-r{animation:none}}
</style>
</head>

};

  KEY: "nido.skin", cloud: undefined,
  cur(){ const s = document.documentElement.dataset.skin; return SKINS[s] ? s : "home"; },
  apply(s){
    s = SKINS[s] ? s : "home";
    if (s === "home") delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = s;
    try { localStorage.setItem(this.KEY, s); if (me) localStorage.setItem(this.KEY + "." + me, s); } catch(e){}

  },
  /* the saved choice of the account is applied when it CHANGES (first load, or picked on another device).
     Never saved yet → this device's choice stays. A failed save never flips the look back. */
  sync(){
    const u = me && USERS[me]; if (!u) return;
    const s = SKINS[u.skin] ? u.skin : null, key = me + "|" + s;
    if (key === this.cloud) return; this.cloud = key;
    let pick = s;
    if (!pick){ try { pick = localStorage.getItem(this.KEY + "." + me); } catch(e){} }           // never saved to the account: this person's choice on this device
    pick = SKINS[pick] ? pick : "home";
    if (pick !== this.cur()) this.apply(pick);
  },
  async choose(s){
    this.apply(s);
    try { await UsersAPI.update(me, { skin: s }); return true; } catch(e){ console.warn("[skin]", e && e.code); return false; }   // kept on this device anyway
  },
};

const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const REPEAT = { none:"ללא", daily:"כל יום", weekly:"כל שבוע", monthly:"כל חודש" };
const icon = (id, cls="i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function dayLabel(ds){
  const d = parse(ds), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d - t)/864e5);
  if (diff === 0) return "היום";
  if (diff === 1) return "מחר";
  if (diff === -1) return "אתמול";
  if (diff > 1 && diff < 7) return "יום " + DAYS[d.getDay()];
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
}
function who(id){
  if (!id || !USERS[id]) return `<span class="who none">${icon("user")}ללא אחראי</span>`;
  const u = USERS[id];
  return `<span class="who" style="--c:${u.color}"><i style="${avaStyle(u)}">${initial(u)}</i>${esc(u.name)}</span>`;
}

function save(){

  LAST_LOCAL = JSON.stringify(DB);
  try { localStorage.setItem(STORE, LAST_LOCAL); } catch(e){ toast("האחסון מלא — נסה תמונה קטנה יותר"); }
