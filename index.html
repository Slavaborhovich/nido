        <span class="t">${x.k === "tk" && x.done ? "✓ " : ""}${esc(x.title)}<small>${[x.k === "tk" ? "משימה" : "", x.who && USERS[x.who] ? USERS[x.who].name : (x.k === "ev" ? "יחד" : "ללא אחראי"), x.place ? esc(x.place) : "", x.idea ? "💡 מרעיון" : ""].filter(Boolean).join(" · ")}</small></span></button>`).join("")}
      ${!items.length ? `<button class="cv-empty" id="cvAddDay">יום פנוי<b>+ להוסיף אירוע</b></button>` : ""}
    </section>`;
  bindCalCommon(() => { S.calMonth = new Date(y, mo - 1, 1); renderMonth(); }, () => { S.calMonth = new Date(y, mo + 1, 1); renderMonth(); },
    () => { const n = new Date(); S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); S.calSel = today; renderMonth(); });
  $("#screen").querySelector(".cv-grid").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return;
    S.calSel = b.dataset.d; S.calWeek = iso(startOfWeek(parse(S.calSel)));
    const d = parse(S.calSel); if (d.getMonth() !== mo) S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderMonth(); };
  $("#screen").querySelector(".cv-day").onclick = e => { const r = e.target.closest(".cv-r"); if (r) openItem(r.dataset.k, r.dataset.id); };
  $("#cvAddDay")?.addEventListener("click", () => eventSheet(null, { date:S.calSel }));
  $("#cvOpenDay").onclick = () => { S.calView = "day"; S._dayScrolled = false; renderCal(); window.scrollTo(0, 0); };
}

/* ===== day: timeline ===== */
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
function renderDay(){
  const today = iso(new Date()), ds = S.calSel, d = parse(ds);
  const items = dayItems(ds), hol = Hol.of(ds);
  const timed = items.filter(x => toMin(x.time) !== null).map(x => ({ ...x, s: toMin(x.time), e: toMin(x.time) + (x.k === "ev" ? 60 : 30) }));
  const untimed = items.filter(x => toMin(x.time) === null);
  const nowMin = ds === today ? new Date().getHours() * 60 + new Date().getMinutes() : null;
  const first = Math.min(7 * 60, ...timed.map(x => x.s), nowMin ?? 1440), last = Math.max(23 * 60, ...timed.map(x => x.e), (nowMin ?? 0) + 30);
  const H0 = Math.floor(first / 60), H1 = Math.min(24, Math.ceil(last / 60)), PX = 56, y = m => (m - H0 * 60) * PX / 60;
  // side-by-side lanes for overlapping items
  timed.sort((a, b) => a.s - b.s || b.e - a.e);
  const groups = []; let g = null;
  for (const x of timed){ if (!g || x.s >= g.end){ g = { items:[], end:0 }; groups.push(g); } g.items.push(x); g.end = Math.max(g.end, x.e); }
  for (const gr of groups){ const lanes = []; for (const x of gr.items){ let l = lanes.findIndex(e => e <= x.s); if (l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = x.e; x.lane = l; } gr.items.forEach(x => x.lanes = lanes.length); }
  const weekDays = [...Array(7)].map((_, i) => iso(addDays(startOfWeek(d), i)));
  const dayName = ds === today ? "היום" : ds === iso(addDays(new Date(), 1)) ? "מחר" : ds === iso(addDays(new Date(), -1)) ? "אתמול" : `יום ${DAYS[d.getDay()]}`;
  $("#screen").innerHTML = `${calTop(`${dayName} · ${d.getDate()}/${d.getMonth() + 1}`, "יום קודם", "יום הבא", ds !== today)}
    <div class="cv-dsel">${weekDays.map(w => { const wd = parse(w), its = dayItems(w), c = its[0] ? colOf(its[0].who) : (Hol.of(w).some(h => h.k !== "rc") ? SHAB : "");
      return `<button class="${w === ds ? "on" : ""} ${w === today ? "is-today" : ""}" data-d="${w}"><small>${"אבגדהוש"[wd.getDay()]}׳</small><b>${wd.getDate()}</b><i style="background:${c || "transparent"}"></i></button>`; }).join("")}</div>
    ${untimed.length || hol.length ? `<div class="cv-allday"><small>ללא שעה</small>
      ${hol.map(h => `<span class="cv-chip" style="--c:${SHAB}">${h.k === "candles" ? icon("candle") : ""}${esc(holLine(h))}</span>`).join("")}
      ${untimed.map(x => `<button class="cv-chip ${x.k} ${x.done ? "done" : ""}" data-k="${x.k}" data-id="${x.id}" style="--c:${colOf(x.who)}">${x.k === "tk" && x.done ? "✓ " : ""}${esc(x.title)}${x.who && USERS[x.who] ? ` · ${esc(USERS[x.who].name)}` : ""}</button>`).join("")}</div>` : ""}
    <div class="cv-tl" style="height:${(H1 - H0) * PX + 8}px">
      ${[...Array(H1 - H0 + 1)].map((_, i) => `<div class="cv-h" style="top:${i * PX}px" data-h="${H0 + i}"><span class="tabular">${pad(H0 + i)}:00</span></div>`).join("")}
      ${timed.map(x => { const w = 100 / x.lanes;
        return `<button class="cv-blk ${x.k} ${x.done ? "done" : ""} ${x.e - x.s <= 30 ? "short" : ""}" data-k="${x.k}" data-id="${x.id}" style="--c:${colOf(x.who)};top:${y(x.s) + 1}px;height:${Math.max(y(x.e) - y(x.s) - 3, 24)}px;right:calc(46px + (100% - 46px) * ${x.lane * w / 100});width:calc((100% - 46px) * ${w / 100} - 4px)">
          <b>${x.k === "tk" && x.done ? "✓ " : ""}${esc(x.title)}</b><small><span class="tabular">${x.time}</span>${x.who && USERS[x.who] ? ` · ${esc(USERS[x.who].name)}` : x.k === "ev" ? " · יחד" : ""}${x.place ? ` · ${esc(x.place)}` : ""}</small></button>`; }).join("")}
      ${nowMin !== null ? `<div class="cv-now" style="top:${y(nowMin)}px"><span class="tabular">${pad(new Date().getHours())}:${pad(new Date().getMinutes())}</span></div>` : ""}
    </div>
    ${!items.length ? `<p class="hint cv-hint">יום פנוי. לחיצה על שעה מוסיפה אירוע.</p>` : ""}`;
  const step = n => { S.calSel = iso(addDays(d, n)); renderDay(); };
  bindCalCommon(() => step(-1), () => step(1), () => { S.calSel = today; renderDay(); });
  $("#screen").querySelector(".cv-dsel").onclick = e => { const b = e.target.closest("[data-d]"); if (b){ S.calSel = b.dataset.d; renderDay(); } };
  $("#screen").querySelector(".cv-allday")?.addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) openItem(b.dataset.k, b.dataset.id); });
  const tl = $("#screen").querySelector(".cv-tl");
  tl.onclick = e => {
    const b = e.target.closest(".cv-blk"); if (b) return openItem(b.dataset.k, b.dataset.id);
    if (!canEdit()) return;
    const r = tl.getBoundingClientRect(), mins = H0 * 60 + Math.floor((e.clientY - r.top) / PX * 2) * 30;
    eventSheet(null, { date:ds, time:`${pad(Math.floor(mins / 60))}:${pad(mins % 60)}` });
  };
  if (nowMin !== null && !S._dayScrolled){ S._dayScrolled = true; requestAnimationFrame(() => { const top = tl.getBoundingClientRect().top + window.scrollY + y(nowMin) - innerHeight / 2.6; if (top > 0) window.scrollTo(0, top); }); }
}

/* an event: when, where, tickets, and its tasks (the idea's tasks, or the event's own) */
function eventView(ev){
  const idea = ev.ideaId ? DB.ideas.find(x => x.id === ev.ideaId) : null;
  const d = parse(ev.date), place = ev.place || (idea && idea.place) || "";
  const ts = idea ? ideaTasks(idea) : DB.tasks.filter(t => t.eventId === ev.id);
  const who = ev.who && USERS[ev.who], tix = idea && extUrl(idea.tixLink);
  const when = `${DAYS[d.getDay()]}, ${d.getDate()} ב${MONTHS[d.getMonth()]}${ev.end ? ` – ${shortDate(ev.end)}` : ""}`;
  const sh = openSheet(`${head(esc(ev.title))}
    <div class="detail evv">
      ${idea && idea.image ? `<button type="button" class="ev-cover" data-photos aria-label="תמונות">${coverHTML(idea, "wide")}</button>` : ""}
      <div class="ev-when"><div class="c-date"><small>${DAYS[d.getDay()]}</small><b class="tabular">${d.getDate()}</b><small>${MONTHS[d.getMonth()]}</small></div>
        <div class="w"><b>${esc(when)}</b><small>${ev.time ? `<span class="tabular">${ev.time}</span>` : "כל היום"}</small></div>
        <span class="ev-who">${who ? `<i style="background:${who.color};${avaStyle(who)}">${initial(who)}</i>${esc(who.name)}` : "יחד"}</span></div>
      ${place || (idea && idea.cost) || ev.note ? `<div class="info">
        ${place ? `<div class="r"><span class="k">📍</span><span class="v">${esc(place)}</span>${navLinks(place)}</div>` : ""}
        ${idea && idea.cost ? `<div class="r"><span class="k">${COST[idea.cost][0]}</span><span class="v">${idea.cost === "tix" ? "כרטיסים" : COST[idea.cost][1]}${idea.cost !== "free" && idea.price ? ` · ${esc(priceTxt(idea.price))}` : ""}</span>${tix ? `<a class="tixb" href="${esc(tix)}" target="_blank" rel="noopener">לרכישה ↗</a>` : ""}</div>` : ""}
        ${ev.note ? `<div class="r"><span class="k">📝</span><span class="v">${esc(ev.note)}</span></div>` : ""}
      </div>` : ""}
      <section class="if-sec"><header><h4>${icon("chk")}משימות</h4><small>${ts.length ? `${ts.filter(t => t.done).length}/${ts.length} בוצעו` : "חלוקת משימות לאירוע"}</small></header>
        <div id="evTasks">${ts.map(t => `<div class="st-row ${t.done ? "done" : ""}" data-t="${t.id}">
          <button type="button" class="dot ${t.done ? "on" : ""}" aria-label="סימון">${icon("tick")}</button><span class="t">${esc(t.title)}</span>${t.buy ? `<span class="st-cart on lbl" aria-label="ברשימת קניות">${icon(t.buy === "home" ? "home" : "cart")}<b>${t.buy === "home" ? "לבית" : "סופר"}</b></span>` : ""}<button type="button" class="st-whob" data-who style="border:0;background:none;padding:0" aria-label="אחראי">${whoChip(t.assignee)}</button></div>`).join("")}</div>
        ${canEdit() ? `<div class="st-add">${icon("plus")}<input id="evNew" placeholder="משימה חדשה — למשל: להכין צידנית" aria-label="משימה חדשה" autocomplete="off"></div>` : ""}</section>
      ${idea ? `<button type="button" class="ev-from" data-idea>💡 מתוך הרעיון "${esc(idea.title)}" ←</button>` : ""}
      ${canEdit() ? `<div class="actions"><button class="danger" id="del">${icon("trash")}מחיקה</button><button class="secondary" id="edit">${icon("edit")}עריכה</button></div>` : ""}
    </div>`);
  const again = () => eventView(ev);
  sh.querySelector(".evv").addEventListener("click", e => {
    if (e.target.closest("[data-photos]")) return viewIdeaPhotos(idea, 0, again);
    if (e.target.closest("[data-idea]")){ closeSheet(); return setTimeout(() => ideaDetail(idea), 230); }
    const row = e.target.closest("[data-t]"); if (!row) return;
    const t = DB.tasks.find(x => x.id === row.dataset.t); if (!t || !canEdit()) return;
    if (e.target.closest(".dot")){
      if (t.done){ t.done = false; delete t.doneAt; delete t.doneBy; } else { t.done = true; t.doneAt = Date.now(); t.doneBy = me; }
      if (t.buy) syncBuy(t); save(); again(); return;
    }
    if (e.target.closest("[data-who]") && !t.done){ const P = peopleCycle(); t.assignee = P[(P.indexOf(t.assignee) + 1) % P.length]; save(); again(); }
  });
  const inp = sh.querySelector("#evNew");
  if (inp){
    const addTask = async () => {
      const title = inp.value.trim(); if (!title) return; inp.value = "";
      const t = { id:uid(), kind:"idea", ideaId: idea ? idea.id : null, eventId: idea ? null : ev.id, title, assignee:null, date:null, time:null, repeat:"none", done:false, buy:false, created:Date.now() };
      DB.tasks.push(t);
      if (isBuy(title)){ const l = await askList(title); if (l){ t.buy = l; syncBuy(t); } }
      save(); again(); setTimeout(() => document.getElementById("evNew")?.focus(), 80);
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addTask(); } });
    inp.addEventListener("change", addTask);
  }
  sh.querySelector("#edit")?.addEventListener("click", () => { closeSheet(); setTimeout(() => eventSheet(ev), 230); });
  sh.querySelector("#del")?.addEventListener("click", async () => {
    const own = DB.tasks.filter(t => t.eventId === ev.id);
    if (!await askConfirm(`למחוק את "${ev.title}"?`, `האירוע יימחק מהיומן${own.length ? ` יחד עם ${own.length === 1 ? "משימה אחת" : own.length + " משימות"}` : ""}.`)) return;
    own.forEach(t => { if (t.buy){ t.buy = false; syncBuy(t); } });
    DB.tasks = DB.tasks.filter(t => t.eventId !== ev.id);
    DB.events = DB.events.filter(x => x.id !== ev.id); save(); closeSheet(); renderCal(); toast("האירוע נמחק");
  });
}

function eventSheet(ev, preset={}){
  const edit = !!ev; const e = ev || { title:"", date:S.calSel, time:"", end:"", place:"", note:"", who:null, ...preset };
  const whoOpts = [["", "יחד"], ...people().map(k => [k, USERS[k].name])];
  // the event's tasks: an idea's event shares the idea's tasks; any other event has its own
  const idea0 = e.ideaId ? DB.ideas.find(x => x.id === e.ideaId) : null;
  const evId = edit ? ev.id : uid();
  const own = () => idea0 ? ideaTasks(idea0) : DB.tasks.filter(t => t.eventId === evId);
  let rows = own().map(t => ({ id:t.id, title:t.title, assignee:t.assignee, done:t.done, buy:t.buy ? (t.buy === "home" ? "home" : "super") : false }));
  const rowsHTML = () => rows.map((r, k) => `<div class="st-row ${r.done?"done":""}" data-k="${k}">
      <span class="dot ${r.done?"on":""}">${icon("tick")}</span>
      <input value="${esc(r.title)}" aria-label="משימה" ${r.done?"disabled":""}>
      <button type="button" class="st-cart ${r.buy?"on":""}" aria-pressed="${!!r.buy}" aria-label="${r.buy==="home"?"ברשימת לבית":r.buy?"ברשימת הסופר":"להוסיף לרשימת קניות"}" ${r.done?"disabled":""}>${icon(r.buy==="home"?"home":"cart")}</button>
      <button type="button" class="st-whob" style="border:0;background:none;padding:0" aria-label="אחראי">${whoChip(r.assignee)}</button>
      <button type="button" class="st-x" aria-label="הסרה">${icon("close")}</button></div>`).join("");
  const sh = openSheet(`${head(edit?"עריכת אירוע":"אירוע חדש")}
    <form id="ef" class="stack">
      <input class="input" name="title" placeholder="שם האירוע" value="${esc(e.title)}" aria-label="שם האירוע" required>
      <div><span class="lbl">של מי</span>${radios("who", whoOpts, e.who || "")}</div>
      <div class="cv-dates">
        <div><span class="lbl">תאריך</span><input class="input" type="date" name="date" value="${e.date||""}" required></div>
        <div><span class="lbl">שעה</span><input class="input" type="time" name="time" value="${e.time||""}"></div>
      </div>
      <div><span class="lbl">עד תאריך <small style="color:var(--faint)">(לאירוע של כמה ימים)</small></span><input class="input" type="date" name="end" value="${e.end||""}"></div>
      <input class="input" name="place" placeholder="מקום" value="${esc(e.place)}" aria-label="מקום">
      <textarea class="textarea" name="note" placeholder="הערה" aria-label="הערה">${esc(e.note)}</textarea>
      <section class="if-sec">
        <header><h4>${icon("chk")}משימות לאירוע</h4><small>יופיעו במסך המשימות</small></header>
        <div id="evRows">${rowsHTML()}</div>
        <div class="st-add">${icon("plus")}<input id="evNewRow" placeholder="משימה חדשה — למשל: לקנות מתנה" aria-label="משימה חדשה" autocomplete="off"></div>
        <div class="ev-due">תאריך יעד למשימות חדשות: <b>📅 עד יום האירוע</b></div>
      </section>
      <p class="error" id="eerr"></p>
      <div class="actions">
        ${edit?`<button type="button" class="danger" id="del">${icon("trash")}מחיקה</button>`:""}
        <button class="primary" type="submit">שמירה</button>
      </div>
    </form>`);
  const f = sh.querySelector("#ef");
  if (!edit) setTimeout(()=> (e.title ? f.date : f.title).focus(), 260);
  // tasks: same behaviour as in an idea — tap the person to change, 🛒 for the shopping list
  const $r = sh.querySelector("#evRows"), redraw = () => { $r.innerHTML = rowsHTML(); };
  const addRow = () => {
    const inp = sh.querySelector("#evNewRow"), t = inp.value.trim(); if (!t) return;
    const row = { title:t, assignee:null, done:false, buy:false }; rows.push(row); inp.value = ""; redraw();
    if (isBuy(t)) askList(t).then(l => { if (l){ row.buy = l; redraw(); } inp.focus(); }); else inp.focus();
  };
  sh.querySelector("#evNewRow").addEventListener("keydown", x => { if (x.key === "Enter"){ x.preventDefault(); addRow(); } });
  sh.querySelector("#evNewRow").addEventListener("blur", addRow);
  $r.addEventListener("input", x => { const row = x.target.closest("[data-k]"); if (row && x.target.tagName === "INPUT") rows[+row.dataset.k].title = x.target.value; });
  $r.addEventListener("keydown", x => { if (x.key === "Enter" && x.target.tagName === "INPUT"){ x.preventDefault(); sh.querySelector("#evNewRow").focus(); } });
  $r.addEventListener("click", x => {
    const row = x.target.closest("[data-k]"); if (!row) return; const r = rows[+row.dataset.k];
    if (x.target.closest(".st-x")){ rows.splice(+row.dataset.k, 1); redraw(); return; }
    if (x.target.closest(".st-cart") && !r.done){
      if (r.buy){ r.buy = false; redraw(); return; }
      askList(r.title).then(l => { if (l){ r.buy = l; redraw(); toast(`ייכנס לרשימת ${l==="home"?"לבית":"הסופר"} בשמירה`); } });
      return;
    }
    if (x.target.closest(".st-whob") && !r.done){ const P = peopleCycle(); r.assignee = P[(P.indexOf(r.assignee) + 1) % P.length]; redraw(); }
  });
  f.onsubmit = x => {
    x.preventDefault(); addRow();
    if (!f.title.value.trim() || !f.date.value){ sh.querySelector("#eerr").textContent="שם ותאריך הם שדות חובה."; return; }
    const end = f.end.value && f.end.value > f.date.value ? f.end.value : "";
    const data = { title:f.title.value.trim(), date:f.date.value, time:f.time.value, end, who: f.querySelector('input[name=who]:checked')?.value || null, place:f.place.value.trim(), note:f.note.value.trim() };
    const oldDate = edit ? ev.date : null;
    if (edit) Object.assign(ev, data); else DB.events.push({ id:evId, ideaId:e.ideaId||null, ...data });
    // sync the tasks into the Tasks screen (new ones are due on the event's day)
    const keep = new Set(); let added = 0, bought = 0;
    rows.filter(r => r.title.trim()).forEach(r => {
      if (r.id){ const t = DB.tasks.find(y => y.id === r.id); if (t){ keep.add(t.id); if (!t.done){ t.title = r.title.trim(); t.assignee = r.assignee; t.buy = r.buy || false; syncBuy(t); } } }
      else { const t = { id:uid(), kind:"idea", ideaId: idea0 ? idea0.id : null, eventId: idea0 ? null : evId, title:r.title.trim(), assignee:r.assignee, date:data.date, time:"", repeat:"none", done:false, buy:r.buy || false, created:Date.now() };
        DB.tasks.push(t); syncBuy(t); keep.add(t.id); added++; if (t.buy) bought++; }
    });
    own().filter(t => !keep.has(t.id) && !t.done).forEach(t => { t.buy = false; syncBuy(t); });
    const gone = new Set(own().filter(t => !keep.has(t.id) && !t.done).map(t => t.id));
    DB.tasks = DB.tasks.filter(t => !gone.has(t.id));
    // the event moved: its own open tasks that were due on the old day move with it
    if (edit && oldDate && oldDate !== data.date) DB.tasks.forEach(t => { if (!t.done && t.date === oldDate && (t.eventId === evId || (idea0 && t.ideaId === idea0.id))) t.date = data.date; });
    // an idea that needs tickets: scheduling it adds "לקנות כרטיסים" (once)
    const idea = !edit && e.ideaId && DB.ideas.find(x => x.id === e.ideaId);
    if (idea && idea.cost === "tix" && !ideaTasks(idea).some(t => !t.done && /כרטיס/.test(t.title)))
      DB.tasks.push({ id:uid(), kind:"idea", ideaId:idea.id, title:"לקנות כרטיסים", assignee:null, date:null, time:null, repeat:"none", done:false, buy:false, created:Date.now() });
    save(); closeSheet();
    S.calSel = data.date; const d=parse(data.date); S.calMonth=new Date(d.getFullYear(), d.getMonth(), 1); S.calWeek = iso(startOfWeek(d));
    go("cal"); toast(`${edit?"נשמר":"האירוע נכנס ליומן"}${added ? ` · ${added===1?"משימה אחת נוספה":added+" משימות נוספו"}` : ""}${bought ? ` · ${bought} לרשימת הקניות 🛒` : ""}`);
  };

/* ---------- photos: each one is its own small record, loaded only when an idea is opened ---------- */
const Photos = {
  cache:{},
  max(){ return Math.max(1, +FAM.maxPhotos || 6); },
  col(){ return Cloud.fb.collection(Cloud.db, "families", Cloud.fam, "envs", ENV, "photos"); },
  local(){ try { return JSON.parse(localStorage.getItem("nido.photos") || "[]"); } catch(e){ return []; } },
  saveLocal(a){ try { localStorage.setItem("nido.photos", JSON.stringify(a)); } catch(e){ toast("אין מספיק מקום לתמונה במכשיר"); throw e; } },
  async list(i){
    if (this.cache[i.id]) return this.cache[i.id];
    let arr = [];
    if (CLOUD){
      if (i.photoCount && Cloud.fb && Cloud.user){
        const F = Cloud.fb; const qs = await F.getDocs(F.query(this.col(), F.where("ideaId", "==", i.id)));
        arr = qs.docs.map(d => ({ id:d.id, ...d.data() }));
      }
    } else arr = this.local().filter(p => p.ideaId === i.id);
    arr.sort((a, b) => a.seq - b.seq);
    return this.cache[i.id] = arr;
  },
  /* what the gallery shows: the cover first (an old single picture counts as one), then the rest */
  gallery(i, arr){
    const g = [];
    const legacy = i.image && !arr.some(p => p.id === i.coverId);
    if (legacy) g.push({ legacy:true, img:i.image, by:null });
    const cov = arr.find(p => p.id === i.coverId);
    if (cov) g.push(cov);
    arr.forEach(p => { if (p !== cov) g.push(p); });
    return g;
  },
  count(i, arr){ return arr.length + (i.image && !arr.some(p => p.id === i.coverId) ? 1 : 0); },
  stat(i, arr){ i.photoCount = this.count(i, arr); i.photoBytes = arr.reduce((a, p) => a + (p.img || "").length, 0); },
  async add(i, full, thumb){
    const arr = await this.list(i);
    if (this.count(i, arr) >= this.max()) throw { code:"limit" };
    let seq = 1; while (arr.some(p => p.seq === seq)) seq++;
    if (seq > this.max()) throw { code:"limit" };
    const id = `${i.id}_${seq}`, doc = { ideaId:i.id, seq, img:full, by:me, at:Date.now() };
    if (CLOUD) await Cloud.fb.setDoc(Cloud.fb.doc(this.col(), id), doc);
    else { const all = this.local(); all.push({ id, ...doc }); this.saveLocal(all); }
    arr.push({ id, ...doc }); arr.sort((a, b) => a.seq - b.seq);
    if (!i.image){ i.image = thumb; i.coverId = id; }
    this.stat(i, arr);
  },
  async remove(i, p){
    const arr = await this.list(i);
    if (p.legacy){ i.image = ""; delete i.coverId; }
    else {
      if (CLOUD) await Cloud.fb.deleteDoc(Cloud.fb.doc(this.col(), p.id));
      else this.saveLocal(this.local().filter(x => x.id !== p.id));
      const k = arr.findIndex(x => x.id === p.id); if (k >= 0) arr.splice(k, 1);
      if (i.coverId === p.id){ i.image = ""; delete i.coverId; }
    }
    if (!i.image && arr.length){ i.image = await shrinkData(arr[0].img, 600); i.coverId = arr[0].id; }
    this.stat(i, arr);
  },
  async cover(i, p){
    if (p.legacy || i.coverId === p.id) return;
    const arr = await this.list(i);
    if (i.image && !i.coverId){ toast("קודם יש להסיר את התמונה הישנה"); return; }
    i.image = await shrinkData(p.img, 600); i.coverId = p.id; this.stat(i, arr);
  },
  async removeAll(i){
    try {
      const arr = await this.list(i);
      if (CLOUD) await Promise.all(arr.map(p => Cloud.fb.deleteDoc(Cloud.fb.doc(this.col(), p.id))));
      else this.saveLocal(this.local().filter(x => x.ideaId !== i.id));
    } catch(e){ console.warn("[photos]", e); }
    delete this.cache[i.id];
  },
};
/* a picture → JPEG of at most `side` pixels */
function shrinkData(src, side, q = .72){
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, side / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    ok(c.toDataURL("image/jpeg", q)); }; im.onerror = bad; im.src = src; });
}
function readFile(file){ return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file); }); }
/* several files from a picker → [{full, thumb}] (full ≈1280px, thumb 600px) */
async function pickPhotos(input){
  const out = [];
  for (const f of [...input.files]){ try { const src = await readFile(f); out.push({ full: await shrinkData(src, 1280), thumb: await shrinkData(src, 600) }); } catch(e){ console.warn(e); } }
  input.value = ""; return out;
}
async function addPhotosTo(i, picked){
  let n = 0;
  for (const ph of picked){
    try { await Photos.add(i, ph.full, ph.thumb); n++; }
    catch(e){ if (e && e.code === "limit"){ toast(`אפשר עד ${Photos.max()} תמונות לרעיון`); break; } toast(errText(e)); break; }
  }
  if (n){ save(); renderIdeas(); }
  return n;
}

const Viewer = {
  open(items, idx, meta = {}){
    if (!items.length) return;
    this.close(true);
    let k = Math.max(0, Math.min(idx, items.length - 1));
    const w = document.createElement("div"); w.className = "vw"; w.setAttribute("role", "dialog"); w.setAttribute("aria-label", "תמונה");
    const draw = () => {
      const it = items[k], who = it.by && (USERS[it.by] || ALLUSERS[it.by]);
      w.innerHTML = `<div class="vw-bg" style="background-image:url(${it.img})"></div>
        <div class="vw-top"><button type="button" class="vw-x" data-x aria-label="סגירה">${icon("close")}</button>
          ${items.length > 1 ? `<span class="vw-cnt tabular">${k + 1} / ${items.length}</span>` : "<span></span>"}
          <span class="vw-tools">${meta.onCover && canEdit() && !it.legacy && items.length > 1 && k > 0 ? `<button type="button" data-cover aria-label="תמונה ראשית">★</button>` : ""}${meta.onDelete && canEdit() ? `<button type="button" data-del aria-label="מחיקת התמונה">${icon("trash")}</button>` : ""}</span></div>
        <div class="vw-mid"><img class="vw-img" src="${it.img}" alt=""></div>
        ${items.length > 1 ? `<button type="button" class="vw-nav prev" data-prev aria-label="הקודמת">${icon("prev")}</button><button type="button" class="vw-nav next" data-next aria-label="הבאה">${icon("next")}</button>` : ""}
        <div class="vw-card"><div><b>${esc(meta.title || "")}</b><small>${[meta.place ? "📍 " + esc(meta.place) : "", who ? "נוסף ע״י " + esc(who.name) : "", it.at ? esc(new Date(it.at).toLocaleDateString("he-IL")) : ""].filter(Boolean).join(" · ")}</small></div>
          ${items.length > 1 ? `<div class="vw-dots">${items.map((_, j) => `<i class="${j === k ? "on" : ""}"></i>`).join("")}</div>` : ""}</div>`;
    };
    const go = d => { if (items.length < 2) return; k = (k + d + items.length) % items.length; draw(); };
    draw(); document.body.appendChild(w); requestAnimationFrame(() => w.classList.add("show"));
    w.onclick = async e => {
      if (e.target.closest("[data-x]")) return this.close();
      if (e.target.closest("[data-prev]")) return go(-1);
      if (e.target.closest("[data-next]")) return go(1);
      if (e.target.closest("[data-cover]")){ await meta.onCover(items[k]); toast("נקבעה כתמונה ראשית"); return this.close(); }
      if (e.target.closest("[data-del]")){
        if (!await askConfirm("למחוק את התמונה?", "היא תימחק מהרעיון לכל המשפחה.")) return;
        try { await meta.onDelete(items[k]); } catch(x){ toast(errText(x)); return; }
        items.splice(k, 1); toast("התמונה נמחקה");
        if (!items.length) return this.close(); k = Math.min(k, items.length - 1); draw(); return;
      }
      if (e.target.closest(".vw-mid") && !e.target.closest(".vw-img")) this.close();
    };
    let sx = 0, sy = 0;
    w.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
    w.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx > 0 ? 1 : -1);
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) this.close();
    });
    this.key = e => { if (e.key === "Escape") this.close(); else if (e.key === "ArrowLeft") go(1); else if (e.key === "ArrowRight") go(-1); };
    document.addEventListener("keydown", this.key);
    this.el = w;
  },
  close(now){
    const w = this.el; if (!w) return; this.el = null;
    document.removeEventListener("keydown", this.key);
    if (now) return w.remove();
    w.classList.remove("show"); setTimeout(() => w.remove(), 200);
  },
};

        ${pl.next ? `<button type="button" class="r" data-ev="${pl.next.id}"><span class="k">📅</span><span class="v">נקבע ל${esc(shortDate(pl.next.date))}${pl.next.time ? ` · ${pl.next.time}` : ""}</span><span class="go">${icon("prev")}</span></button>` : ""}
      </div>` : ""}
      <div class="id-likes">
        <div class="likers">${likers(i) || `<span class="who none">עוד אף אחד</span>`}</div>
        <button class="want ${mine?"on":""}" id="want">${icon(mine?"heart":"heart-o")}בא לי</button>
      </div>
      ${i.cost === "tix" && !pl.next && canEdit() ? `<div class="id-auto">✓ כשקובעים ביומן — תיווצר משימה "לקנות כרטיסים"</div>` : ""}
      ${ts.length ? `<section class="if-sec"><header><h4>${icon("chk")}משימות</h4><small>${ts.filter(t=>t.done).length}/${ts.length} בוצעו</small></header>
        <div id="dTasks">${ts.map(t => `<div class="st-row ${t.done?"done":""}" data-t="${t.id}">
          <button type="button" class="dot ${t.done?"on":""}" aria-label="סימון">${icon("tick")}</button><span class="t">${esc(t.title)}</span>${t.buy?`<span class="st-cart on lbl" aria-label="ברשימת קניות">${icon(t.buy==="home"?"home":"cart")}<b>${t.buy==="home"?"לבית":"סופר"}</b></span>`:""}${whoChip(t.assignee)}</div>`).join("")}</div></section>` : ""}
      <section class="if-sec"><header><h4>★ איך היה?</h4>${times?`<small>נקבע ביומן ${times===1?"פעם אחת":times+" פעמים"}</small>`:""}</header>
        <div id="dFb">${feedbackHTML(i.rating||0, i.review)}</div></section>
      <div class="row-btns"><button class="primary" id="plan">${icon("cal")} קובעים</button></div>
      <div class="actions"><button class="danger" id="del">${icon("trash")}מחיקה</button><button class="secondary" id="edit">${icon("edit")}עריכה</button></div>
    </div>`);
  // photo strip: loaded only now
  const strip = sh.querySelector("#strip");
  const drawStrip = async () => {
    let arr = []; try { arr = await Photos.list(i); } catch(e){ console.warn(e); }
    if (!sh.isConnected) return;
    const g = Photos.gallery(i, arr), room = canEdit() && g.length < Photos.max();
    strip.innerHTML = (g.length > 1 ? g.map((p, k) => `<button type="button" class="th ${k === 0 ? "on" : ""}" data-view="${k}"><img src="${p.img}" alt=""></button>`).join("") : "")
      + (room ? `<label class="th add" aria-label="הוספת תמונות">${icon("plus")}<span>תמונה</span><input type="file" accept="image/*" multiple hidden></label>` : "");
    strip.hidden = !strip.innerHTML;
    strip.querySelector("input")?.addEventListener("change", async ev => {
      const picked = await pickPhotos(ev.target); if (!picked.length) return;
      toast("מעלה…"); const n = await addPhotosTo(i, picked);
      if (n){ toast(n === 1 ? "התמונה נוספה" : `${n} תמונות נוספו`); ideaDetail(i); }
    });
  };
  drawStrip();
  sh.querySelector(".detail").addEventListener("click", e => {
    const v = e.target.closest("[data-view]"); if (v && !v.disabled) viewIdeaPhotos(i, +v.dataset.view, () => ideaDetail(i));
    const ev = e.target.closest("[data-ev]"); if (ev){ const x = DB.events.find(y => y.id === ev.dataset.ev); if (x){ closeSheet(); setTimeout(() => eventView(x), 230); } }
  });
  const state = { rating:i.rating||0, review:i.review||"" };
  bindFeedback(sh.querySelector("#dFb"), state, () => { i.rating = state.rating; i.review = (state.review||"").trim(); save(); renderIdeas(); });
  const dt = sh.querySelector("#dTasks"); if (dt) dt.onclick = e => {
    const b = e.target.closest(".dot"); if (!b) return; const t = DB.tasks.find(x => x.id===b.closest("[data-t]").dataset.t);
    if (t.done){ t.done=false; delete t.doneAt; delete t.doneBy; } else { t.done=true; t.doneAt=Date.now(); t.doneBy=me; }
    if (t.buy) syncBuy(t);
    save(); renderIdeas(); ideaDetail(i);
  };
  sh.querySelector("#want").onclick = () => { toggleLike(i); renderIdeas(); ideaDetail(i); };
  sh.querySelector("#plan").onclick = () => { closeSheet(); setTimeout(()=>eventSheet(null, { title:i.title, ideaId:i.id, place:i.place||"", date:iso(new Date()) }), 230); };
  sh.querySelector("#edit").onclick = () => { closeSheet(); setTimeout(()=>ideaForm(i), 230); };
  sh.querySelector("#del").onclick = async () => {
    const evs = DB.events.filter(e => e.ideaId===i.id), parts = [];
    if (ts.length) parts.push(ts.length===1 ? "משימה אחת" : ts.length+" משימות");
    if (evs.length) parts.push(evs.length===1 ? "אירוע אחד ביומן" : evs.length+" אירועים ביומן");
    if (i.photoCount > 1) parts.push(i.photoCount + " תמונות");
    if (!await askConfirm(`למחוק את "${i.title}"?`, `הרעיון יימחק${parts.length?` יחד עם ${parts.join(" ו")}`:""}.`)) return;
    ts.forEach(t => { if (t.buy){ t.buy = false; syncBuy(t); } });          // its items leave the shopping list too
    const evIds = new Set(evs.map(e => e.id));
    DB.tasks = DB.tasks.filter(t => t.ideaId!==i.id && !(t.eventId && evIds.has(t.eventId)));
    DB.events = DB.events.filter(e => e.ideaId!==i.id);
    Photos.removeAll(i);
    DB.ideas = DB.ideas.filter(x=>x.id!==i.id); save(); closeSheet(); renderIdeas(); toast("הרעיון נמחק");
  };
}

function ideaForm(idea){
  const edit = !!idea; const i = idea || { title:"", desc:"", link:"", image:"", rating:0, review:"", place:"", cost:"", price:"", tixLink:"", cat:"" };
  const tid = edit ? idea.id : uid();
  // photos: the old single picture / pasted link ("legacy"), saved photos, and new ones waiting for "שמירה"
  let legacy = i.image && !i.coverId ? i.image : "", photos = [];
  const adds = [], dels = new Set();
  const items = () => [
    ...(legacy ? [{ k:"legacy", img:legacy }] : []),
    ...photos.filter(p => !dels.has(p.id)).sort((a, b) => (b.id === i.coverId) - (a.id === i.coverId) || a.seq - b.seq).map(p => ({ k:"p:" + p.id, img:p.img })),
    ...adds.map((a, j) => ({ k:"n:" + j, img:a.thumb })) ];
  let cat = i.cat || "", cost = i.cost || "";
  const state = { rating:i.rating||0, review:i.review||"" };
  let rows = edit ? ideaTasks(i).map(t => ({ id:t.id, title:t.title, assignee:t.assignee, done:t.done, buy:t.buy ? (t.buy === "home" ? "home" : "super") : false })) : [];
  const cover = () => { const it = items();
    return it.length
      ? `<img src="${it[0].img}" alt="">${it.length > 1 ? `<b class="pc">📷 ${it.length}</b>` : ""}`
      : `<div class="ph">${icon("image")}<span>הוספת תמונות</span><small style="color:var(--faint)">עד ${Photos.max()} · מהגלריה או מהמצלמה</small></div>`; };
  const stripHTML = () => { const it = items();
    return it.length ? it.map((x, k) => `<span class="th ${k === 0 ? "on" : ""}"><img src="${x.img}" alt=""><button type="button" data-rmk="${x.k}" aria-label="הסרת התמונה">${icon("close")}</button></span>`).join("")
      + (it.length < Photos.max() ? `<label class="th add" aria-label="הוספת תמונות">${icon("plus")}<span>תמונה</span><input type="file" accept="image/*" multiple hidden id="moreFiles"></label>` : "") : ""; };
  const catsHTML = (t = i.title) => { const sel = cat || guessCat(t);
    return Object.entries(CATS).map(([k, [l, e]]) => `<button type="button" class="${k === sel ? "on" : ""} ${k === sel && !cat ? "auto" : ""}" data-cat="${k}">${e} ${l}</button>`).join(""); };
  const rowsHTML = () => rows.map((r, k) => `<div class="st-row ${r.done?"done":""}" data-k="${k}">
      <span class="dot ${r.done?"on":""}">${icon("tick")}</span>
      <input value="${esc(r.title)}" aria-label="משימה" ${r.done?"disabled":""}>
      <button type="button" class="st-cart ${r.buy?"on":""}" aria-pressed="${!!r.buy}" aria-label="${r.buy==="home"?"ברשימת לבית":r.buy?"ברשימת הסופר":"להוסיף לרשימת קניות"}" title="${r.buy==="home"?"לבית":r.buy?"סופר":"לרשימת קניות"}" ${r.done?"disabled":""}>${icon(r.buy==="home"?"home":"cart")}</button>
      <button type="button" class="st-whob" style="border:0;background:none;padding:0" aria-label="אחראי">${whoChip(r.assignee)}</button>
      <button type="button" class="st-x" aria-label="הסרה">${icon("close")}</button></div>`).join("");
  const sh = openSheet(`${head(edit?"עריכת רעיון":"רעיון חדש")}
    <form id="xf" novalidate>
      <div class="if-cover pick-wrap ${items().length?"has":""}" id="cover"><div id="coverView" style="position:absolute;inset:0">${cover()}</div><input type="file" accept="image/*" multiple id="file" aria-label="בחירת תמונות"></div>
      <div class="id-strip form" id="fStrip">${stripHTML()}</div>
      <button type="button" class="if-urlbtn" id="urlBtn">${icon("link")}או להדביק קישור לתמונה</button>
      <div class="if-link" id="urlRow" hidden style="margin:0 0 12px">${icon("image")}<input id="imgUrl" placeholder="https://…/photo.jpg" inputmode="url" aria-label="קישור לתמונה"></div>
      <input class="if-title" name="title" placeholder="מה בא לכם לעשות?" value="${esc(i.title)}" aria-label="שם הרעיון" autocomplete="off">
      <textarea class="if-desc" name="desc" rows="2" placeholder="כמה מילים — מה, איפה, למה זה כיף" aria-label="תיאור">${esc(i.desc)}</textarea>
      <span class="if-lbl">סוג</span><div class="if-cats" id="cats">${catsHTML()}</div>
      <div class="if-link rtl"><span class="em">📍</span><input name="place" placeholder="איפה? שם מקום או כתובת" value="${esc(i.place||"")}" aria-label="מיקום" autocomplete="off"></div>
      <span class="if-lbl">עלות</span>
      <div class="if-cost" id="cost">${Object.entries(COST).map(([k, [e, l]]) => `<button type="button" data-cost="${k}" class="${cost === k ? "on " + k : ""}">${e} ${k === "tix" ? "כרטיסים" : l}</button>`).join("")}</div>
      <div class="if-two" id="costMore" ${cost === "paid" || cost === "tix" ? "" : "hidden"}>
        <div class="if-link rtl"><span class="em">₪</span><input name="price" placeholder="מחיר (למשל 119 לאדם)" value="${esc(i.price||"")}" aria-label="מחיר"></div>
        <div class="if-link" id="tixRow" ${cost === "tix" ? "" : "hidden"}>${icon("link")}<input name="tixLink" placeholder="קישור לכרטיסים" value="${esc(i.tixLink||"")}" inputmode="url" aria-label="קישור לכרטיסים"></div>
      </div>
      <div class="if-link">${icon("link")}<input name="link" placeholder="קישור (אתר, מפה, הזמנה)" value="${esc(i.link)}" inputmode="url" aria-label="קישור"></div>

      <section class="if-sec">
        <header><h4>${icon("chk")}משימות להכנה</h4><small>יופיעו במסך המשימות</small></header>
        <div id="rows">${rowsHTML()}</div>
        <div class="st-add">${icon("plus")}<input id="newRow" placeholder="למשל: להזמין מקום, להכין פיקניק" aria-label="משימה חדשה" autocomplete="off"></div>
      </section>

      <section class="if-sec">
        <header><h4>★ איך היה?</h4><small>אפשר למלא גם אחר כך</small></header>
        <div id="fb">${feedbackHTML(state.rating, state.review)}</div>
      </section>

      <div class="if-foot"><div class="row"><button class="primary" type="submit">${edit?"שמירה":"הוספה למאגר"}</button></div></div>
    </form>`);
  const f = sh.querySelector("#xf"), $r = sh.querySelector("#rows");
  // type + cost
  const catsEl = sh.querySelector("#cats"), costEl = sh.querySelector("#cost");
  catsEl.onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; cat = cat === b.dataset.cat ? "" : b.dataset.cat; catsEl.innerHTML = catsHTML(f.title.value); };
  f.title.addEventListener("input", () => { if (!cat) catsEl.innerHTML = catsHTML(f.title.value); });
  costEl.onclick = e => { const b = e.target.closest("[data-cost]"); if (!b) return; cost = cost === b.dataset.cost ? "" : b.dataset.cost;
    costEl.querySelectorAll("[data-cost]").forEach(x => x.className = x.dataset.cost === cost ? "on " + cost : "");
    sh.querySelector("#costMore").hidden = !(cost === "paid" || cost === "tix"); sh.querySelector("#tixRow").hidden = cost !== "tix"; };
  if (!edit) setTimeout(()=>f.title.focus(), 260);
  bindFeedback(sh.querySelector("#fb"), state);

  // cover image
  const coverEl = sh.querySelector("#cover"), view = sh.querySelector("#coverView"), fStrip = sh.querySelector("#fStrip");
  const paint = () => { view.innerHTML = cover(); coverEl.classList.toggle("has", !!items().length); fStrip.innerHTML = stripHTML(); fStrip.hidden = !items().length; };
  paint();
  if (edit && i.photoCount) Photos.list(idea).then(a => { photos = a.slice(); paint(); }).catch(e => console.warn(e));
  const takeFiles = async input => {
    const room = Photos.max() - items().length; if (room <= 0){ input.value = ""; toast(`אפשר עד ${Photos.max()} תמונות לרעיון`); return; }
    const picked = await pickPhotos(input);
    if (picked.length > room) toast(`נוספו ${room} — אפשר עד ${Photos.max()} תמונות לרעיון`);
    adds.push(...picked.slice(0, room)); paint();
  };
  sh.querySelector("#file").addEventListener("change", ev => { if (items().length){ ev.preventDefault(); } takeFiles(ev.target); });
  coverEl.addEventListener("click", e => { if (items().length){ e.preventDefault(); } }, true);
  fStrip.addEventListener("change", e => { if (e.target.id === "moreFiles") takeFiles(e.target); });
  fStrip.addEventListener("click", e => {
    const b = e.target.closest("[data-rmk]"); if (!b) return; e.preventDefault();
    const k = b.dataset.rmk;
    if (k === "legacy") legacy = ""; else if (k.startsWith("p:")) dels.add(k.slice(2)); else adds.splice(+k.slice(2), 1);
    paint();
  });
  sh.querySelector("#urlBtn").onclick = () => { const r = sh.querySelector("#urlRow"); r.hidden = false; sh.querySelector("#urlBtn").hidden = true; sh.querySelector("#imgUrl").focus(); };
  sh.querySelector("#imgUrl").addEventListener("change", e => {
    const u = e.target.value.trim(); if (!u) return;
    const url = /^https?:\/\//.test(u) ? u : "https://" + u, test = new Image();
    test.onload = () => { if (!legacy && items().length >= Photos.max()){ toast(`אפשר עד ${Photos.max()} תמונות לרעיון`); return; } legacy = url; paint(); toast("התמונה נוספה"); };
    test.onerror = () => toast("לא הצלחתי לטעון תמונה מהקישור הזה");
    test.src = url;
  });

  // sub-tasks
  const redraw = () => { $r.innerHTML = rowsHTML(); };
  const addRow = () => {
    const inp = sh.querySelector("#newRow"), t = inp.value.trim(); if (!t) return;
    const row = { title:t, assignee:null, done:false, buy:false }; rows.push(row); inp.value = ""; redraw();
    if (isBuy(t)) askList(t).then(l => { if (l){ row.buy = l; redraw(); } inp.focus(); }); else inp.focus();
  };
  sh.querySelector("#newRow").addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); addRow(); } });
  sh.querySelector("#newRow").addEventListener("blur", addRow);
  $r.addEventListener("input", e => { const row = e.target.closest("[data-k]"); if (row && e.target.tagName==="INPUT") rows[+row.dataset.k].title = e.target.value; });
  $r.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); sh.querySelector("#newRow").focus(); } });
  $r.addEventListener("click", e => {
    const row = e.target.closest("[data-k]"); if (!row) return; const r = rows[+row.dataset.k];
    if (e.target.closest(".st-x")){ rows.splice(+row.dataset.k, 1); redraw(); return; }
    if (e.target.closest(".st-cart") && !r.done){
      if (r.buy){ r.buy = false; redraw(); return; }
      askList(r.title).then(l => { if (l){ r.buy = l; redraw(); toast(`ייכנס לרשימת ${l==="home"?"לבית":"הסופר"} בשמירה`); } });
      return;
    }
    if (e.target.closest(".st-whob") && !r.done){ { const P = peopleCycle(); r.assignee = P[(P.indexOf(r.assignee) + 1) % P.length]; } redraw(); }
  });

  f.onsubmit = e => {
    e.preventDefault(); addRow();
    const title = f.title.value.trim(); if (!title){ f.title.focus(); f.title.style.borderBottomColor = "var(--err)"; return; }
    const data = { title, desc:f.desc.value.trim(), link:f.link.value.trim(), rating:state.rating, review:(sh.querySelector("#fb .fb-text").value||"").trim(),
      cat, place:f.place.value.trim(), cost, price: cost === "paid" || cost === "tix" ? f.price.value.trim() : "", tixLink: cost === "tix" ? f.tixLink.value.trim() : "" };
    let target = idea;
    if (edit){
      Object.assign(idea, data);
      if (legacy && legacy !== (idea.coverId ? "" : idea.image)){ idea.image = legacy; delete idea.coverId; }   // a newly pasted link becomes the cover
      else if (!legacy && idea.image && !idea.coverId) idea.image = "";                                          // the old picture was removed
    } else { target = { id:tid, ...data, image:legacy, likes:[me], created:Date.now() }; DB.ideas.push(target); }
    // photos: removals first, then the new ones (written right after the idea itself)
    if (dels.size || adds.length || (edit && !target.image && target.photoCount)) (async () => {
      try {
        const arr = await Photos.list(target);
        for (const id of dels){ const ph = arr.find(x => x.id === id); if (ph) await Photos.remove(target, ph); }
        for (const a of adds) await Photos.add(target, a.full, a.thumb);
        const now = await Photos.list(target);
        if (!target.image && now.length){ target.image = await shrinkData(now[0].img, 600); target.coverId = now[0].id; }
        Photos.stat(target, now);
      } catch(x){ toast(x && x.code === "limit" ? `אפשר עד ${Photos.max()} תמונות לרעיון` : errText(x)); }
      save(); renderIdeas();
    })();
    else if (edit) Photos.stat(target, Photos.cache[target.id] || photos);
    // sync sub-tasks into the Tasks screen
    const keep = new Set(); let added = 0, bought = 0;
    rows.filter(r => r.title.trim()).forEach(r => {
      if (r.id){ const t = DB.tasks.find(x => x.id===r.id); if (t){ keep.add(t.id); if (!t.done){ t.title = r.title.trim(); t.assignee = r.assignee; t.buy = r.buy || false; syncBuy(t); } } }
      else { const t = { id:uid(), kind:"idea", ideaId:target.id, title:r.title.trim(), assignee:r.assignee, date:null, time:null, repeat:"none", done:false, buy:r.buy || false, created:Date.now() }; DB.tasks.push(t); syncBuy(t); keep.add(t.id); added++; if (t.buy) bought++; }
    });
    DB.tasks.filter(t => t.ideaId===target.id && !keep.has(t.id) && !t.done).forEach(t => { t.buy = false; syncBuy(t); });
    DB.tasks = DB.tasks.filter(t => t.ideaId!==target.id || keep.has(t.id) || t.done);
    save(); closeSheet(); renderIdeas();
    toast(added ? `${edit?"נשמר":"הרעיון נוסף"} · ${added===1?"משימה אחת נוספה":added+" משימות נוספו"}${bought?` · ${bought} לרשימת הקניות 🛒`:""}` : (edit?"נשמר":"הרעיון נוסף למאגר"));
  };

/* ================= Forms: submit without native submission ================= */
// The viewer sandbox blocks real form submission, so a tap on a submit button (or Enter in a field)
// is turned into a plain "submit" event that our handlers already listen to.
function fireSubmit(f){ f.dispatchEvent(new Event("submit", { cancelable:true, bubbles:true })); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !b.form) return;
  if ((b.getAttribute("type") || "submit") !== "submit" || b.disabled) return;
  e.preventDefault(); fireSubmit(b.form);
}, true);
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.defaultPrevented || e.isComposing) return;
  const t = e.target; if (t.tagName !== "INPUT" || !t.form || t.type === "file") return;
  if (!t.form.querySelector('button[type="submit"], button:not([type])')) return;
  e.preventDefault(); fireSubmit(t.form);
});

/* "לקנות …" → ask which shopping list. Resolves "super" | "home" | null */
const BUY_RE = /(^|\s)(לקנות|לקנייה|קניית|קנייה של)(\s|$)/;

function askList(title){
  return new Promise(resolve => {

    A(T.h1,   [{opacity:0, transform:"translateY(14px)"},{opacity:1, transform:"none"}], { duration:1500, delay:550, easing:EZ });
    A(T.p,    [{opacity:0, transform:"translateY(10px)"},{opacity:1, transform:"none"}], { duration:1500, delay:900, easing:EZ });
    A($s(".halo"), [{opacity:0, transform:"scale(.5)"},{opacity:1, transform:"scale(1)"}], { duration:3200, delay:200, easing:EZ });
    A($s(".ring"), [{opacity:0, transform:"scale(.8)"},{opacity:.55, offset:.25},{opacity:0, transform:"scale(2.2)"}], { duration:2600, delay:800, easing:EZ });
    el.querySelectorAll(".dust i").forEach(d => A(d, [{opacity:0, transform:"translateY(10px)"},{opacity:.7, offset:.35},{opacity:0, transform:"translateY(-50px)"}], { duration:4200, delay:500 + Math.random()*1400, easing:EZ }));
    A(sh, [{opacity:1, backgroundPosition:"120% 0"},{opacity:1, backgroundPosition:"-20% 0"}], { duration:1800, delay:1300, easing:IO });
    A($s(".studio"), [{opacity:0, transform:"translateY(8px)"},{opacity:1, transform:"none"}], { duration:1400, delay:1700, easing:EZ });
    A($s(".studio .line"), [{transform:"scaleX(0)"},{transform:"scaleX(1)"}], { duration:1600, delay:1800, easing:EZ });
    cover();
  } else {
    [["logo",L.logo],["h1",L.h1],["p",L.p]].forEach(([k, n], i) => {
      const t = from(n, T[k], k); if (t) A(T[k], [{ transform:t }, { transform:"none" }], { duration:1500, delay:60*i, easing:EZ, fill:"both" });
    });
    if (brand) brand.style.visibility = "hidden";
    loginAnims.push(A(form, [{opacity:1, transform:"none"}, {opacity:0, transform:"translateY(14px)"}], { duration:600, easing:IO }));
    rest.forEach(n => loginAnims.push(A(n, [{opacity:1},{opacity:0}], { duration:400 })));
    A($s(".bg"), [{opacity:0},{opacity:1}], { duration:1000, easing:IO });
    A($s(".halo"), [{opacity:0, transform:"scale(.5)"},{opacity:1, transform:"scale(1)"}], { duration:3200, delay:500, easing:EZ });
    A($s(".ring"), [{opacity:0, transform:"scale(.8)"},{opacity:.55, offset:.25},{opacity:0, transform:"scale(2.2)"}], { duration:2600, delay:1100, easing:EZ });
    el.querySelectorAll(".dust i").forEach(d => A(d, [{opacity:0, transform:"translateY(10px)"},{opacity:.7, offset:.35},{opacity:0, transform:"translateY(-50px)"}], { duration:4200, delay:700 + Math.random()*1400, easing:EZ }));
    A(sh, [{opacity:1, backgroundPosition:"120% 0"},{opacity:1, backgroundPosition:"-20% 0"}], { duration:1800, delay:1400, easing:IO });
    A($s(".studio"), [{opacity:0, transform:"translateY(8px)"},{opacity:1, transform:"none"}], { duration:1400, delay:1900, easing:EZ });
    A($s(".studio .line"), [{transform:"scaleX(0)"},{transform:"scaleX(1)"}], { duration:1600, delay:2000, easing:EZ });
    setTimeout(cover, 1050);                                   // background is opaque by now → swap the app in underneath
  }

  // 2 · hand-off: content dissolves, the backdrop melts into the app's own background, the app cascades in
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true; cover();
    el.style.pointerEvents = "none";
    const parts = [...$("#screen").children, document.querySelector("nav.tabs .row")].filter(Boolean);
    if (reduce){ A(el, [{opacity:1},{opacity:0}], { duration:400 }); setTimeout(() => { el.remove(); if (brand) brand.style.visibility = ""; }, 450); return; }
    parts.forEach(n => { n.style.opacity = "0"; });
    [".center", ".studio", ".halo", ".dust"].forEach(q => A($s(q), [{opacity:1, transform:"none"},{opacity:0, transform: q===".center" ? "scale(1.04) translateY(-8px)" : "none"}], { duration:700, easing:IO }));
    A($s(".bg2"), [{opacity:0},{opacity:1}], { duration:700, easing:IO });
    setTimeout(() => {
      A(el, [{opacity:1},{opacity:0}], { duration:900, easing:IO });
      parts.forEach((n, i) => {
        const anim = n.animate([{opacity:0, transform:"translateY(18px)"},{opacity:1, transform:"none"}], { duration:1000, delay:90*i, easing:EZ, fill:"backwards" });
        n.style.opacity = "";
        anim.onfinish = () => { n.style.transform = ""; };
      });
      setTimeout(() => { el.remove(); if (brand) brand.style.visibility = ""; loginAnims.forEach(a => a && a.cancel()); }, 950);
    }, 550);
  };
  el.addEventListener("click", finish);
  setTimeout(finish, reduce ? 1400 : 4300);
}

/* ================= Profile & users admin ================= */
const UsersAPI = {
  async update(username, patch){
    if (CLOUD) return Cloud.updateUser(username, patch);
    Object.assign(USERS[username], patch); storeUsers(); afterUsersChange();
  },
  async create(d){
    if (CLOUD) return Cloud.createUser(d);
    if (USERS[d.username]) throw { code:"taken" };
    delete d.family;
    USERS[d.username] = { name:d.name, color:d.color, role:d.role, photo:"", active:true, password:d.password, noteLimit:d.noteLimit||1 };
    storeUsers(); afterUsersChange();
  },
  async remove(username){
    if (CLOUD) return Cloud.deleteUser(username);
    delete USERS[username]; storeUsers(); afterUsersChange();
  },
  async password(cur, next){
    if (CLOUD) return Cloud.changePassword(cur, next);
    if (USERS[me].password !== cur) throw { code:"auth/wrong-password" };
    USERS[me].password = next; storeUsers();
  },
};
function afterUsersChange(){ document.documentElement.classList.toggle("ro", !canEdit()); Skin.sync(); refreshOpenPanels(); softRender(); }
function refreshOpenPanels(){
  if (!$("#admin").hidden && !$("#admin").contains(document.activeElement)) Admin.render();
  if (S.panel === "admin" && $("#sheetRoot .sheet") && !$("#sheetRoot").contains(document.activeElement)) openAdmin(true);
}
const errText = e => {
  const c = String(e && e.code || "");
  if (c === "taken" || c.includes("email-already-in-use")) return "שם המשתמש הזה כבר תפוס.";
  if (c.includes("wrong-password") || c.includes("invalid-credential")) return "הסיסמה הנוכחית שגויה.";
  if (c.includes("weak-password")) return "הסיסמה חלשה מדי — לפחות 6 תווים.";
  if (c.includes("operation-not-allowed") || c.includes("admin-restricted")) return "יצירת משתמשים חסומה בהגדרות Firebase.";
  if (c.includes("permission")) return "אין לך הרשאה לפעולה הזו.";
  if (c.includes("too-many")) return "יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.";
  if (c.includes("network") || !navigator.onLine) return "אין חיבור לאינטרנט.";
  return "משהו השתבש. נסה שוב.";
};
const roleBadge = (r, uid) => uid && uid === BOOT_ADMIN_UID ? `<span class="role-badge admin">מנהל מערכת</span>` : `<span class="role-badge ${r}">${esc(ROLES[r]?.label || r)}</span>`;

const swatches = sel => `<div class="swatches" role="radiogroup" aria-label="צבע">${PALETTE.map(c => `<button type="button" data-c="${c}" class="${c===sel?"on":""}" style="background:${c}" aria-label="צבע"></button>`).join("")}</div>`;
function bindSwatches(root, state){
  root.querySelector(".swatches").addEventListener("click", e => {
    const b = e.target.closest("[data-c]"); if (!b) return;
    state.color = b.dataset.c; root.querySelectorAll(".swatches button").forEach(x => x.classList.toggle("on", x === b));
    const av = root.querySelector(".pf-ava"); if (av && !state.photo) av.style.background = state.color;
  });

function pickAvatar(input, done){
  const file = input.files[0]; if (!file) return;
  const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 256;
    c.getContext("2d").drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, 256, 256);
    done(c.toDataURL("image/jpeg", .8)); }; im.src = r.result; }; r.readAsDataURL(file);
}

  const people = id => Object.keys(ALLUSERS).filter(k => ALLUSERS[k].family === id).sort((a, b) => (ALLUSERS[b].active!==false) - (ALLUSERS[a].active!==false) || (a===me?-1:b===me?1:0) || ALLUSERS[a].name.localeCompare(ALLUSERS[b].name, "he"));
  const html = `${head("משפחות ומשתמשים")}
    <p class="note">${ids.length} משפחות · ${Object.keys(ALLUSERS).length} משתמשים. כל משפחה רואה רק את עצמה — גם אתה לא רואה את התוכן של משפחות אחרות.</p>
    ${ids.map(id => { const ks = people(id); return `<section class="fam">
      <header><button type="button" class="fam-name" data-fren="${esc(id)}">${icon("home")}<b>${id === HOME_FAMILY ? "המשפחה שלנו" : "משפחת " + esc(fams[id].name)}</b>${id !== HOME_FAMILY ? icon("edit") : ""}</button><small>${ks.length} ${ks.length === 1 ? "משתמש" : "משתמשים"}</small></header>
      <ul class="ulist">${ks.map(k => { const u = ALLUSERS[k]; return `<li><button type="button" data-u="${esc(k)}" class="${u.active===false?"off":""}">
        <span class="u-ava" style="background:${u.color};${avaStyle(u)}">${initial(u)}</span>
        <span class="u-txt"><b>${esc(u.name)}${k===me?" (אני)":""}</b><small>@${esc(k)}</small></span>
        ${u.active===false?`<span class="role-badge viewer">מושבת</span>`:roleBadge(u.role||"editor", u.uid)}</button></li>`; }).join("")}</ul>
      <button type="button" class="secondary fam-add" data-fnew="${esc(id)}">${icon("plus")} משתמש ל${id === HOME_FAMILY ? "משפחה שלנו" : "משפחת " + esc(fams[id].name)}</button>
    </section>`; }).join("")}
    <button type="button" class="primary" id="newFam">${icon("plus")} משפחה חדשה</button>`;
  let sh;
  if (refresh && $("#sheetRoot .sheet .inner")){ sh = $("#sheetRoot .sheet"); sh.querySelector(".inner").innerHTML = `<div class="grab"></div>${html}`; sh.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet); }
  else sh = openSheet(html);
  S.panel = "admin";
  sh.querySelector(".inner").onclick = async e => {
    const u = e.target.closest("[data-u]"); if (u) return openUserEdit(u.dataset.u);
    const nw = e.target.closest("[data-fnew]"); if (nw) return openUserEdit(null, nw.dataset.fnew);
    const rn = e.target.closest("[data-fren]"); if (rn && rn.dataset.fren !== HOME_FAMILY) return openFamilyForm(rn.dataset.fren);
    if (e.target.closest("#newFam")) return openFamilyForm(null);
  };
}
function openFamilyForm(id){
  const isNew = !id, cur = id ? (FAMILIES[id]?.name || "") : "";
  const sh = openSheet(`${head(isNew ? "משפחה חדשה" : "שם המשפחה")}
    <form id="ff" class="pf-form" autocomplete="off">
      <span class="lbl">שם המשפחה</span><input class="input" name="name" value="${esc(cur)}" maxlength="30" placeholder="למשל: כהן">
      ${isNew ? `<p class="note">אחרי היצירה מוסיפים לה משתמשים. הנתונים של כל משפחה נפרדים לגמרי.</p>` : ""}
      <p class="error" id="ffErr" role="alert"></p>
      <div class="actions"><button type="button" class="secondary" id="ffBack">חזרה</button><button class="primary" type="submit" id="ffSave">${isNew ? "יצירת משפחה" : "שמירה"}</button></div>
    </form>`);
  setTimeout(() => sh.querySelector("input[name=name]").focus(), 250);
  sh.querySelector("#ffBack").onclick = () => openAdmin();
  sh.querySelector("#ff").addEventListener("submit", async e => {
    e.preventDefault();
    const name = e.target.name.value.trim().replace(/^משפחת\s+/, ""), b = sh.querySelector("#ffSave");
    if (!name){ sh.querySelector("#ffErr").textContent = "צריך שם."; return; }
    busyBtn(b, true, "שומר…");
    try {
      if (isNew){ const nid = await Cloud.createFamily(name); FAMILIES[nid] = { name }; toast(`משפחת ${name} נוצרה ✓`); openUserEdit(null, nid); }
      else { await Cloud.renameFamily(id, name); toast("נשמר"); openAdmin(); }
    } catch(x){ sh.querySelector("#ffErr").textContent = errText(x); busyBtn(b, false, isNew ? "יצירת משפחה" : "שמירה"); }
  });
}

function openUserEdit(key, forFamily){
  const pool = CLOUD && Cloud.isSuper ? ALLUSERS : USERS;
  const family = key ? (pool[key]?.family || HOME_FAMILY) : (forFamily || (CLOUD ? Cloud.fam : HOME_FAMILY));
  const famCount = Object.values(pool).filter(x => (x.family || HOME_FAMILY) === family).length;
  const isNew = !key, u = isNew ? { name:"", color:PALETTE[famCount % PALETTE.length], role:"editor", active:true } : pool[key];
  const self = key === me, st = { color:u.color };
  const roleOpts = Object.entries(ROLES).filter(([k]) => k !== "admin" || amSuper()).map(([k,r]) => [k, r.label]);
  const famLabel = CLOUD && Cloud.isSuper && family !== HOME_FAMILY ? `<p class="note">${icon("home")} משפחת ${esc(FAMILIES[family]?.name || family)}</p>` : "";
  const sh = openSheet(`${head(isNew ? "משתמש חדש" : "עריכת משתמש")}
    ${famLabel}
    <form id="ue" class="pf-form" autocomplete="off">
      <span class="lbl">שם תצוגה</span><input class="input" name="name" value="${esc(u.name)}" maxlength="24" placeholder="למשל: תהילה">
      ${isNew ? `<span class="lbl">שם משתמש לכניסה</span><input class="input" name="username" dir="ltr" autocapitalize="none" spellcheck="false" placeholder="english letters, e.g. tehila">
        <span class="lbl">סיסמה ראשונית</span><input class="input" name="password" type="text" dir="ltr" autocomplete="new-password" placeholder="לפחות 6 תווים">
        <p class="note">המשתמש יוכל להחליף את הסיסמה בעצמו מהפרופיל.</p>`
        : `<p class="note">שם משתמש: <b dir="ltr">@${esc(key)}</b></p>`}
      <span class="lbl">הרשאה</span>
      ${self ? `<p class="note">${roleBadge(u.role, u.uid)} — אי אפשר לשנות את ההרשאה של עצמך.</p>` : `${radios("role", roleOpts, u.role || "editor")}<p class="role-desc" id="roleDesc">${esc(ROLES[u.role||"editor"].desc)}</p>`}
      <span class="lbl">צבע</span>${swatches(u.color)}
      ${amSuper() ? `<div class="adm-limit"><span>📝 פתקים על המקרר ביום</span><select class="input" name="noteLimit">${[1,2,3,4,5,10].map(n => `<option value="${n}" ${n === (+u.noteLimit || 1) ? "selected" : ""}>${n}</option>`).join("")}</select></div>` : ""}
      ${!isNew && !self ? `<label class="toggle-row"><span>משתמש פעיל<br><small class="note" style="margin:0">כבוי = לא יכול להיכנס לאפליקציה</small></span><input type="checkbox" name="active" ${u.active!==false?"checked":""}></label>` : ""}
      <p class="error" id="ueErr" role="alert"></p>
      ${!isNew && !self && pool[key]?.uid !== BOOT_ADMIN_UID ? `<button type="button" class="danger" id="ueDel" style="padding:0 0 14px">${icon("trash")}מחיקת המשתמש</button>` : ""}
      <div class="actions"><button type="button" class="secondary" id="ueBack">חזרה</button><button class="primary" type="submit" id="ueSave">${isNew ? "יצירת משתמש" : "שמירה"}</button></div>
    </form>`);
  bindSwatches(sh, st);
  sh.querySelector("#ueBack").onclick = () => openAdmin();
  sh.querySelector("#ueDel")?.addEventListener("click", async () => {
    if (!await askConfirm(`למחוק את ${u.name}?`, "המשתמש לא יוכל להיכנס יותר לאפליקציה. משימות וקניות שלו נשארות, בלי שיוך אליו.", "מחיקה")) return;
    try { await UsersAPI.remove(key); toast(`${u.name} נמחק/ה`); openAdmin(); }
    catch(x){ sh.querySelector("#ueErr").textContent = errText(x); }
  });
  sh.querySelectorAll('input[name=role]').forEach(r => r.addEventListener("change", () => { sh.querySelector("#roleDesc").textContent = ROLES[r.value].desc; }));
  sh.querySelector("#ue").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, err = sh.querySelector("#ueErr"), b = sh.querySelector("#ueSave");
    const name = f.name.value.trim(), role = self ? u.role : (f.querySelector('input[name=role]:checked')?.value || "editor");
    if (!name){ err.textContent = "צריך שם תצוגה."; return; }
    err.textContent = ""; busyBtn(b, true, isNew ? "יוצר…" : "שומר…");
    try {
      if (isNew){
        const username = f.username.value.trim().toLowerCase(), password = f.password.value;
        if (!/^[a-z][a-z0-9._-]{2,19}$/.test(username)){ throw { msg:"שם משתמש: 3–20 תווים באנגלית, מתחיל באות." }; }
        if (password.length < 6) throw { msg:"הסיסמה קצרה מדי — לפחות 6 תווים." };
        if (!amSuper() && CLOUD && FAM.maxUsers && Object.keys(USERS).length >= FAM.maxUsers) throw { msg:"הגעתם למכסת המשתמשים של המשפחה." };
        await UsersAPI.create({ username, name, password, role, color:st.color, family, noteLimit: f.noteLimit ? (+f.noteLimit.value || 1) : 1 });
        toast(`${name} נוסף/ה ✓`);
      } else {
        const patch = { name, color:st.color }; if (f.noteLimit) patch.noteLimit = +f.noteLimit.value || 1;
        if (!self){ patch.role = role; patch.active = f.active.checked; }
        await UsersAPI.update(key, patch);
        toast("נשמר");
      }
      openAdmin();
    } catch(x){ err.textContent = x.msg || errText(x); busyBtn(b, false, isNew ? "יצירת משתמש" : "שמירה"); }
  });
}

/* ================= Session ================= */
function getSession(){ try{ return localStorage.getItem("nido.user"); }catch(e){ return null; } }
function setSession(u){ try{ u?localStorage.setItem("nido.user",u):localStorage.removeItem("nido.user"); }catch(e){} }
function enter(u){ me=u; Back.init(); document.documentElement.classList.toggle("ro", !canEdit()); Sky.hide(); setAmbient(); $("#login").hidden=true; $("#app").hidden=false;
  S.calView = null; S.calSel = iso(new Date()); S.calWeek = null; S.calMonth = null;
  const want = new URLSearchParams(location.search).get("tab"); S.tab = TABS.some(t => t[0]===want) ? want : "today";
  if (want) history.replaceState(null, "", location.pathname); render(); if (CLOUD) Updates.seen();
  Notes.refreshFab(); if (!CLOUD) Notes.listen(); }
function logout(fromCloud){
  // a shared phone must stop getting this person's notifications — unregister it while we still have their sign-in
  if (CLOUD && !fromCloud && Push.on() && !logout._busy){ logout._busy = true; Push.disable().catch(() => {}).finally(() => { logout._busy = false; logout(fromCloud); }); return; }
  if (CLOUD && fromCloud && Push.on()) Push.dropLocal();     // signed out remotely (disabled/removed): stop this device without the server
  if (CLOUD){ if (!fromCloud) Cloud.signOut(); Cloud.stop(); Object.assign(DB, emptyDB()); try{ localStorage.removeItem(STORE); }catch(e){} } closeSheet(); document.documentElement.classList.remove("ro"); hideAmbient(); setSession(null); me=null; Notes.stop(); Notes.refreshFab(); $("#pass").value=""; $("#app").hidden=true; $("#login").hidden=false; showLogin(); }
function doLogin(){
  const u=$("#user").value.trim().toLowerCase(), p=$("#pass").value, err=$("#err");
  if (!u||!p){ err.textContent="יש למלא שם משתמש וסיסמה."; return; }
  if (CLOUD) return cloudLogin(u, p);
  if (!USERS[u]||USERS[u].password!==p||USERS[u].active===false){ err.textContent="שם המשתמש או הסיסמה שגויים."; return; }
  err.textContent=""; setSession(u);
  let entered = false; const go = () => { if (entered) return; entered = true; enter(u); };
  try { playSplash(go); setTimeout(go, 1500); }           // safety net: always end up in the app
  catch(_) { document.getElementById("splash")?.remove(); const b = document.querySelector("#login .brand"); if (b) b.style.visibility = ""; go(); }
}
async function cloudLogin(u, p){
  const err=$("#err"), btn=$("#loginBtn");
  err.textContent=""; btn.disabled=true; btn.textContent="מתחבר…"; Cloud.loggingIn=true;
  try {
    await Cloud.signIn(u, p);
    await Promise.race([new Promise(r => setTimeout(r, 4000)), (async () => { while (!Cloud.usersReady) await new Promise(r => setTimeout(r, 50)); await Cloud.usersReady; })()]);
    if (!Cloud.user) return;                          // access denied while loading
    u = Object.keys(USERS).find(k => USERS[k].uid === Cloud.user.uid) || u;
    setSession(u); $("#pass").value="";
    let entered = false; const go = () => { if (entered) return; entered = true; enter(u); };
    try { playSplash(go); setTimeout(go, 1500); }
    catch(_) { document.getElementById("splash")?.remove(); const b = document.querySelector("#login .brand"); if (b) b.style.visibility = ""; go(); }
  } catch(e){
    const c = String(e && e.code || "");
    err.textContent = c.includes("too-many") ? "יותר מדי ניסיונות. נסה שוב בעוד כמה דקות."
      : c.includes("network") || !navigator.onLine ? "אין חיבור לאינטרנט."
      : c ? "שם המשתמש או הסיסמה שגויים." : "לא ניתן להתחבר כרגע. נסה שוב.";
  } finally { btn.disabled=false; btn.textContent="כניסה"; Cloud.loggingIn=false; }
}
// no reliance on form submission (some previews block it): button tap + Enter key
$("#loginBtn").addEventListener("click", doLogin);
$("#loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
["#user","#pass"].forEach(s => $(s).addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); doLogin(); } }));
/* the opening animation plays only on a fresh start (app was fully closed) — coming back from the background keeps you where you were */

if (CLOUD){
  Cloud.ready = Cloud.start().catch(e => { console.error(e); toast("אין חיבור לשרת — עובדים מהזיכרון המקומי"); throw e; });
  Cloud.ready.catch(()=>{});
  if (ENV === "test"){ const b=document.createElement("div"); b.className="env-badge"; b.textContent="סביבת בדיקה"; document.body.appendChild(b); }
  if ("serviceWorker" in navigator){
    addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(()=>{}));
  }
  Updates.start();
}
const s=getSession();
if (s && USERS[s]){ enter(s); try { playSplash(null); } catch(_) { document.getElementById("splash")?.remove(); } }
else { $("#login").hidden=false; showLogin(); }
</script>
</body>
