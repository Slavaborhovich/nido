/* undo an edit a viewer made in memory: go back to the last saved state */
function revertDB(){
  if (CLOUD){
    COLS.forEach(c => { const snap = Cloud.snap[c], ord = Cloud.order[c]; if (!snap) return;
      DB[c] = [...snap.entries()].sort((a,b) => (ord.get(a[0])||0) - (ord.get(b[0])||0)).map(([,j]) => JSON.parse(j)); });
  } else { try { const d = JSON.parse(LAST_LOCAL); COLS.forEach(c => DB[c] = d[c] || []); } catch(e){} }
  closeSheet(); setTimeout(render, 0);
}
function cacheLocal(){ try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch(e){ /* cache only — the cloud has the data */ } }

/* ================= Cloud (Firebase) ================= */
/* Each item is its own document: envs/{prod|test}/{collection}/{id}.
   save() diffs the in-memory DB against what the cloud last had and writes only what changed;
   live listeners merge the other person's changes back in (keeping object identity, so open forms stay valid). */
const stable = v => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const Cloud = {
  fb:null, auth:null, db:null, user:null, snap:{}, order:{}, unsubs:[], loaded:new Set(), dirty:false, pendingRender:false, failedOnce:false,
  ready:null,
  async start(){
    const B = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [A, AU, F] = await Promise.all([import(B+"firebase-app.js"), import(B+"firebase-auth.js"), import(B+"firebase-firestore.js")]);
    this.fb = { ...AU, ...F }; this.A = A;
    const app = this.app = A.initializeApp(FIREBASE_CONFIG);
    this.auth = AU.getAuth(app);
    try { this.db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch(e){ this.db = F.getFirestore(app); }
    AU.onAuthStateChanged(this.auth, user => this.onUser(user));
  },
  fam: HOME_FAMILY, isSuper: false,
  onUser(user){
    this.user = user;
    if (!user){ this.stop(); if (me) logout(true); return; }
    this.listenUsers();
  },
  /* people: users/{uid} with a family field. The system admin sees everyone; others only their own family. */
  async listenUsers(){
    if (this.usersUnsub || this._lu) return; this._lu = true;
    this.usersReady = new Promise(r => this._usersReady = r);
    const F = this.fb, uid = this.user.uid; this.isSuper = uid === BOOT_ADMIN_UID;
    let q;
    if (this.isSuper){
      q = F.collection(this.db, "users");
      this.famUnsub = F.onSnapshot(F.collection(this.db, "families"), qs => {
        Object.keys(FAMILIES).forEach(k => delete FAMILIES[k]);
        qs.docs.forEach(d => FAMILIES[d.id] = { ...d.data(), name: d.data().name || d.id });
        refreshOpenPanels();
      }, () => {});
    } else {
      let fam = null;
      try { const d = await F.getDoc(F.doc(this.db, "users", uid)); if (d.exists()) fam = d.data().family || HOME_FAMILY; else if (!d.metadata.fromCache){ this._lu = false; return this.deny("אין לך הרשאה לאפליקציה. פנה למנהל."); } }
      catch(e){ if (String(e.code).includes("permission")){ this._lu = false; return this.deny("אין לך הרשאה לאפליקציה. פנה למנהל."); } }
      if (!fam){ try { fam = localStorage.getItem("nido.family"); } catch(e){} }
      this.fam = fam || HOME_FAMILY;
      q = F.query(F.collection(this.db, "users"), F.where("family", "==", this.fam));
      // until the admin's app tags old profiles with a family, keep our own profile in view
      this.myDocUnsub = F.onSnapshot(F.doc(this.db, "users", uid), d => { this.myDoc = d.exists() ? { uid, ...d.data() } : null; if (this._lastQs) this.applyUsers(this._lastQs); }, () => {});
    }
    this.usersUnsub = F.onSnapshot(q, qs => { this._lastQs = qs; this.applyUsers(qs); }, err => {
      console.error("[nido users]", err);
      if (String(err.code).includes("permission")){ this.deny("אין לך הרשאה לאפליקציה. פנה למנהל."); }
    });
    this._lu = false;
  },
  applyUsers(qs){
    const uid = this.user && this.user.uid; if (!uid) return;
    const list = qs.docs.map(d => ({ uid:d.id, ...d.data() }));
    if (!this.isSuper && this.myDoc && !list.some(x => x.uid === uid)) list.push(this.myDoc);
    const mine = list.find(x => x.uid === uid);
    if (!mine){
      if (qs.metadata.fromCache || (!this.isSuper && this.myDoc === undefined)) return;
      if (uid === BOOT_ADMIN_UID) return this.bootstrap();
      return this.deny("אין לך הרשאה לאפליקציה. פנה למנהל.");
    }
    if (this.isSuper && !qs.metadata.fromCache) this.tagFamilies(list);
    this.fam = mine.family || HOME_FAMILY;
    try { localStorage.setItem("nido.family", this.fam); } catch(e){}
    const toUser = x => ({ name:x.name||x.username, color:x.color||"#F2B66B", role:x.role||"editor", photo:x.photo||"", active:x.active!==false, uid:x.uid, notif:x.notif||{}, family:x.family||HOME_FAMILY, lastSeen:x.lastSeen||0, build:x.build||"", noteLimit:+x.noteLimit||1, skin:typeof x.skin === "string" ? x.skin : "", lastAct:x.lastAct||0, act:Array.isArray(x.act)?x.act:[], created:x.created||0 });
    const map = {}, all = {};
    list.forEach(x => { if (!x.username) return; all[x.username] = toUser(x); if ((x.family || HOME_FAMILY) === this.fam) map[x.username] = all[x.username]; });
    Object.keys(ALLUSERS).forEach(k => delete ALLUSERS[k]); Object.assign(ALLUSERS, all);
    setUsers(map); storeUsers();
    if (mine.active === false) return this.deny("המשתמש שלך הושבת. פנה למנהל.");
    const u = mine.username;
    this._usersReady && this._usersReady();
    if (!me && !this.loggingIn){ setSession(u); enter(u); try { playSplash(null); } catch(_){ document.getElementById("splash")?.remove(); } }
    else if (me && me !== u){ me = u; setSession(u); }
    this.listen();
    if (!this._notesOn){ this._notesOn = true; Notes.listen(); }
    this.listenFamily(); this.presence(); Announce.listen(); famAdminWelcome();
    Notes.refreshFab(); this.notesSentCheck();
    if (this._lastLimit !== meU().noteLimit){ this._lastLimit = meU().noteLimit; Notes.alreadySent().then(() => Notes.refreshFab()); }
    Push.refresh();
    if (this.isSuper) PushPolicy.auto();
    document.documentElement.classList.toggle("ro", !canEdit());
    refreshOpenPanels(); softRender();
  },
  /* this family's settings (city, features) */
  listenFamily(){
    if (this.famDocUnsub && this._famFor === this.fam) return;
    if (this.famDocUnsub){ try { this.famDocUnsub(); } catch(e){} }
    this._famFor = this.fam;
    this.famDocUnsub = this.fb.onSnapshot(this.fb.doc(this.db, "families", this.fam), d => {
      const x = d.exists() ? d.data() : {};
      const before = JSON.stringify(FAM);
      FAM = { city: x.city || "293397", features: x.features || {}, maxUsers: +x.maxUsers || 0, maxPhotos: +x.maxPhotos || 0, together: x.together || "" };
      if (JSON.stringify(FAM) !== before){ Notes.refreshFab(); Notes.alreadySent().then(() => Notes.refreshFab()); if (Hol.data && Hol.data.city !== FAM.city) Hol.data = null; softRender(); }
    }, () => {});
  },
  /* "last seen" + version for the admin overview — at most every 30 minutes */
  presence(){
    const u = this.user; if (!u) return;
    // which days this person opened the app (last 30) — for the admin's activity view
    const today = iso(new Date()), dk = "nido.actDay." + u.uid, mine = Object.values(ALLUSERS).find(x => x.uid === u.uid);
    let dl = ""; try { dl = localStorage.getItem(dk) || ""; } catch(e){}
    if (mine && dl !== today && !mine.act.includes(today)){
      try { localStorage.setItem(dk, today); } catch(e){}
      const from = iso(new Date(Date.now() - 30 * 864e5));
      this.fb.updateDoc(this.fb.doc(this.db, "users", u.uid), { act: [...mine.act.filter(d => d > from), today], lastSeen: Date.now(), build: BUILD }).catch(() => {});
      try { localStorage.setItem("nido.seenAt." + u.uid, Date.now()); } catch(e){}
      return;
    }
    const k = "nido.seenAt." + u.uid; let last = 0; try { last = +localStorage.getItem(k) || 0; } catch(e){}
    if (Date.now() - last < 30 * 60e3) return;
    try { localStorage.setItem(k, Date.now()); } catch(e){}
    this.fb.updateDoc(this.fb.doc(this.db, "users", u.uid), { lastSeen: Date.now(), build: BUILD }).catch(() => {});
  },
  async notesSentCheck(){ if (this._nsc === Notes.today()) return; this._nsc = Notes.today(); await Notes.alreadySent(); Notes.refreshFab(); },
  deny(msg){ this.user = null; this.signOut(); this.stop(); if (me) logout(true); $("#err") && ($("#err").textContent = msg); toast(msg); },
  /* one-time: profiles made before families existed belong to the first family */
  tagFamilies(list){
    if (this._tagged) return; this._tagged = true;
    const F = this.fb, b = F.writeBatch(this.db); let n = 0;
    list.filter(x => !x.family).forEach(x => { b.update(F.doc(this.db, "users", x.uid), { family: HOME_FAMILY }); n++; });
    if (!FAMILIES[HOME_FAMILY]){ b.set(F.doc(this.db, "families", HOME_FAMILY), { name:"בורחוביץ'", created:Date.now() }, { merge:true }); n++; }
    if (n) b.commit().catch(e => console.warn("[families]", e));
  },
  async createFamily(name){
    const id = "f" + Math.random().toString(36).slice(2, 8);
    await this.fb.setDoc(this.fb.doc(this.db, "families", id), { name, created:Date.now() });
    return id;
  },
  async renameFamily(id, name){ await this.fb.setDoc(this.fb.doc(this.db, "families", id), { name }, { merge:true }); },
  async saveFamily(id, patch){ await this.fb.setDoc(this.fb.doc(this.db, "families", id), patch, { merge:true }); },
  /* system admin: may this family receive push notifications? (the database rules allow this write only to him) */
  async setFamilyPush(id, on){
    await this.saveFamily(id, { push: on === true, pushAt: Date.now(), pushBy: this.user.uid });   // throws if not saved
    return PushPolicy.sync(id, on ? {} : { off: true }, on && FAMILIES[id]?.active !== false);
  },
  /* disabling a family = disabling all its people (the database rules already block inactive users) */
  async setFamilyActive(id, on){
    const F = this.fb, b = F.writeBatch(this.db);
    Object.values(ALLUSERS).filter(u => u.family === id && u.uid !== BOOT_ADMIN_UID).forEach(u => b.update(F.doc(this.db, "users", u.uid), { active: on }));
    b.set(F.doc(this.db, "families", id), { active: on }, { merge:true });
    await b.commit();
    return PushPolicy.sync(id, on ? {} : { frozen: true }, on && FAMILIES[id]?.push === true);
  },
  /* system admin: remove a whole family — its people, content, notes, settings and counters */
  async deleteFamily(fid){
    if (!fid || fid === HOME_FAMILY) throw { code:"missing" };
    const F = this.fb, refs = [];
    const all = async (...path) => { try { (await F.getDocs(F.collection(this.db, ...path))).docs.forEach(d => refs.push(d.ref)); } catch(e){ console.warn("[delete family]", path.join("/"), e); throw e; } };
    for (const env of ["prod", "test"]) for (const c of [...COLS, "photos"]) await all("families", fid, "envs", env, c);
    await all("families", fid, "notes"); await all("families", fid, "meta");
    Object.entries(ALLUSERS).filter(([, u]) => u.family === fid && u.uid !== BOOT_ADMIN_UID).forEach(([k, u]) => { refs.push(F.doc(this.db, "users", u.uid)); refs.push(F.doc(this.db, "logins", k)); });
    Announce.list.filter(a => a.target === fid).forEach(a => refs.push(F.doc(this.db, "announcements", a.id)));
    refs.push(F.doc(this.db, "stats", fid));
    for (let i = 0; i < refs.length; i += 400){ const b = F.writeBatch(this.db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
    await F.deleteDoc(F.doc(this.db, "families", fid));
    PushPolicy.sync(fid, {}, false);                                // the push server drops the family's devices and reminders (retried if it fails)
    return refs.length;
  },
  async bootstrap(){
    const F = this.fb, uid = this.user.uid, b = F.writeBatch(this.db);
    b.set(F.doc(this.db, "users", uid), { username:"slava", name:"סלבה", color:"#7FB0FF", role:"admin", active:true, photo:"", family:HOME_FAMILY, created:Date.now() });
    b.set(F.doc(this.db, "logins", "slava"), { email:this.user.email, uid });
    await b.commit().catch(e => this.fail(e));
  },
  async emailFor(u){
    await this.ready;
    try { const d = await this.fb.getDoc(this.fb.doc(this.db, "logins", u)); if (d.exists()) return d.data().email; } catch(e){}
    return emailOf(u);
  },
  async signIn(u, p){
    await this.ready;
    const email = u.includes("@") ? u : await this.emailFor(u);
    return this.fb.signInWithEmailAndPassword(this.auth, email, p);
  },
  /* admin: create a new person. A second Firebase app makes the account so the admin stays signed in. */
  async createUser({ username, name, password, role, color, family, noteLimit }){
    const F = this.fb;
    if ((await F.getDoc(F.doc(this.db, "logins", username))).exists()) throw { code:"taken" };
    const sec = this.secApp || (this.secApp = this.A.initializeApp(FIREBASE_CONFIG, "creator"));
    const sa = F.getAuth(sec); await F.setPersistence(sa, F.inMemoryPersistence);
    let email = `${username}@${EMAIL_DOMAIN}`, cred;
    try { cred = await F.createUserWithEmailAndPassword(sa, email, password); }
    catch(e){
      if (!String(e.code).includes("email-already-in-use")) throw e;
      email = `${username}.${Date.now().toString(36)}@${EMAIL_DOMAIN}`;      // name was used by a deleted user
      cred = await F.createUserWithEmailAndPassword(sa, email, password);
    }
    const uid = cred.user.uid; await F.signOut(sa);
    const b = F.writeBatch(this.db);
    b.set(F.doc(this.db, "users", uid), { username, name, color, role, active:true, photo:"", family: family || this.fam, noteLimit: noteLimit || 1, created:Date.now() });
    b.set(F.doc(this.db, "logins", username), { email, uid });
    await b.commit();
  },
  async updateUser(username, patch){
    const u = ALLUSERS[username] || USERS[username]; if (!u || !u.uid) throw { code:"missing" };
    await this.fb.updateDoc(this.fb.doc(this.db, "users", u.uid), patch);
    if ("active" in patch || "role" in patch || "family" in patch) pushRoster(u.family);
  },
  async deleteUser(username){
    const u = ALLUSERS[username] || USERS[username]; if (!u || !u.uid) throw { code:"missing" };
    const F = this.fb, b = F.writeBatch(this.db);
    b.delete(F.doc(this.db, "users", u.uid)); b.delete(F.doc(this.db, "logins", username));
    await b.commit();
    pushRoster(u.family);
  },
  async changePassword(current, next){
    const F = this.fb, user = this.auth.currentUser;
    await F.reauthenticateWithCredential(user, F.EmailAuthProvider.credential(user.email, current));
    await F.updatePassword(user, next);
  },
  signOut(){ try { this.fb && this.fb.signOut(this.auth); } catch(e){} },
  ref(c, id){ return this.fb.doc(this.db, "families", this.fam, "envs", ENV, c, id); },
  async listen(){
    if (this.unsubs.length || this._listening) return;

          this.send(this.others("done"), "shop", { title:"🛍️ יוצאים לקניות", body:`${who} לוקח/ת ${n === 1 ? "פריט אחד" : n + " פריטים"}`, tag: this.tagOf("take-" + after.id) });
          continue;
        }
        let skip = null;
        if (c === "tasks" && after.assignee && after.assignee !== me && USERS[after.assignee]){
          skip = after.assignee;
          if (this.wants(skip, "assigned")) this.later([skip], "assigned", label);
        }
        const type = this.TYPE[c] || "task";
        const lab = c === "events" && after.date ? `${label} (${dayLabel(after.date)}${after.time ? " " + after.time : ""})`
                  : c === "shop" && after.qty ? `${label} ×${after.qty}` : label;
        this.later(this.others("added").filter(k => k !== skip), type, lab);
        continue;
      }
      if (c === "tasks"){
        if (after.assignee && after.assignee !== before.assignee && after.assignee !== me && USERS[after.assignee] && this.wants(after.assignee, "assigned"))
          this.send([after.assignee], "task", { title:"📋 משימה בשבילך", body:`${label} · מ${who}`, tag: this.tagOf("a-" + after.id) });
        if (after.done && !before.done){
          const shop = after.kind === "shop";
          this.send(this.others("done"), shop ? "shop" : "task", shop
            ? { title:"✅ הקניות הושלמו", body:`${who} סיים/ה את הקניות`, tag: this.tagOf("d-" + after.id) }
            : { title:"✅ משימה הושלמה", body:`${who}: ${label}`, tag: this.tagOf("d-" + after.id) });
        }
      }
      if (c === "ideas" && Array.isArray(after.likes) && after.likes.includes(me) && !(before.likes || []).includes(me))
        this.send(this.others("added"), "idea", { title:`❤️ גם ל${who} בא`, body: label, tag: this.tagOf("like-" + after.id) });
      if (c === "survey" && after.chosen && after.chosen !== before.chosen){
        const o = (after.offers || []).find(x => x.id === after.chosen);
        this.send(this.others("done"), "shop", { title:`🏷️ נבחר: ${label}`, body: o ? `${o.store} · ${ils(o.price)} · נוצרה משימה` : "נוצרה משימה", tag: this.tagOf("ch-" + after.id) });
      }
    }
  },
  /* the whole reminder plan for the next 7 days, sent to the server whenever it changes */
  schedule(){
    if (!CLOUD || !PUSH_READY || !me || !Cloud.user) return;
    if (!this._started){ this._started = true; this.token(); this.arm(); }                  // leftovers from last time
    clearTimeout(this._t); this._t = setTimeout(() => this._schedule(), 2500);
  },
  _schedule(){
    const now = Date.now(), until = now + 7*864e5, jobs = [];
    const at = (d, t) => { const [h, m] = (t || "08:00").split(":").map(Number); const x = parse(d); x.setHours(h, m, 0, 0); return x.getTime(); };
    const remind = people().filter(k => USERS[k].uid && this.wants(k, "remind"));
    const uidsOf = ks => ks.map(k => USERS[k].uid);
    const add = (t, ks, kind, title, body, tag) => { if (t > now && t < until && ks.length) jobs.push({ at:t, uids: uidsOf(ks), kind, title, body, tag: this.tagOf(tag) }); };
    const dmy = d => { const x = parse(d); return `${x.getDate()}.${x.getMonth() + 1}`; };
    for (const e of DB.events) if (e.date){
      const place = e.place ? " · " + e.place : "";
      // 24 hours before the start (all-day events: the day before at 09:00)
      add(e.time ? at(e.date, e.time) - 864e5 : at(e.date, "09:00") - 864e5, remind, "remind", `📅 מחר: ${e.title}`, `${e.time || "כל היום"}${place}`, `e1-${e.id}`);
      if (e.time) add(at(e.date, e.time) - 60*60e3, remind, "remind", `⏰ בעוד שעה: ${e.title}`, `${e.time}${place}`, `eh-${e.id}`);
    }
    for (const k of DB.tasks) if (!k.done && k.date){
      const to = k.assignee && USERS[k.assignee] ? remind.filter(x => x === k.assignee) : remind;
      // a week before the due date (a task opened with less than a week left gets none — "משימה חדשה" already told)
      add(at(k.date, k.time || "09:00") - 7*864e5, to, "remind", `🗓️ בעוד שבוע: ${k.title}`, `תאריך יעד: ${dmy(k.date)}${k.time ? " " + k.time : ""}`, `kw-${k.id}`);
      if (k.time) add(at(k.date, k.time) - 60*60e3, to, "remind", `⏰ תזכורת: ${k.title}`, `בעוד שעה · ${k.time}`, `kh-${k.id}`);
    }
    for (let i = 0; i < 7; i++){
      const day = iso(addDays(new Date(), i)), t = at(day, "08:00");
      if (t <= now) continue;
      for (const u of remind){
        const items = [
          ...DB.events.filter(e => e.date === day).sort((a,b) => (a.time||"").localeCompare(b.time||"")).map(e => (e.time ? e.time + " " : "") + e.title),
          ...DB.tasks.filter(k => !k.done && k.date === day && (!k.assignee || k.assignee === u)).map(k => (k.time ? k.time + " " : "") + k.title),
        ];
        if (!items.length) continue;
        add(t, [u], "digest", `☀️ בוקר טוב ${USERS[u].name} · ${items.length === 1 ? "דבר אחד היום" : items.length + " דברים היום"}`,
          items.slice(0, 4).join(" · ") + (items.length > 4 ? " …" : ""), "digest");
      }
    }
    if (!canEdit()) return;                                                                   // viewers can't change the family's plan
    jobs.sort((a, b) => a.at - b.at || a.kind.localeCompare(b.kind) || a.uids.join().localeCompare(b.uids.join()) || a.title.localeCompare(b.title));
    jobs.splice(120);                                                                         // the server's limit: the nearest 120
    const sig = JSON.stringify(jobs), key = "nido.jobs." + ENV;
    try { if (localStorage.getItem(key) === sig) return; } catch(e){}
    if (Push.familyOff()) return;
    pushApi("/jobs", { jobs }).then(() => { try { localStorage.setItem(key, sig); } catch(e){} }).catch(e => console.warn("[jobs]", e && e.code));
  },
};

/* ================= "New version" popup ================= */
/* Each deploy stamps BUILD into this file and writes version.json next to it with the release notes. */
const BUILD = "__BUILD__";
const Updates = {
  shown: null, hadSession: (() => { try { return !!localStorage.getItem("nido.user"); } catch(e){ return false; } })(),
  start(){
    if (BUILD.startsWith("__")) return;                       // local copy — nothing to compare
    const check = () => this.check();
    setTimeout(check, 4000);
    setInterval(check, 5 * 60e3);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(check, 1200); });
  },
  /* first time this device runs a new version (after login): tell what changed */
  /* every update message the family hasn't seen yet (updates.json keeps the history) — none get missed */
  async seen(){
    if (BUILD.startsWith("__") || this._seenDone) return; this._seenDone = true;
    let last = null, seen = null;
    try { last = localStorage.getItem("nido.seenBuild"); localStorage.setItem("nido.seenBuild", BUILD); seen = JSON.parse(localStorage.getItem("nido.seenNotes") || "null"); } catch(e){ return; }
    let hist = [];
    try { const r = await fetch("updates.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) hist = await r.json(); } catch(e){ return; }
    if (!Array.isArray(hist) || !hist.length) return;
    if (!seen){
      // first time with this feature: a brand-new device has seen everything; others saw what their last version showed
      seen = (!last && !this.hadSession) ? hist.map(h => h.id) : hist.filter(h => (h.seenIn || []).includes(last)).map(h => h.id);
      this.markSeen(seen);
    }
    const todo = hist.filter(h => !seen.includes(h.id)).slice(0, 3);
    if (!todo.length) return;
    const wait = () => (!me || uiBusy() || document.getElementById("splash")) ? setTimeout(wait, 1200) : this.showMany(todo, () => this.markSeen([...seen, ...hist.map(h => h.id)]));
    setTimeout(wait, 600);
  },
  markSeen(ids){ try { localStorage.setItem("nido.seenNotes", JSON.stringify([...new Set(ids)].slice(-50))); } catch(e){} },
  /* one message → the usual window; several → one at a time, "עדכון 1 מתוך 2", newest first */
  showMany(list, done){
    if (document.querySelector(".upd-scrim")) return;
    if (list.length === 1){ this.showDone(list[0].text, done); return; }
    let k = 0;
    const w = document.createElement("div"); w.className = "cfm-scrim upd-scrim";
    const when = d => { const t = iso(new Date()), y = iso(addDays(new Date(), -1)); if (d === t) return "היום"; if (d === y) return "אתמול"; const x = parse(d); return `${x.getDate()}.${x.getMonth() + 1}`; };
    const draw = () => {
      const r = this.parse(list[k].text), last = k === list.length - 1;
      w.innerHTML = `<div class="cfm upd mu" role="dialog" aria-modal="true" aria-labelledby="updT">
        <div class="pg"><span>עדכון ${k + 1} מתוך ${list.length}</span><span>${esc(when(list[k].date))}</span></div>
        <div class="ic upd-ic">✨</div>
        <h3 id="updT">${esc(r.title || "Nido עודכן")}</h3>
        ${r.html}
        <div class="dots">${list.map((_, j) => `<i class="${j === k ? "on" : ""}"></i>`).join("")}</div>
        <div class="row2">${last ? `<button type="button" class="pri go">מעולה</button>` : `<button type="button" class="sec2 skip">דלג</button><button type="button" class="pri nx">לעדכון הבא ←</button>`}</div></div>`;
    };
    draw(); document.body.appendChild(w); requestAnimationFrame(() => w.classList.add("show"));
    const close = () => { w.classList.remove("show"); setTimeout(() => w.remove(), 200); done && done(); };
    w.onclick = e => {
      if (e.target.closest(".nx")){ k++; draw(); return; }
      if (e.target.closest(".skip") || e.target.closest(".go")) return close();
    };
  },
  notesList(t){ return String(t || "").split("\n").map(x => x.replace(/^[•\-\*]\s*/, "").trim()).filter(Boolean).slice(0, 6); },
  /* whatsnew.txt: an optional first line "# title", then lines — "• …" become bullets, anything else a paragraph */
  parse(t){
    const lines = String(t || "").split("\n").map(x => x.trim()).filter(Boolean);
    let title = ""; if (lines[0] && lines[0].startsWith("#")) title = lines.shift().replace(/^#+\s*/, "");
    // keeps the order: paragraphs, "label:" lines, • bullets (grouped), and a "> " closing line
    let html = "", ul = [];
    const flush = () => { if (ul.length){ html += `<ul class="upd-notes">${ul.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`; ul = []; } };
    lines.forEach(x => {
      if (/^[•\-\*]/.test(x)){ ul.push(x.replace(/^[•\-\*]\s*/, "")); return; }
      flush();
      if (x.startsWith(">")) html += `<p class="upd-sig">${esc(x.replace(/^>\s*/, ""))}</p>`;
      else if (/:$/.test(x)) html += `<p class="upd-lbl">${esc(x)}</p>`;
      else html += `<p class="upd-p">${esc(x)}</p>`;
    });
    flush();
    return { title, html };
  },
  showDone(text, done){
    if (document.querySelector(".upd-scrim")) return;
    const r = this.parse(text);
    const w = document.createElement("div"); w.className = "cfm-scrim upd-scrim";
    w.innerHTML = `<div class="cfm upd" role="dialog" aria-modal="true" aria-labelledby="updT">
      <div class="ic upd-ic">✨</div>
      <h3 id="updT">${esc(r.title || "Nido עודכן")}</h3>
      ${r.html || `<p>האפליקציה עודכנה לגרסה החדשה.</p>`}
      <div class="row"><button type="button" class="go">מעולה</button></div></div>`;
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add("show"));
    const close = () => { w.classList.remove("show"); setTimeout(() => w.remove(), 200); done && done(); };
    w.querySelector(".go").onclick = close; w.onclick = e => { if (e.target === w) close(); };
  },
  async check(){
    if (!navigator.onLine || this.shown) return;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
      const v = await r.json();
      if (!v.build || v.build === BUILD) return;
      if (v.silent || /^#\s*silent/i.test(String(v.notes || "").trim())) return;   // quiet release: picked up on the next open, no popup
      const wait = () => (uiBusy() || document.getElementById("splash")) ? setTimeout(wait, 2000) : this.show(v);
      wait();
    } catch(e){}
  },
  show(v){
    if (this.shown || document.querySelector(".upd-scrim")) return; this.shown = v.build;
    const r = this.parse(v.notes);
    const w = document.createElement("div"); w.className = "cfm-scrim upd-scrim";
    w.innerHTML = `<div class="cfm upd" role="alertdialog" aria-modal="true" aria-labelledby="updT">
      <div class="ic upd-ic">${icon("repeat")}</div>
      <h3 id="updT">יש גרסה חדשה של Nido</h3>
      <p>רענון לוקח שנייה, ושום דבר לא הולך לאיבוד.</p>
      ${r.title ? `<p class="upd-p" style="font-weight:600;color:var(--text)">${esc(r.title)}</p>` : ""}${r.html}
      <div class="row"><button type="button" class="no">אחר כך</button><button type="button" class="go">${icon("repeat")}רענן</button></div></div>`;
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add("show"));
    const close = () => { w.classList.remove("show"); setTimeout(() => w.remove(), 200); };
    w.querySelector(".no").onclick = () => { close(); setTimeout(() => { this.shown = null; }, 30 * 60e3); };   // ask again in half an hour
    w.querySelector(".go").onclick = async () => {
      const b = w.querySelector(".go"); b.disabled = true; b.textContent = "מעדכן…";
      try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch(e){}
      location.reload();
    };
  },
};

/* ================= פתק על המקרר ================= */
/* One little note per person per day. No inbox, no history: it pops up for the recipient until they say "קיבלתי". */
const NOTE_COLORS = { yellow:"#FBE7A6", pink:"#F9CFD3", blue:"#CFE3F7", green:"#D5EBC5", white:"#FBF6EC" };
const Notes = {
  queue: [], showing: false, sentKey: () => `nido.noteCount.${ENV}.${me}`,
  limit(){ return Math.max(1, +(meU().noteLimit) || 1); },
  count(){ try { const c = JSON.parse(localStorage.getItem(this.sentKey())); return c && c.day === this.today() ? c.n : 0; } catch(e){ return 0; } },
  setCount(n){ try { localStorage.setItem(this.sentKey(), JSON.stringify({ day: this.today(), n })); } catch(e){} this.refreshFab(); },
  left(){ return Math.max(0, this.limit() - this.count()); },
  today: () => iso(new Date()),
  sentToday(){ return this.left() <= 0; },
  others(){ return people().filter(k => k !== me); },
  refreshFab(){
    const f = $("#noteFab"); if (!f) return;
    const show = !!me && !$("#app").hidden && feat("notes") && !this.sentToday() && this.others().length > 0;
    f.hidden = !show;
  },
  /* ---- storage: Firestore in the cloud app, localStorage in the demo ---- */
  /* note #1 of the day keeps the original id; #2, #3… get a suffix — so the daily limit lives in the database too */
  docId(seq){ const base = `${ENV}_${this.today()}_${CLOUD ? Cloud.user.uid : me}`; return seq > 1 ? `${base}_${seq}` : base; },
  async alreadySent(){
    if (this.sentToday()) return true;
    if (!CLOUD || !Cloud.user) return false;
    let n = this.count();
    try {
      while (n < this.limit()){
        const d = await Cloud.fb.getDoc(Cloud.fb.doc(Cloud.db, "families", Cloud.fam, "notes", this.docId(n + 1)));
        if (!d.exists()) break; n++;
      }
    } catch(e){}
    if (n !== this.count()) this.setCount(n);
    return n >= this.limit();
  },
  markSent(){ this.setCount(this.count() + 1); },
  async send(toKeys, text, color){
    const note = { env: ENV, day: this.today(), text, color, at: Date.now(), fromName: meU().name, readBy: {} };
    if (CLOUD){
      const F = Cloud.fb;
      const seq = this.count() + 1;
      await F.setDoc(F.doc(Cloud.db, "families", Cloud.fam, "notes", this.docId(seq)), { ...note, seq, from: Cloud.user.uid, to: toKeys.map(k => USERS[k].uid).filter(Boolean) });
    } else {
      const all = JSON.parse(localStorage.getItem("nido.notes") || "[]");
      all.push({ ...note, id: this.docId(this.count() + 1), from: me, to: toKeys });
      localStorage.setItem("nido.notes", JSON.stringify(all));
    }
    this.markSent(); Stats.record({ notes: 1 }, 1);
    if (CLOUD) Notify.send(toKeys, "note");                     // generic "פתק חדש על המקרר" — the note itself stays in the app
  },
  async ack(n){
    if (CLOUD){
      const F = Cloud.fb;
      try { await F.updateDoc(F.doc(Cloud.db, "families", Cloud.fam, "notes", n.id), { [`readBy.${Cloud.user.uid}`]: Date.now() }); } catch(e){ console.warn("[note]", e); }
    } else {
      const all = JSON.parse(localStorage.getItem("nido.notes") || "[]");
      const x = all.find(y => y.id === n.id); if (x){ x.readBy = x.readBy || {}; x.readBy[me] = Date.now(); }
      localStorage.setItem("nido.notes", JSON.stringify(all));
    }
  },
  /* ---- incoming ---- */
  listen(){
    this.stop();
    if (CLOUD){
      if (!Cloud.user) return;
      const F = Cloud.fb, uid = Cloud.user.uid;
      const q = F.query(F.collection(Cloud.db, "families", Cloud.fam, "notes"), F.where("to", "array-contains", uid));
      this.unsub = F.onSnapshot(q, qs => {
        const fresh = qs.docs.map(d => ({ id: d.id, ...d.data() })).filter(n => n.env === ENV && !(n.readBy && n.readBy[uid]));
        this.offer(fresh);
      }, e => console.warn("[notes]", e));
    } else {
      const all = JSON.parse(localStorage.getItem("nido.notes") || "[]");
      this.offer(all.filter(n => n.to.includes(me) && !(n.readBy && n.readBy[me])));
    }
  },
  stop(){ if (this.unsub){ try { this.unsub(); } catch(e){} this.unsub = null; } this.queue = []; },
  offer(list){
    list.sort((a, b) => a.at - b.at);
    for (const n of list) if (!this.queue.some(q => q.id === n.id) && this.current !== n.id) this.queue.push(n);
    this.next();
  },
  next(){
    if (this.showing || !this.queue.length) return;
    if (!me || $("#app").hidden || document.getElementById("splash") || $("#sheetRoot").innerHTML || document.querySelector(".cfm-scrim,.note-scrim") ||
        (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))){ clearTimeout(this._t); this._t = setTimeout(() => this.next(), 1500); return; }
    this.reveal(this.queue.shift());
  },
  reveal(n){
    this.showing = true; this.current = n.id;
    const from = n.fromName || (Object.values(USERS).find(u => u.uid === n.from) || {}).name || "מישהו";
    const when = new Date(n.at), day = iso(when) === this.today() ? `היום ב־${pad(when.getHours())}:${pad(when.getMinutes())}` : dayLabel(iso(when));
    const w = document.createElement("div"); w.className = "note-scrim";
    w.innerHTML = `<div class="fnote ${esc(n.color || "yellow")}" role="dialog" aria-modal="true" aria-label="פתק מ${esc(from)}">
      <div class="note-hint">מישהו השאיר לך משהו קטן ❤️</div>
      <span class="magnet"></span>
      <p class="to">${esc(day)}</p>
      <p class="txt"></p>
      <p class="sig">— ${esc(from)}</p>
      <div class="acts"><button type="button" class="ok">קיבלתי ❤️</button></div>
      <button type="button" class="later">אחר כך</button></div>`;
    w.querySelector(".txt").textContent = n.text;
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add("show"));
    const close = () => { w.classList.remove("show"); setTimeout(() => { w.remove(); this.showing = false; this.current = null; setTimeout(() => this.next(), 600); }, 320); };
    w.querySelector(".ok").onclick = () => { this.ack(n); close(); };
    w.querySelector(".later").onclick = () => close();            // stays unread — shows again next time the app opens
  },
  /* ---- composing ---- */
  async compose(){
    if (await this.alreadySent()){ toast(this.limit() > 1 ? "השארת היום את כל הפתקים. מחר אפשר שוב ❤️" : "כבר השארת פתק היום. מחר אפשר שוב ❤️"); return; }
    const others = this.others(); if (!others.length) return;
    const st = { to: others.length === 1 ? [others[0]] : [], color: "yellow" };
    const w = document.createElement("div"); w.className = "note-scrim";
    const whom = () => `<span>ל־</span>${others.length > 1 ? `<button type="button" data-all class="${st.to.length === others.length ? "on" : ""}">כולם</button>` : ""}${others.map(k => `<button type="button" data-k="${esc(k)}" class="${st.to.includes(k) ? "on" : ""}">${esc(USERS[k].name)}</button>`).join("")}`;
    w.innerHTML = `<div class="fnote yellow" role="dialog" aria-modal="true" aria-label="פתק על המקרר">
      <span class="magnet"></span>
      <div class="whom">${whom()}</div>
      <textarea maxlength="160" placeholder="משהו קטן…" aria-label="הפתק"></textarea>
      <div class="papers"><div class="cs">${Object.entries(NOTE_COLORS).map(([k, c]) => `<button type="button" data-c="${k}" class="${k === "yellow" ? "on" : ""}" style="background:${c}" aria-label="צבע פתק"></button>`).join("")}</div><small>${this.limit() > 1 ? (this.left() === 1 ? "הפתק האחרון להיום" : `עוד ${this.left()} פתקים היום`) : "פתק אחד ביום"}</small></div>
      <div class="send"><button type="button" class="x">ביטול</button><button type="button" class="ok">להדביק על המקרר 🧲</button></div></div>`;

/* the button can be dragged anywhere; a tap opens the note. It snaps to the nearest side and remembers its spot. */
(() => {
  const fab = document.getElementById("noteFab"), KEY = "nido.noteFabPos";
  const place = (x, y) => {
    const w = fab.offsetWidth || 52, h = fab.offsetHeight || 52, m = 10;
    x = Math.min(Math.max(m, x), innerWidth - w - m); y = Math.min(Math.max(m + 30, y), innerHeight - h - m);
    fab.style.left = x + "px"; fab.style.top = y + "px"; fab.style.right = "auto"; fab.style.bottom = "auto";
  };
  const restore = () => { try { const p = JSON.parse(localStorage.getItem(KEY)); if (p) place(p.side === "l" ? 0 : innerWidth, p.y * innerHeight); } catch(e){} };
  restore(); addEventListener("resize", restore);
  let start = null, moved = false;
  fab.addEventListener("pointerdown", e => {
    const r = fab.getBoundingClientRect(); start = { x: e.clientX, y: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top }; moved = false;
    fab.setPointerCapture(e.pointerId);
  });
  fab.addEventListener("pointermove", e => {
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
    moved = true; fab.classList.add("dragging"); place(e.clientX - start.ox, e.clientY - start.oy);
  });
  const end = e => {
    if (!start) return; start = null;
    if (!moved){ Notes.compose(); return; }
    fab.classList.remove("dragging");
    const r = fab.getBoundingClientRect(), left = r.left + r.width / 2 < innerWidth / 2;
    fab.classList.add("snap"); place(left ? 0 : innerWidth, r.top); setTimeout(() => fab.classList.remove("snap"), 260);
    try { localStorage.setItem(KEY, JSON.stringify({ side: left ? "l" : "r", y: r.top / innerHeight })); } catch(x){}
  };
  fab.addEventListener("pointerup", end);
  fab.addEventListener("pointercancel", () => { start = null; fab.classList.remove("dragging"); });
  fab.addEventListener("click", e => e.preventDefault());
})();

/* ================= usage counters (for the system admin) =================
   Only numbers and dates: how many things were added / changed per type and per day, and how big the family's data is.
   Never what's written in them. Sent in small bundles so it barely costs anything. */
const Stats = {
  pend:null, t:null,
  on(){ return CLOUD && ENV === "prod" && !!(Cloud.user && Cloud.fb && Cloud.fam); },
  record(adds, acts){
    if (!this.on() || !acts) return;
    const p = this.pend || (this.pend = { adds:{}, acts:0, errs:0 });
    Object.keys(adds).forEach(c => p.adds[c] = (p.adds[c] || 0) + adds[c]); p.acts += acts;
    clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 40e3);
  },
  /* a database error happened — only the count per day, never the message */
  error(){
    if (!this.on()) return;
    const p = this.pend || (this.pend = { adds:{}, acts:0, errs:0 });
    p.errs++;
    if (!this.t) this.t = setTimeout(() => this.flush(), 40e3);
  },
  /* once everything is loaded: refresh the size numbers, at most twice a day */
  loaded(){
    if (!this.on()) return;
    const k = "nido.sized." + Cloud.fam; let last = 0; try { last = +localStorage.getItem(k) || 0; } catch(e){}
    if (Date.now() - last > 12 * 36e5) setTimeout(() => this.flush(true), 4000);
  },
  async flush(sizeOnly){
    clearTimeout(this.t); this.t = null;
    if (!this.on()) return;
    const p = sizeOnly ? null : this.pend; if (!sizeOnly) this.pend = null;
    if (!p && !sizeOnly) return;
    const F = Cloud.fb, now = Date.now(), fam = Cloud.fam, items = {}, bytes = {};
    COLS.forEach(c => { const a = DB[c] || []; items[c] = a.length; bytes[c] = JSON.stringify(a).length; });
    bytes.photos = (DB.ideas || []).reduce((a, i) => a + (+i.photoBytes || 0), 0);
    const data = { items, bytes, sizedAt: now };
    if (p && p.errs) data.errs = { [iso(new Date())]: F.increment(p.errs) };
    if (p && p.acts){
      data.lastAct = now; data.days = { [iso(new Date())]: F.increment(p.acts) };
      data.adds = {}; data.last = {};
      Object.keys(p.adds).forEach(c => { data.adds[c] = F.increment(p.adds[c]); data.last[c] = now; });
    }
    try {
      await F.setDoc(F.doc(Cloud.db, "stats", fam), data, { merge:true });
      try { localStorage.setItem("nido.sized." + fam, now); } catch(e){}
      if (p && p.acts) F.updateDoc(F.doc(Cloud.db, "users", Cloud.user.uid), { lastAct: now }).catch(() => {});
    } catch(e){
      console.warn("[stats]", e);
      if (p && !this.pend) this.pend = p;      // try again with the next change
    }
  },
};
document.addEventListener("visibilitychange", () => { if (document.hidden && Stats.pend) Stats.flush(); });

/* ================= מסך ניהול (system admin only) ================= */
const ago = t => { if (!t) return "עוד לא נכנס/ה"; const m = Math.round((Date.now() - t) / 60e3);
  return m < 2 ? "עכשיו" : m < 60 ? `לפני ${m} דק׳` : m < 1440 ? `לפני ${Math.round(m / 60)} שע׳` : m < 2880 ? "אתמול" : `לפני ${Math.round(m / 1440)} ימים`; };
const famName = id => id === HOME_FAMILY ? "המשפחה שלנו" : "משפחת " + (FAMILIES[id]?.name || id);
const DAYMS = 864e5;
const lastUse = u => Math.max(u.lastSeen || 0, u.lastAct || 0);
const health = t => !t ? "never" : Date.now() - t <= 3 * DAYMS ? "on" : Date.now() - t <= 14 * DAYMS ? "mid" : "off";
const HEALTH = { on:"פעיל", mid:"דועך", off:"רדום", never:"לא התחיל" };
const STAT_TYPES = [["tasks","משימות"],["events","אירועים ביומן"],["shop","פריטי קניות"],["ideas","רעיונות"],["notes","פתקים"],["coupons","קופונים"],["survey","סקרים"]];
const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(b < 10240 ? 1 : 0)} KB` : `${(b / 1048576).toFixed(1)} MB`;
const dateHe = t => t ? new Date(t).toLocaleDateString("he-IL", { day:"numeric", month:"numeric", year:"2-digit" }) + " " + new Date(t).toLocaleTimeString("he-IL", { hour:"2-digit", minute:"2-digit" }) : "—";
const Admin = {
  stats:{}, loadedAt:0, loadErr:null, timer:null,
  open(tab){
    if (!(CLOUD && Cloud.isSuper)) return openAdmin();
    closeSheet(); S.adminTab = tab || S.adminTab || "over"; S.adminFam = null;
    $("#admin").hidden = false; document.body.classList.add("admin-open"); this.render(); this.loadStats();
    if (S.adminTab === "push") this.pushLoad();
    clearInterval(this.timer); this.timer = setInterval(() => { if (!document.hidden && !$("#admin").hidden) this.loadStats(); }, 60e3);
  },
  close(){ $("#admin").hidden = true; document.body.classList.remove("admin-open"); S.adminTab = null; clearInterval(this.timer); this.timer = null; Announce.next(); },
  /* the counters are read once when the screen opens, on "רענן", and at most every 10 minutes while it stays open */
  async loadStats(force){
    if (!force && this.loadedAt && Date.now() - this.loadedAt < 10 * 60e3) return;
    if (this._loading) return; this._loading = true;
    const F = Cloud.fb;
    try {
      const qs = await F.getDocs(F.collection(Cloud.db, "stats"));
      this.stats = {}; const old = iso(new Date(Date.now() - 40 * DAYMS));
      qs.docs.forEach(d => {
        const x = this.stats[d.id] = d.data();
        // keep the per-day counters short
        const patch = {};
        ["days", "errs"].forEach(f => Object.keys(x[f] || {}).filter(k => k < old).forEach(k => patch[f + "." + k] = F.deleteField()));
        if (Object.keys(patch).length && !qs.metadata.fromCache) F.updateDoc(d.ref, patch).catch(() => {});
      });
      this.loadErr = qs.metadata.fromCache ? "offline" : null; this.loadedAt = Date.now();
    } catch(e){ console.warn("[stats]", e); this.loadErr = String(e && e.code || "error"); this.loadedAt = Date.now(); }
    this._loading = false;
    if (!$("#admin").hidden && !uiBusy()) this.render();

/* re-render after a remote change, but never under the user's fingers */
function uiBusy(){
  const a = document.activeElement;
  return !!($("#sheetRoot").innerHTML || document.querySelector(".cfm-scrim") || S.take || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a)));
}
function softRender(){
  if (!me || $("#app").hidden) return;
  if (uiBusy()){ Cloud.pendingRender = true; return; }
  Cloud.pendingRender = false; render();
}
setInterval(() => { if (Cloud.pendingRender) softRender(); }, 1200);

/* ================= State ================= */
let me = null;
const S = { shopList:"super", surveyOpen:null, tab:"today", taskView:"active", take:false, takeSel:new Set(), calMonth:null, calSel:iso(new Date()), addMore:false };

/* ================= Shell ================= */
const TABS = [["today","היום","home"],["tasks","משימות","chk"],["shop","קניות","cart"],["cal","יומן","cal"],["ideas","רעיונות","bulb"]];
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l,i]) =>
    `<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${icon(i)}<span>${l}</span></button>`).join("");
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
function go(tab, fromBack){ if (!fromBack && S.tab !== tab){ Back.prev.push(S.tab); if (Back.prev.length > 20) Back.prev.shift(); } S.tab = tab; if (tab!=="shop"){ S.take=false; } render(); window.scrollTo(0,0); }
/* swipe between the main screens — Hebrew order: swipe right → next screen (the one to the left in the bar), left → back.
   Never from inside text fields, sideways-scrolling strips, open windows, or the screen edges (Android's back gesture). */
function slideTo(tab, dir){
  go(tab);
  const sc = document.getElementById("screen"); if (!sc) return;
  sc.classList.remove("sw-l", "sw-r"); void sc.offsetWidth; sc.classList.add(dir > 0 ? "sw-l" : "sw-r");
}
(() => {
  const app = document.getElementById("app"); if (!app) return;
  let sx = 0, sy = 0, t0 = 0, armed = false;
  const sideways = el => { for (let e = el; e && e !== app; e = e.parentElement) if (e.scrollWidth > e.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(e).overflowX)) return true; return false; };
  const blocked = el => !!el.closest("input,textarea,select,[contenteditable],nav.tabs,[data-noswipe]") || sideways(el);
  app.addEventListener("touchstart", e => {
    armed = false;
    if (!me || e.touches.length !== 1 || uiBusy() || !$("#admin").hidden) return;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; t0 = Date.now();
    armed = sx > 24 && sx < innerWidth - 24 && !blocked(e.target);
  }, { passive:true });
  app.addEventListener("touchend", e => {
    if (!armed) return; armed = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - t0 > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    const order = TABS.map(x => x[0]), k = order.indexOf(S.tab) + (dx > 0 ? 1 : -1);
    if (k >= 0 && k < order.length) slideTo(order[k], dx > 0 ? 1 : -1);
  }, { passive:true });
})();

/* ================= the phone's back button =================
   Back closes whatever is open (photo, dialog, window, admin), then steps back through the screens.
   On the home screen, the first press only warns — a second press within 2 seconds leaves the app. */
const Back = {
  prev:[], on:false, warnT:null,
  init(){
    if (this.on) return; this.on = true;
    try { history.replaceState({ nido:"base" }, ""); history.pushState({ nido:"top" }, ""); } catch(e){}
    addEventListener("popstate", () => this.pop());
    // Chrome may skip history entries the user never touched — re-arm on the first touch
    document.addEventListener("pointerdown", () => { if (me && (!history.state || history.state.nido !== "top")) this.arm(); }, true);
  },
  arm(){ try { history.pushState({ nido:"top" }, ""); } catch(e){} },
  pop(){
    if (!me) return;
    if (this.close()){ this.arm(); return; }
    // home screen, nothing open: stay one step from leaving, and warn
    toast("לחיצה נוספת על חזור תצא מהאפליקציה");
    clearTimeout(this.warnT);
    this.warnT = setTimeout(() => { if (me && history.state && history.state.nido === "base") this.arm(); }, 2000);
  },
  close(){
    if (Viewer.el){ Viewer.close(); return true; }
    const ns = document.querySelector(".note-scrim");
    if (ns){ const x = ns.querySelector(".send .x"); if (x) x.click(); return true; }      // writing a note: cancel; a received note waits for "קיבלתי"
    const dlg = [...document.querySelectorAll(".cfm-scrim")].pop();
    if (dlg){ const go = dlg.querySelector(".upd .go, .upd .skip"); if (go) go.click(); else dlg.click(); return true; }
    if ($("#sheetRoot").innerHTML){ closeSheet(); return true; }
    if (!$("#admin").hidden){ if (S.adminFam){ S.adminFam = null; Admin.render(); } else Admin.close(); return true; }
    if (S.take){ S.take = false; S.takeSel = new Set(); render(); return true; }
    if (S.tab !== "today"){ let p = this.prev.pop(); while (p === S.tab) p = this.prev.pop(); go(p || "today", true); return true; }
    return false;
  },
};
function render(){
  Skin.sync();
  renderTabs();
  const fn = { today:renderToday, tasks:renderTasks, shop:renderShop, cal:renderCal, ideas:renderIdeas }[S.tab];
  fn();
  if (me && document.getElementById("ambient").classList.contains("on")) setAmbient();
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ================= Today ================= */
function greeting(h){
  if (h>=5 && h<12) return "בוקר טוב";
  if (h>=12 && h<17) return "צהריים טובים";
  if (h>=17 && h<22) return "ערב טוב";
  return "לילה טוב";
}
/* an event's tasks: the idea's (for an idea's event) or the event's own */
function evTasks(ev){ const idea = ev.ideaId && DB.ideas.find(x => x.id === ev.ideaId); return idea ? ideaTasks(idea) : DB.tasks.filter(t => t.eventId === ev.id); }
/* tasks that belong to an event show inside its card, not as tiles of their own */
const onEvent = t => !!t.eventId || (!!t.ideaId && DB.events.some(e => e.ideaId === t.ideaId && e.date === t.date));
function upcoming(){
  const now = new Date(), today = iso(now);
  const list = [
    ...DB.events.map(e => ({ kind:"event", ty:"ev", ref:e, title:e.title, date:e.date, time:e.time, place:e.place })),
    ...DB.tasks.filter(t => !t.done && t.date && !onEvent(t)).map(t => ({ kind:"task", ty:t.kind==="shop"?"sh":"tk", ref:t, title:t.title, date:t.date, time:t.time, who:t.assignee })),
  ].filter(x => x.time ? new Date(`${x.date}T${x.time}`) >= now : x.date >= today);

  const out = list.sort((a,b) => key(a) < key(b) ? -1 : 1).slice(0, UPCOMING_COUNT);
  // room left? fill it with open tasks that have no date, oldest first
  if (out.length < UPCOMING_COUNT){
    const undated = DB.tasks.filter(t => !t.done && !t.date && !onEvent(t)).sort((a,b) => a.created - b.created)
      .map(t => { const shop = t.kind==="shop", n = shop ? DB.shop.filter(i=>i.taskId===t.id).length : 0;
        return { kind:"task", ty:shop?"sh":"tk", ref:t, title: shop ? `קניות · ${n} פריטים` : t.title, date:null, time:null, who:t.assignee }; });
    out.push(...undated.slice(0, UPCOMING_COUNT - out.length));
  }

}

function shopItemsOf(task){ return task.done ? (task.items||[]) : DB.shop.filter(i => i.taskId===task.id).map(i=>i.name); }
function taskRow(t){

function sortActive(a,b){
  if (a.date && b.date) return `${a.date}${a.time||"99"}` < `${b.date}${b.time||"99"}` ? -1 : 1;
  if (a.date) return -1; if (b.date) return 1;

}

function completeTask(t){
  t.done = true; t.doneAt = Date.now(); t.doneBy = me;

    t.items = DB.shop.filter(i=>i.taskId===t.id).map(i=>i.name);

      const st = DB.tasks.find(x => x.id===i.fromTask); if (st && !st.done){ st.done = true; st.doneAt = Date.now(); st.doneBy = me; delete st.shopItemId; }
    });
    DB.shop = DB.shop.filter(i=>i.taskId!==t.id);

}

        <span class="body"><div class="name">${esc(i.name)}</div>${sub?`<div class="sub">${sub}</div>`:""}</span>
        ${i.takenBy && USERS[i.takenBy] ? `<span class="who" style="--c:${USERS[i.takenBy].color}"><i style="${avaStyle(USERS[i.takenBy])}">${initial(USERS[i.takenBy])}</i>${esc(USERS[i.takenBy].name)} לוקח</span>` : ""}
      </button></li>`;
    }).join("") : `<li class="empty">הרשימה ריקה. ראית שחסר משהו? הוסף אותו כאן.</li>` }</ul>
    ${S.take ? (() => { const mineNow = new Set(items.filter(i => i.takenBy===me).map(i => i.id));
        const add = [...S.takeSel].filter(id => !mineNow.has(id)).length, drop = [...mineNow].filter(id => !S.takeSel.has(id)).length;
        return `<div class="takebar"><div class="row">
      <button class="secondary" id="takeCancel">ביטול</button>
      <button class="primary" id="takeOk">${icon("hand")}${add ? `אני לוקח (${add})` : `לא לוקח (${drop})`}</button></div></div>`; })() : ""}`;

  {
    const f = $("#af");
    f.name.oninput = () => { f.querySelector(".go").disabled = !f.name.value.trim(); if (f.name.value.trim() && !S.addMore){ S.addMore=true; f.querySelector(".addmore").hidden=false; } };
    f.onsubmit = e => {
      e.preventDefault(); const name=f.name.value.trim(); if(!name) return;
      DB.shop.push({ id:uid(), name, qty:f.qty.value.trim(), note:f.note.value.trim(), takenBy:null, taskId:null, list:S.shopList });
      save(); S.addMore=false; renderShop(); $("#af").name.focus();
    };
    bindSeg();
  }
  if (S.take){
    $("#takeCancel").onclick = () => { S.take=false; S.takeSel=new Set(); renderShop(); };
    $("#takeOk").onclick = confirmTake;
  }
  $("#slist").onclick = e => {
    const b = e.target.closest(".item"); if (!b) return;
    const id = b.dataset.id, it = DB.shop.find(i=>i.id===id); if (!it) return;
    // the checkbox: mark / unmark right away; "אני לוקח" at the bottom confirms. The name opens the item.
    if (e.target.closest(".box")){
      if (it.takenBy && it.takenBy !== me){ toast(`${USERS[it.takenBy] ? USERS[it.takenBy].name : "מישהו"} כבר לוקח את זה`); return; }
      if (!canEdit()) return;
      const mineNow = new Set(DB.shop.filter(i=>i.takenBy===me && i.list===S.shopList).map(i=>i.id));
      if (!S.take){ S.take = true; S.takeSel = new Set(mineNow); }
      S.takeSel.has(id) ? S.takeSel.delete(id) : S.takeSel.add(id);
      if (S.takeSel.size === mineNow.size && [...mineNow].every(x => S.takeSel.has(x))){ S.take = false; S.takeSel = new Set(); }
      renderShop(); return;
    }
    itemSheet(it);
  };
}
function confirmTake(){
  let task = myShopTask();
  if (!task && S.takeSel.size){
    task = { id:uid(), kind:"shop", title:"קניות", assignee:me, date:null, time:null, repeat:"none", done:false, created:Date.now() };
    DB.tasks.push(task);
  }
  const existed = task && DB.shop.some(i=>i.taskId===task.id);
  for (const i of DB.shop){
    if (S.takeSel.has(i.id)){ i.takenBy=me; i.taskId=task.id; }
    else if (i.takenBy===me && i.list===S.shopList){ i.takenBy=null; i.taskId=null; }
  }
  if (task && !DB.shop.some(i=>i.taskId===task.id)) DB.tasks = DB.tasks.filter(t=>t.id!==task.id);
  save(); S.take=false; renderShop();
  toast(S.takeSel.size ? (existed ? "משימת הקניות שלך עודכנה" : "נוצרה משימת קניות 🛒") : "הפריטים חזרו לרשימה");
  S.takeSel = new Set();
}
function releaseItem(i){
  const tid = i.taskId; i.takenBy=null; i.taskId=null;
  if (tid && !DB.shop.some(x=>x.taskId===tid)) DB.tasks = DB.tasks.filter(t=>t.id!==tid);
}

}


/* ================= Market survey ================= */
const ils = n => (n==null || n==="") ? "—" : "₪" + Number(n).toLocaleString("he-IL");
const warrTxt = m => !m ? "—" : m % 12 === 0 ? (m===12 ? "שנה" : m===24 ? "שנתיים" : `${m/12} שנים`) : `${m} חודשים`;
const surveyTask = s => s.taskId && DB.tasks.find(t => t.id===s.taskId);
function offerStats(s){
  const ps = s.offers.map(o => +o.price).filter(n => n > 0);
  const min = ps.length ? Math.min(...ps) : null, max = ps.length ? Math.max(...ps) : null;
  const wmax = Math.max(0, ...s.offers.map(o => +o.warranty || 0));
  return { min, max, gap: ps.length > 1 ? max - min : null, wmax };
}
function renderSurvey(){

    ${ DB.survey.length ? [...DB.survey].sort((a,b)=>b.created-a.created).map(s => {

        return `<button class="sv-card" data-sv="${s.id}">
          <div class="row"><div><h3>${esc(s.title)}</h3>
            <div class="sub">${s.offers.length ? `${s.offers.length} הצעות` : "עוד אין הצעות"}${s.note?` · ${esc(s.note)}`:""}</div></div>
            <div class="from">${st.min!=null?`החל מ־<b>${ils(st.min)}</b>`:""}</div></div>
          <div class="thumbs">${s.offers.slice(0,6).map(o => `<span>${o.image?`<img src="${o.image}" alt="">`:esc((o.store||"?")[0])}</span>`).join("")}</div>
          ${ch ? `<div style="margin-top:10px">${t && t.done ? `<span class="badge done">${icon("tick")}נקנה ב${esc(ch.store)}</span>` : `<span class="badge pick">${icon("tick")}נבחר: ${esc(ch.store)} · ${ils(ch.price)}</span>`}</div>` : ""}
        </button>`; }).join("") : `<div class="t-empty">אין עדיין סקרי שוק. מה אתם שוקלים לקנות?</div>` }`;
  bindSeg();

function renderSurveyItem(s){

function pickOffer(s, o){
  let t = surveyTask(s);
  if (s.chosen===o.id){                                    // un-choose
    s.chosen = null; if (t && !t.done) DB.tasks = DB.tasks.filter(x => x.id!==t.id); s.taskId = null;
    save(); renderShop(); toast("הבחירה בוטלה"); return;
  }
  s.chosen = o.id;
  const title = `לקנות ${s.title} · ${o.store} · ${ils(o.price)}`;
  if (t && !t.done) t.title = title;
  else { t = { id:uid(), kind:"survey", surveyId:s.id, title, assignee:null, date:null, time:null, repeat:"none", done:false, created:Date.now() }; DB.tasks.push(t); s.taskId = t.id; }
  save(); renderShop(); toast("נבחר · נוצרה משימה במסך המשימות");
}
function pickImage(input, done){
  const file = input.files[0]; if (!file) return;
  const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 600/Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = im.width*k; c.height = im.height*k; c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    done(c.toDataURL("image/jpeg", .72)); }; im.src = r.result; }; r.readAsDataURL(file);
}

/* ================= Coupons & gift cards ================= */
const CPK = { gift:["גיפט קארד","gift"], coupon:["קופון","tick"], voucher:["שובר","bulb"], credit:["זיכוי","repeat"] };
const hasMoney = c => c.kind !== "coupon" && c.balance !== "" && c.balance != null;
const daysLeft = c => c.expires ? Math.round((parse(c.expires) - new Date(new Date().toDateString())) / 864e5) : null;
const cpExpired = c => { const d = daysLeft(c); return d != null && d < 0; };
function expTxt(c){
  const d = daysLeft(c); if (d == null) return `<span class="cp-exp">ללא תוקף</span>`;
  if (d < 0) return `<span class="cp-exp">פג תוקף</span>`;
  const soon = d <= 14, t = d===0 ? "פג היום" : d===1 ? "פג מחר" : d <= 60 ? `עוד ${d} ימים` : `עד ${pad(parse(c.expires).getDate())}/${pad(parse(c.expires).getMonth()+1)}/${String(parse(c.expires).getFullYear()).slice(-2)}`;
  return `<span class="cp-exp ${soon?"soon":""}">${icon("clock")}${t}</span>`;
}
function cpCard(c, dim){
  const [kl, ki] = CPK[c.kind] || CPK.gift;
  const val = c.kind==="coupon" ? `<b>${esc(c.discount||"")}</b><small>הנחה</small>` : hasMoney(c) ? `<b>${ils(c.balance)}</b><small>${+c.value && +c.value !== +c.balance ? `מתוך ${ils(c.value)}` : "יתרה"}</small>` : "";
  const code = c.code ? `<span class="code">${esc(c.code.length > 10 ? "•••• " + c.code.slice(-4) : c.code)}</span>` : `<span></span>`;
  return `<button class="cp-card cp-${c.kind} ${dim?"dim":""}" data-cp="${c.id}">
    <div class="row"><div><span class="kind">${icon(ki)}${kl}</span><h3>${esc(c.title)}</h3>${c.store?`<div class="store">${esc(c.store)}</div>`:""}</div><div class="val">${val}</div></div>
    <div class="bot">${code}${c.archived ? `<span class="cp-exp">מומש</span>` : expTxt(c)}</div></button>`;
}
function renderCoupons(){
  const active = DB.coupons.filter(c => !c.archived && !cpExpired(c))
    .sort((a,b) => (a.expires||"9999") < (b.expires||"9999") ? -1 : 1);
  const old = DB.coupons.filter(c => c.archived || cpExpired(c));
  const total = active.filter(hasMoney).reduce((s,c) => s + (+c.balance||0), 0);
  const soon = active.filter(c => { const d = daysLeft(c); return d != null && d <= 14; }).length;
  $("#screen").innerHTML = `
    <header class="top"><h1>קניות</h1><button class="add-btn" id="addCp">${icon("plus")}הוספה</button></header>
    ${listsSeg()}
    <div class="cp-sum"><div>יתרה בכרטיסים<b>${ils(total)}</b></div><div class="${soon?"warn":""}">פגים בשבועיים הקרובים<b>${soon}</b></div></div>
    <div id="cpList">${ active.length ? active.map(c => cpCard(c)).join("") : `<div class="t-empty">אין קופונים פעילים. קיבלתם גיפט קארד או זיכוי? הוסיפו אותו כאן.</div>` }</div>
    ${old.length ? `<button class="cp-more" id="cpOld">${S.cpOld ? "הסתרת" : "הצגת"} ${old.length} שמומשו / פג תוקפם</button>
      ${S.cpOld ? `<div id="cpOldList">${old.map(c => cpCard(c, true)).join("")}</div>` : ""}` : ""}`;
  bindSeg();

}

/* ================= Calendar ================= */
/* ---------- Shabbat & holidays (Hebcal, Tel Aviv), cached for a day ---------- */
const Hol = {
  KEY: "nido.hebcal.v1", data: null, loading: false,
  load(){
    if (!this.data){ try { this.data = JSON.parse(localStorage.getItem(this.KEY)); } catch(e){} }
    const city = FAM.city || "293397";
    const fresh = this.data && this.data.city === city && Date.now() - this.data.at < 864e5 && this.data.from <= iso(addDays(new Date(), -40));
    if (fresh || this.loading || !navigator.onLine) return;
    this.loading = true;
    const from = iso(addDays(new Date(), -60)), to = iso(addDays(new Date(), 420));
    fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&ss=on&mf=on&c=on&geo=geoname&geonameid=${city}&M=on&s=off&lg=he&start=${from}&end=${to}`)
      .then(r => r.json()).then(j => {
        const by = {};
        const add = (d, x) => (by[d] = by[d] || []).push(x);
        for (const it of j.items || []){
          const d = it.date.slice(0, 10), name = (it.hebrew || it.title || "").trim();
          if (it.category === "candles") add(d, { k:"candles", t: it.date.slice(11, 16) });
          else if (it.category === "havdalah") add(d, { k:"havdalah", t: it.date.slice(11, 16) });
          else if (it.category === "holiday"){
            if (it.subcat === "modern" && !/עצמאות|הזיכרון לחללי|השואה|ירושלים/.test(name)) continue;
            add(d, { k: it.subcat === "major" ? "major" : "minor", n: name.replace(/\s*\(.*?\)\s*/g, " ").trim() });
          } else if (it.category === "roshchodesh") add(d, { k:"rc", n: name });
        }
        this.data = { at: Date.now(), from, by, city };
        try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
        if (S.tab === "cal" && !uiBusy()) renderCal();
      }).catch(() => {}).finally(() => { this.loading = false; });
  },
  of(ds){ return (this.data && this.data.by[ds]) || []; },
};

/* ---------- what happens on a day ---------- */
const SHAB = "#E8C46A";
const TOGETHER_DEF = "#F2B66B";
const together = () => FAM.together || TOGETHER_DEF;            // the family's "יחד" colour (system admin can change it)
const colOf = who => who && USERS[who] ? USERS[who].color : together();
function dayItems(ds){
  const ev = DB.events.filter(e => e.date === ds || (e.end && e.date < ds && e.end >= ds))
    .map(e => ({ k:"ev", id:e.id, title:e.title, time: e.date === ds ? e.time : "", who: e.who || null, place:e.place, cont: e.date !== ds, idea: !!e.ideaId }));
  const tk = DB.tasks.filter(t => t.date === ds)
    .map(t => ({ k:"tk", id:t.id, title: t.kind === "shop" ? "קניות" : t.title, time:t.time || "", who:t.assignee || null, done:t.done }));
  return [...ev, ...tk].sort((a, b) => (a.time || "99") < (b.time || "99") ? -1 : (a.time || "99") > (b.time || "99") ? 1 : 0);
}
const holLine = h => h.k === "candles" ? `כניסת שבת ${h.t}` : h.k === "havdalah" ? `צאת שבת ${h.t}` : h.n;
function openItem(k, id){

  else { const t = DB.tasks.find(x => x.id === id); if (t) taskSheet(t); }

const startOfWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; };

function renderCal(){

/* ===== week: family board ===== */
/* first name only — unless two people share it, then add the surname's initial (or the full name) */
function shortName(k, among){
  const words = n => String(n || "").trim().split(/\s+/), u = USERS[k]; if (!u) return "";
  const first = words(u.name)[0], same = (among || people()).filter(x => x && x !== k && USERS[x] && words(USERS[x].name)[0] === first);
  if (!same.length) return first;
  const ini = n => (words(n)[1] || "")[0] || "";
  const mine = ini(u.name);
  if (mine && !same.some(x => ini(USERS[x].name) === mine)) return `${first} ${mine}׳`;
  return u.name.trim();
}
function renderWeek(){
  const today = iso(new Date());
  if (!S.calWeek) S.calWeek = iso(startOfWeek(parse(S.calSel || today)));
  const ws = parse(S.calWeek), days = [...Array(7)].map((_, i) => iso(addDays(ws, i))), we = parse(days[6]);
  const SLOTS = 3;                                               // three slots a day; they fill in order, more → another row
  const range = ws.getMonth() === we.getMonth() ? `${ws.getDate()}–${we.getDate()} ב${MONTHS[ws.getMonth()]}` : `${ws.getDate()} ב${MONTHS[ws.getMonth()]} – ${we.getDate()} ב${MONTHS[we.getMonth()]}`;
  let nEv = 0, nTk = 0; const shabbat = days.flatMap(d => Hol.of(d)).find(h => h.k === "candles");
  const rows = days.map(ds => {
    const d = parse(ds), items = dayItems(ds), hol = Hol.of(ds);
    items.forEach(x => x.k === "ev" ? (!x.cont && nEv++) : (!x.done && nTk++));
    const n = Math.max(SLOTS, Math.ceil(items.length / SLOTS) * SLOTS);
    const cells = [...Array(n)].map((_, i) => { const x = items[i];
      if (!x) return `<div class="cv-cell" data-d="${ds}"></div>`;
      const u = x.who && USERS[x.who];
      return `<div class="cv-cell"><button class="cv-x ${x.k} ${x.done ? "done" : ""}" style="--c:${colOf(x.who)}" data-k="${x.k}" data-id="${x.id}">
          ${u ? `<i class="cv-who" style="background:${u.color};${avaStyle(u)}" title="${esc(u.name)}">${initial(u)}</i>` : ""}
          ${x.time ? `<b class="tabular">${x.time}</b>` : x.cont ? `<b>המשך</b>` : ""}${x.k === "tk" && x.done ? "✓ " : ""}${esc(x.title)}</button></div>`;
    }).join("");
    const strips = hol.filter(h => h.k !== "rc").map(h => `<div class="cv-strip ${h.k}" style="grid-column:2 / -1">${h.k === "candles" ? icon("candle") : ""}<span>${esc(holLine(h))}</span></div>`).join("");
    const rc = hol.find(h => h.k === "rc");
    const quiet = !items.length && strips;
    const span = (quiet ? 0 : n / SLOTS) + hol.filter(h => h.k !== "rc").length;
    return `<div class="cv-row ${ds === today ? "today" : ""} ${d.getDay() === 6 ? "sat" : ""}" style="grid-template-columns:52px repeat(${SLOTS},1fr)">
      <button class="cv-dl" data-day="${ds}" style="grid-row:span ${Math.max(span, 1)}"><small>${"אבגדהוש"[d.getDay()]}׳</small><b>${d.getDate()}</b>${rc ? `<i>ר״ח</i>` : ""}</button>
      ${quiet ? "" : cells}${strips}</div>`;
  }).join("");
  $("#screen").innerHTML = `${calTop(range, "שבוע קודם", "שבוע הבא", !days.includes(today))}
    <div class="cv-sum">
      <div><b class="tabular">${nEv}</b><small>${nEv === 1 ? "אירוע" : "אירועים"}</small></div>
      <div><b class="tabular">${nTk}</b><small>${nTk === 1 ? "משימה פתוחה" : "משימות פתוחות"}</small></div>
      <div class="sh"><b class="tabular">${shabbat ? shabbat.t : "—"}</b><small>🕯 כניסת שבת</small></div>
    </div>
    <div class="cv-legend">${people().map(k => `<span><i style="background:${USERS[k].color}"></i>${esc(USERS[k].name)}</span>`).join("")}<span><i style="background:${together()}"></i>יחד</span></div>
    <div class="cv-board">${rows}</div>
    <p class="hint cv-hint">לחיצה על תאריך פותחת את היום בציר זמן · משבצת ריקה מוסיפה אירוע.</p>`;
  const step = n => { S.calWeek = iso(addDays(parse(S.calWeek), n)); renderWeek(); };
  bindCalCommon(() => step(-7), () => step(7), () => { S.calWeek = iso(startOfWeek(new Date())); S.calSel = today; renderWeek(); });
  $("#screen").querySelector(".cv-board").onclick = e => {
    const x = e.target.closest(".cv-x"); if (x) return openItem(x.dataset.k, x.dataset.id);
    const dl = e.target.closest("[data-day]"); if (dl){ S.calSel = dl.dataset.day; S.calView = "day"; renderCal(); window.scrollTo(0, 0); return; }
    const c = e.target.closest(".cv-cell[data-d]"); if (c && canEdit()) eventSheet(null, { date:c.dataset.d });
  };
}

/* ===== month: rich grid ===== */
function renderMonth(){
  if (!S.calMonth){ const n = new Date(); S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth(), today = iso(new Date());
  const gStart = startOfWeek(new Date(y, mo, 1)), weeks = Math.ceil((new Date(y, mo, 1).getDay() + new Date(y, mo + 1, 0).getDate()) / 7);
  let cells = "";
  for (let i = 0; i < weeks * 7; i++){
    const d = addDays(gStart, i), ds = iso(d), out = d.getMonth() !== mo;
    const items = dayItems(ds), hol = Hol.of(ds).filter(h => h.k !== "rc");
    const chips = [
      ...hol.filter(h => h.k === "major" || h.k === "minor").map(h => `<span class="cv-ev hol" style="--c:${SHAB}">${esc(h.n)}</span>`),
      ...items.map(x => `<span class="cv-ev ${x.k} ${x.done ? "done" : ""}" style="--c:${colOf(x.who)}">${x.cont ? "↤ " : ""}${esc(x.title)}</span>`),
      ...hol.filter(h => h.k === "candles").map(h => `<span class="cv-ev hol" style="--c:${SHAB}">🕯 ${h.t}</span>`),
    ];
    const max = 3, extra = chips.length - max;
    cells += `<button class="cv-c ${out ? "out" : ""} ${ds === today ? "today" : ""} ${ds === S.calSel ? "sel" : ""} ${d.getDay() === 6 ? "sat" : ""}" data-d="${ds}" aria-label="${d.getDate()} ב${MONTHS[d.getMonth()]}">
      <b>${d.getDate()}</b>${chips.slice(0, extra > 0 ? max - 1 : max).join("")}${extra > 0 ? `<span class="cv-more">+${extra + 1}</span>` : ""}</button>`;
  }
  const sel = parse(S.calSel), items = dayItems(S.calSel), hol = Hol.of(S.calSel);
  const dayName = S.calSel === today ? "היום" : S.calSel === iso(addDays(new Date(), 1)) ? "מחר" : `יום ${DAYS[sel.getDay()]}`;
  $("#screen").innerHTML = `${calTop(`${MONTHS[mo]} ${y}`, "חודש קודם", "חודש הבא", !(y === new Date().getFullYear() && mo === new Date().getMonth()))}
    <div class="cv-month">
      <div class="cv-dow">${["א","ב","ג","ד","ה","ו","ש"].map(x => `<span>${x}</span>`).join("")}</div>
      <div class="cv-grid">${cells}</div>
    </div>
    <section class="cv-day">
      <h3><button class="cv-open" id="cvOpenDay">${dayName} · ${sel.getDate()}/${sel.getMonth() + 1} ${icon("next")}</button><small>${items.length ? (items.length === 1 ? "דבר אחד" : items.length + " דברים") : ""}</small></h3>
      ${hol.map(h => `<div class="cv-hl">${h.k === "candles" ? icon("candle") : ""}${esc(holLine(h))}</div>`).join("")}
